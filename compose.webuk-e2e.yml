# =============================================================================
# Disposable web-uk journey environment — LOCAL DEVELOPMENT ONLY
# =============================================================================
#
# Why this exists
# ---------------
# 🔴 web-uk journey testing had been running against the ORDINARY local database
# (`nexus`), which is a production-derived snapshot containing real members' names,
# emails and messages. That made three things impossible or unsafe:
#   - deletion and destructive journeys (they would destroy real records);
#   - committing screenshots (they embed real member names — a public repo);
#   - upload journeys (they write real rows and real files).
# It also meant every "live runtime" claim was made against data nobody may alter,
# which is why the rubric scored that row 45/150 with -60 for "no disposable
# environment".
#
# This overlay provisions a SEPARATE Laravel application against a SEPARATE database
# (`nexus_webuk_e2e`) seeded with SYNTHETIC fixtures only, plus a web-uk instance
# pointed at it. Nothing here shares state with `nexus`.
#
# 🔴 What it deliberately does NOT touch
#   - the `nexus` database (the production-derived snapshot) — never
#   - the `nexus_test` database — PHPUnit owns it, and `migrate:fresh` wipes it, so
#     sharing it would make the two suites destroy each other
#   - production, in any form. This file must NEVER be added to
#     compose.bluegreen.yml or any deployment script.
#
# It reuses the existing `db` and `redis` services rather than starting its own, so
# the cost is one extra PHP container and one extra Node container.
#
# Usage
# -----
#   bash scripts/webuk-e2e-env.sh up        # provision DB + seed + start
#   bash scripts/webuk-e2e-env.sh reset     # wipe the DB back to seeded state
#   bash scripts/webuk-e2e-env.sh down      # stop the containers
#
#   Laravel:  http://127.0.0.1:8091
#   web-uk:   http://127.0.0.1:5181
#
# Ports are deliberately +1 from the ordinary stack (8090/5180) so a journey run can
# never accidentally address the real one.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Laravel, against the disposable database
  # ---------------------------------------------------------------------------
  webuk-e2e-app:
    profiles:
      - webuk-e2e
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-webuk-e2e-app
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "8091:80"
    volumes:
      - .:/var/www/html:cached
      # Shared with the ordinary app service on purpose: vendor/ is identical and
      # extracting it twice on this Windows mount is slow enough to matter.
      - nexus-vendor:/var/www/html/vendor
      # 🔴 Storage and uploads are SEPARATE volumes, not shared. Upload journeys must
      # not write into the volume the ordinary stack serves real members from.
      - nexus-webuk-e2e-uploads:/var/www/html/uploads
      - nexus-webuk-e2e-httpdocs-uploads:/var/www/html/httpdocs/uploads
      - nexus-webuk-e2e-storage:/var/www/html/storage
      - nexus-webuk-e2e-bootstrap-cache:/var/www/html/bootstrap/cache
    environment:
      - DB_TYPE=mysql
      - DB_HOST=db
      - DB_PORT=3306
      # 🔴 The whole point of this file. Never change either of these to `nexus`.
      #
      # 🔴 BOTH keys are required, and this bit us on first run. `config/database.php:27`
      # resolves `env('DB_DATABASE', env('DB_NAME', 'nexus'))` — DB_DATABASE WINS. Setting
      # only DB_NAME left DB_DATABASE to be supplied by a dotenv file, and the seeder wrote
      # into `nexus_test` instead of here. Always set both.
      - DB_DATABASE=nexus_webuk_e2e
      - DB_NAME=nexus_webuk_e2e
      - DB_USER=nexus
      - DB_PASS=nexus_secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # 🔴 `CACHE_PREFIX`, not `REDIS_PREFIX`. This overlay originally set REDIS_PREFIX and
      # CLAIMED Redis isolation it did not have: `config/database.php` hardcodes the redis
      # prefix to '' and `config/cache.php` reads `CACHE_PREFIX` (default 'nexus_laravel'),
      # so this environment was writing cache, session and RATE-LIMIT keys into the same
      # namespace as the ordinary local stack.
      #
      # It caused a wrong conclusion, not just untidiness: the account-deletion endpoint
      # allows 3 attempts per hour, that counter lives in Redis, and a database `reset` does
      # not clear it — so a working feature reported as broken on the next run.
      - CACHE_PREFIX=webuk_e2e_
      - REDIS_PREFIX=webuk_e2e_
      # 🔴 Deliberately NOT `testing`. `APP_ENV=testing` makes Laravel load the repo's
      # `.env.testing`, which points DB_DATABASE at `nexus_test` — PHPUnit's database.
      # Real process environment variables beat dotenv values, so the explicit
      # DB_DATABASE above is now authoritative either way, but naming the environment
      # `local` removes the trap entirely rather than relying on precedence.
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8091
    depends_on:
      - db
      - redis
    networks:
      - nexus-network

  # ---------------------------------------------------------------------------
  # web-uk, pointed at the disposable Laravel
  # ---------------------------------------------------------------------------
  webuk-e2e-frontend:
    profiles:
      - webuk-e2e
    build:
      context: ./web-uk
      dockerfile: Dockerfile
      target: development
    container_name: nexus-webuk-e2e-frontend
    restart: unless-stopped
    ports:
      - "5181:3001"
    volumes:
      - ./web-uk/src:/app/src:delegated
      - ./web-uk/public:/app/public:delegated
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3001
      - ACCESSIBLE_BACKEND_TARGET=laravel
      # Container-to-container, so no host.docker.internal hop.
      - LARAVEL_BASE_URL=http://webuk-e2e-app:80
      # The browser loads assets directly, so this must be host-reachable.
      - PUBLIC_ASSET_BASE_URL=http://127.0.0.1:8091
      - ACCESSIBLE_TENANT_SLUG=e2e-community
      - COOKIE_SECRET=webuk-e2e-cookie-secret-not-a-real-secret-32
      - SESSION_SECRET=webuk-e2e-session-secret-not-a-real-secret
    depends_on:
      - webuk-e2e-app
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - nexus-network

volumes:
  # Declared external because the ordinary stack already owns it and vendor/ is
  # identical; re-extracting it on this Windows mount is slow enough to matter.
  nexus-vendor:
    external: true
    name: nexus-vendor
  nexus-webuk-e2e-uploads:
  nexus-webuk-e2e-httpdocs-uploads:
  nexus-webuk-e2e-storage:
  nexus-webuk-e2e-bootstrap-cache:

networks:
  nexus-network:
    external: true
    # 🔴 The real network name is `nexus-internal` (compose.yml:331). Getting this
    # wrong makes the containers start but be unable to reach `db`/`redis` by name.
    name: nexus-internal
