# =============================================================================
# Project NEXUS - Blue/Green Stateless Web Stack
# =============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.bluegreen
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-candidate}
    image: nexus-php-app:${BUILD_COMMIT:-candidate}
    container_name: nexus-${NEXUS_COLOR:-green}-php-app
    restart: unless-stopped
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          # PHP memory_limit is 1G, so Apache workers,
          # OPcache, and request peaks have headroom in the active color.
          memory: 2G
        reservations:
          memory: 512M
    ports:
      - "127.0.0.1:${NEXUS_API_PORT:-8190}:80"
    volumes:
      - nexus-php-uploads:/var/www/html/httpdocs/uploads
      - nexus-php-logs:/var/log
      - nexus-php-storage:/var/www/html/storage
      # Shared read/write snapshot cache. The host worker publishes complete
      # renders; Laravel must also be able to perform verified invalidation,
      # tenant-scoped purge, and reset cleanup from authenticated admin flows.
      - nexus-php-prerendered:/var/www/html/storage/prerendered:rw
      # JSONL event log written by scripts/prerender-tenants.sh + deploy phase.
      # Bind-mounted so the admin Events page can tail it.
      - ${DEPLOY_DIR:-/opt/nexus-php}/logs:/var/www/html/storage/logs/host-logs:ro
    env_file:
      - ${NEXUS_ENV_FILE:-.env}
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://api.project-nexus.ie
      - DB_HOST=nexus-php-db
      - DB_PORT=3306
      - REDIS_HOST=nexus-php-redis
      - REDIS_PORT=6379
      - MEILISEARCH_HOST=http://nexus-meilisearch:7700
      - MEILISEARCH_KEY=${MEILISEARCH_KEY}
      # Prerender admin module reads these paths inside the container.
      - PRERENDER_CACHE_PATH=/var/www/html/storage/prerendered
      - PRERENDER_EVENT_LOG=/var/www/html/storage/logs/host-logs/prerender-events.jsonl
    networks:
      - nexus-php-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health.php"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./react-frontend
      dockerfile: Dockerfile.bluegreen
      args:
        VITE_API_BASE: https://api.project-nexus.ie/api
        VITE_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
        VITE_GOOGLE_MAPS_MAP_ID: ${GOOGLE_MAPS_MAP_ID:-}
        VITE_SENTRY_DSN: ${SENTRY_DSN_REACT:-}
        VITE_SENTRY_ENVIRONMENT: production
        VITE_SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
        VITE_PUSHER_KEY: ${PUSHER_KEY:-}
        VITE_PUSHER_CLUSTER: ${PUSHER_CLUSTER:-eu}
        VITE_GIPHY_API_KEY: ${GIPHY_API_KEY:-}
        VITE_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
        VITE_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
        BUILD_COMMIT: ${BUILD_COMMIT:-candidate}
    image: nexus-react-prod:${BUILD_COMMIT:-candidate}
    container_name: nexus-${NEXUS_COLOR:-green}-react
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    ports:
      - "127.0.0.1:${NEXUS_FRONTEND_PORT:-3100}:80"
    environment:
      - NEXUS_API_UPSTREAM=nexus-${NEXUS_COLOR:-green}-php-app
      - PRERENDER_PHP_UID=${PRERENDER_PHP_UID:-33}
    volumes:
      - nexus-php-prerendered:/usr/share/nginx/html/prerendered
    networks:
      - nexus-php-internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  queue:
    image: nexus-php-app:${BUILD_COMMIT:-candidate}
    container_name: nexus-${NEXUS_COLOR:-green}-php-queue
    # Wait for Redis before starting Horizon. Redis is an external container on
    # the shared network, so compose has no depends_on to order it — when it is
    # not yet reachable (host reboot, VM memory wedge, container fleet
    # auto-start) Horizon's supervisor dies with "RedisException: Connection
    # refused", the container restarts, re-runs `optimize`, and its route:cache
    # step unlinks routes-v7.php while the dying children still read it. That
    # crash loop is what produced the ~600-event Sentry NEXUS-PHP-10 bursts
    # (23/31 Jul, 1/7 Aug 2026) — the missing-routes error is collateral, not
    # the cause. `$$` is the Compose escape for a literal `$`.
    command: sh -c "umask 0002; n=0; until php -d default_socket_timeout=3 -r 'exit(@fsockopen($$argv[1], (int)$$argv[2])?0:1);' -- $$REDIS_HOST $$REDIS_PORT 2>/dev/null; do n=$$((n+1)); if [ $$n -ge 60 ]; then echo '[WARN] Redis unreachable after 120s - starting Horizon anyway'; break; fi; sleep 2; done; php artisan package:discover --ansi 2>/dev/null; php artisan optimize && exec php artisan horizon"
    restart: unless-stopped
    stop_grace_period: 120s
    deploy:
      resources:
        limits:
          # The five-queue baseline uses roughly 779 MiB before bursts. Keep
          # enough headroom for autoscaling, job payloads, and graceful worker
          # overlap during hourly recycling.
          memory: 2G
        reservations:
          memory: 128M
    volumes:
      - nexus-php-logs:/var/log
      - nexus-php-storage:/var/www/html/storage
    env_file:
      - ${NEXUS_ENV_FILE:-.env}
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://api.project-nexus.ie
      - DB_HOST=nexus-php-db
      - DB_PORT=3306
      - REDIS_HOST=nexus-php-redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
    networks:
      - nexus-php-internal
    healthcheck:
      # Master alive is NOT enough — in the 2026-06 outage every horizon:work
      # worker crashed at boot for 5 days while the master kept "healthy".
      # Requiring >=1 horizon:work process is what catches that.
      #
      # 🔴 The patterns are bracketed ON PURPOSE. `pgrep -f` matches the FULL
      # command line, and under CMD-SHELL the checking shell's own argv contains
      # the pattern — so the previous unbracketed form matched ITSELF and this
      # check could never fail. Measured 2026-08-09 in a container with zero
      # Horizon processes: old form exit 0 (reported HEALTHY), bracketed form
      # exit 1 (correctly UNHEALTHY). The check written after the 2026-06
      # five-day outage had therefore never been able to detect it.
      #
      # `[h]orizon:work` matches a real worker's command line but not the
      # literal text "[h]orizon:work" sitting in the checking shell's argv.
      # Keep the brackets on BOTH halves. PID 1 also carries the whole start
      # command as text (which contains "artisan horizon"), so the master half
      # can match while the Redis wait loop is still running — the worker half
      # is what makes this honest.
      test: ["CMD-SHELL", "pgrep -f '[a]rtisan horizon' > /dev/null && pgrep -f '[h]orizon:work' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Was 90s, which predates the Redis readiness wait above. That wait can
      # legitimately hold startup for ~120s before Horizon begins, so 90s would
      # flag a correctly-waiting container as unhealthy. 240s covers the full
      # wait plus Horizon boot. Now that the check can actually fail, this
      # window has to be honest too.
      start_period: 240s

  scheduler:
    image: nexus-php-app:${BUILD_COMMIT:-candidate}
    container_name: nexus-${NEXUS_COLOR:-green}-php-scheduler
    command: sh -c "umask 0002; trap 'php artisan schedule:interrupt >/dev/null 2>&1 || true; exit 0' TERM INT; php artisan optimize && while true; do php artisan schedule:run --no-interaction; sleep 60 & wait $!; done"
    restart: unless-stopped
    stop_grace_period: 90s
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
    volumes:
      - nexus-php-logs:/var/log
      - nexus-php-storage:/var/www/html/storage
      # Phase D backup:verify runs in THIS scheduler container (scheduled daily)
      # and must read the host nightly-backup dir to detect a missing/stale dump.
      # server-nightly-backup.sh writes nexus_db_*.sql.gz to ${DEPLOY_DIR}/backups
      # on the host; mount it read-only (mirrors the host-logs bind on the app
      # service). Without this, backup:verify would false-alarm "no backup"
      # because the container's base_path('backups') is not the host dir.
      - ${DEPLOY_DIR:-/opt/nexus-php}/backups:/var/www/html/storage/backups:ro
    env_file:
      - ${NEXUS_ENV_FILE:-.env}
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://api.project-nexus.ie
      - DB_HOST=nexus-php-db
      - DB_PORT=3306
      - REDIS_HOST=nexus-php-redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      # Point backup:verify at the read-only host-backups mount above.
      - BACKUP_VERIFY_DIR=/var/www/html/storage/backups
    networks:
      - nexus-php-internal
    healthcheck:
      test: ["CMD-SHELL", "tr '\\0' ' ' < /proc/1/cmdline | grep -q 'schedule:run'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  nexus-php-internal:
    external: true

volumes:
  nexus-php-uploads:
    external: true
  nexus-php-logs:
    external: true
  nexus-php-storage:
    external: true
  nexus-php-prerendered:
    external: true
  # NOTE: bootstrap/cache is intentionally NOT a shared volume. Each container
  # uses its own image-baked cache (the Dockerfile bakes packages.php; the
  # queue/scheduler rebuild config/route/event cache at startup via `optimize`).
  # A shared, cross-color external volume caused a TOCTOU: a crash-looping
  # queue's `artisan optimize` deleted routes-v7.php / events.php out from under
  # the scheduler's booting artisan children, producing 2,000+ "Failed to open
  # stream" fatals (Sentry NEXUS-PHP-10) + failed scheduled commands. Do not re-add.
