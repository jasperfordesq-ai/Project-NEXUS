# Single source of truth: which paths wake which CI areas.
#
# Consumed by TWO readers, which is the whole point:
#   1. .github/workflows/ci.yml — both dorny/paths-filter steps (the `changes`
#      job and the `i18n-changed` job) load this file, so push-time skipping
#      decisions come from here.
#   2. scripts/predeploy-ci-verify.mjs — the deploy verifier uses the same
#      lists to decide whether a check's result on an ANCESTOR commit still
#      covers the commit being deployed ("no watched path changed since").
#
# Because both read the same file, the deploy verifier can never disagree with
# CI about what a job depends on. If you change what a job watches, change it
# here and only here.
#
# contracts/ holds shared payload shapes consumed by the PHP backend, the React
# frontend, AND the native mobile client. A contract change must wake all
# three, or a consumer drifts invisibly: mobile/'s .strict() agenda schema sat
# broken for weeks (2026-08-03) because contracts/** appeared in no filter.

php:
  - 'app/**'
  - 'routes/**'
  - 'config/**'
  - 'database/**'
  - 'bootstrap/**'
  - 'tests/**'
  - 'lang/**'
  - 'contracts/**'
  - 'composer.json'
  - 'composer.lock'
  - 'phpunit.xml'
  # 🔴 The static-analysis CONFIG woke nothing when changed — same blind-spot class as
  # Dockerfile.bluegreen below, and worse in one way: a change to phpstan.neon changes
  # what the BLOCKING gate checks for every future build, and CI would not re-run the
  # gate to find out. Proven on 2026-08-19: `reportMagicMethods: true` was added to
  # phpstan.neon, pushed, and the next CI run reported "PHP Static Analysis: skipped"
  # while still showing a green tick.
  - 'phpstan.neon'
  - 'phpstan-baseline.neon'
  - 'scripts/**'
  - 'Dockerfile'
  - 'Dockerfile.prod'
  # The production blue/green image recipe previously woke NOTHING when
  # changed — same blind-spot class as contracts/** before 2026-08-03.
  - 'Dockerfile.bluegreen'
  - 'compose.bluegreen.yml'
  - '.github/workflows/ci.yml'
  - '.github/ci-paths.yml'

frontend:
  - 'react-frontend/**'
  - 'contracts/**'
  # e2e/** woke NOTHING until 2026-08-05 — the same blind-spot class as
  # contracts/** above. The frontend cluster is what RUNS these specs
  # (e2e-smoke and accessibility-check both invoke Playwright from e2e/), so a
  # change to an e2e test or helper could previously be pushed without the job
  # that executes it ever running, and the deploy verifier would inherit a
  # stale pass for it.
  - 'e2e/**'
  - 'playwright.config.ts'
  - '.github/workflows/ci.yml'
  - '.github/ci-paths.yml'

mobile:
  - 'mobile/**'
  - 'contracts/**'
  # 🔴 The two SOURCES the mobile drift checks compare against. Without these the
  # gates are decorative: `parity:check` fails when React gains a member route
  # mobile has not classified, and `api:check` fails when a route mobile calls
  # disappears — but a change to EITHER source lands outside `mobile/**`, so the
  # mobile job would stay asleep through exactly the commit that caused the drift,
  # and only the nightly sweep would ever notice.
  #
  # This is the same blind spot web-uk paid for: Laravel shipped 18 accessible
  # routes while nothing woke a Web UK check, and the deficit went from 1 route to
  # 19 with no report for over a week.
  #
  # Deliberately narrow. `react-frontend/src/routes/**` is the route registry only,
  # not the whole frontend, so ordinary component work does not drag the mobile job
  # in. `routes/**` is what the committed Laravel route inventory is fingerprinted
  # against, so a route change makes the snapshot stale and the check must run to
  # say so.
  - 'react-frontend/src/routes/**'
  - 'routes/**'
  # The mobile job runs this root script over all three sign-up doors, so a
  # change to the script itself must re-run it here as well as in the i18n job.
  - 'scripts/check-age-declaration.mjs'
  - '.github/workflows/ci.yml'
  - '.github/ci-paths.yml'

accessible:
  # 🔴 The Blade accessible frontend was REMOVED on 2026-08-14, along with its CI job.
  # What remains here is the ONE thing that outlived it: the shared PHP translations.
  # `lang/**/govuk_alpha*.php` is the SOURCE web-uk's eleven translation catalogues are
  # generated from, and four non-Blade classes still read that namespace, so a change
  # to it must still wake the checks that validate it.
  - 'lang/**/govuk_alpha*.php'
  - '.github/workflows/ci.yml'
  - '.github/ci-paths.yml'

# ---------------------------------------------------------------------------
# Monorepo siblings (development-only tracks, see docs/PLATFORM-MONOREPO.md).
#
# These wake .github/workflows/platform-contracts.yml, NOT ci.yml.
#
# 🔴 These three lines used to read "and neither appears in
# scripts/predeploy-ci-verify.mjs REQUIRED_JOBS — the ASP.NET backend and Web
# UK frontend are not in any production deploy path." Half of that is now
# wrong and the half that is wrong is the load-bearing half: `web-uk` IS the
# production accessible frontend, it serves three live hostnames, it deploys
# via `scripts/deploy.sh --with-webuk`, and its three `Web UK …` jobs ARE in
# REQUIRED_JOBS as of 2026-08-17. Only `aspnet` is outside the deploy path.
# See the webuk exception below before assuming the two behave alike.
#
# They are listed here anyway so that this file stays the single place where
# "which paths wake which job" is written down, per the rule at the top.
#
# 🔴 Keep these NARROW. Before 2026-08-10 the ASP.NET test suite was woken by
# 'app/**', 'routes/**', 'config/**', 'database/**' and 'react-frontend/**',
# so every ordinary Laravel or React commit paid for a 55-minute .NET test run
# that could not possibly be affected by the change. Do not re-add Laravel or
# React paths here: nothing in aspnet-backend/ is built from them.
#
# 🔴 Most sibling filters below do NOT list this file or
# platform-contracts.yml, unlike every filter above them. The self-reference in
# the php/frontend/mobile/accessible/i18n filters is a SAFETY PROPERTY — if the
# watch-lists themselves change between an ancestor commit and a deploy commit,
# evidence inherited under the old lists must be invalidated, and
# scripts/predeploy-ci-verify.mjs depends on that. For `aspnet` none of that
# applies: it is read only by platform-contracts.yml and appears in no
# REQUIRED_JOBS entry, so a self-reference buys nothing and costs a full
# ~92-runner-minute ASP.NET run on every CI-config edit. The compensating
# control there is the weekly scheduled sweep in platform-contracts.yml plus
# workflow_dispatch; the workflow's own `on: paths:` still lists itself, so a
# YAML error in it still surfaces at trigger time.
#
# 🔴 `webuk` IS the exception, corrected 2026-08-23. This block used to say
# "the four sibling filters" and that none of them appear in any REQUIRED_JOBS
# entry. That stopped being true on 2026-08-17, when the three `Web UK …` jobs
# were added to REQUIRED_JOBS because web-uk is the production accessible
# frontend serving three live hostnames. The safety property therefore now DOES
# apply to webuk, and its absence had a measured cost the same day this was
# corrected: a commit that changed the `Web UK authenticated accessibility` job
# definition — adding the poll fixture its gates walk through — woke no Web UK
# job at all, so Platform contracts reported success with all three Web UK jobs
# SKIPPED and the fix unverified. Result inheritance could likewise hand a
# deploy a `Web UK …` pass earned under a different job definition. The cost is
# bounded: this wakes the Web UK jobs, not the ASP.NET suite.
aspnet:
  - 'aspnet-backend/**'
  # Shared payload shapes the ASP.NET contract tests assert against. Same
  # reasoning as contracts/** in the php/frontend/mobile filters above.
  - 'contracts/**'
  - 'openapi.json'

webuk:
  - 'web-uk/**'
  - 'contracts/**'
  # Self-reference, unlike the aspnet filter above — see the webuk exception in
  # the note above this block. These two define and schedule the deploy-gating
  # `Web UK …` jobs, so a change to either must re-run them rather than let a
  # deploy inherit a pass earned under the old job definition.
  - '.github/workflows/platform-contracts.yml'
  - '.github/ci-paths.yml'
  # 🔴 The Laravel Blade accessible frontend is Web UK's SOURCE OF TRUTH — Web UK
  # exists to reproduce its observable behaviour. A change to Blade is therefore
  # a change to Web UK's specification, and until 2026-08-10 it woke no Web UK
  # check at all.
  #
  # That blind spot has a measured cost. During the pause Laravel shipped 18 new
  # accessible routes (partner venues, the public What's On page, 11
  # guardian/safeguarding settings pages). Web UK went from 1 route behind to 19
  # behind, and nothing reported it for over a week. Same blind-spot class as
  # contracts/** before 2026-08-03 and e2e/** before 2026-08-05.
  # 🔴 The four Blade paths this used to watch (accessible-frontend/**,
  # routes/govuk-alpha*.php, app/Http/Controllers/GovukAlpha/**) were REMOVED on
  # 2026-08-14 along with the Blade accessible frontend itself. They were watched
  # because Blade was the behaviour specification web-uk was measured against; it is
  # neither the specification nor deployed any more.
  #
  # The translations REMAIN watched, and for a stronger reason than before: web-uk's
  # eleven catalogues are generated from them, so a change here really can change what
  # members read on the live accessible site.
  - 'lang/**/govuk_alpha*.php'

# The Laravel-side contract inventory: what the comparison tooling reads when
# it builds the "what does Laravel actually expose" side of the parity report.
contracts_inventory:
  - 'app/**'
  - 'routes/**'
  - 'config/**'
  - 'database/**'
  - 'openapi.json'
  - 'contracts/**'
  - 'scripts/verify-platform-contracts.ps1'

# The React guardrail job only inspects react-frontend/ sources.
react_contracts:
  - 'react-frontend/**'
  - 'contracts/**'

i18n:
  - 'react-frontend/public/locales/**'
  - 'react-frontend/src/**/*.ts'
  - 'react-frontend/src/**/*.tsx'
  - 'lang/**'
  - 'app/**/*.php'
  - 'src/**/*.php'
  - 'scripts/check-i18n*.mjs'
  - 'scripts/check-i18n.sh'
  # Not matched by check-i18n*.mjs above — different prefix.
  - 'scripts/check-admin-i18n*.mjs'
  # Nor by check-admin-i18n*.mjs — the name is check-admin-ui-*.
  - 'scripts/check-admin-ui-literals.mjs'
  - 'scripts/check-php-i18n-coverage.mjs'
  - 'scripts/check-php-lang-parity.mjs'
  - 'scripts/check-php-lang-untranslated.mjs'
  - 'scripts/check-php-lang-json-untranslated.mjs'
  - 'scripts/php-lang-invariant-allowlist.json'
  # The sign-up age declaration compares all three doors, so the two it reads
  # from outside this filter's usual reach are listed explicitly. The native
  # app's door is covered by `mobile/**` in the mobile filter, which runs the
  # same script; without the accessible template below, a commit that deleted
  # the label from that one form would wake only the Web UK jobs, and none of
  # them knows what the other doors say.
  - 'scripts/check-age-declaration.mjs'
  - 'web-uk/src/views/register.njk'
  - 'scripts/php/dump-lang.php'
  - '.github/i18n-gap-baseline.json'
  - '.github/php-lang-untranslated-baseline.json'
  - '.github/workflows/ci.yml'
  - '.github/ci-paths.yml'
