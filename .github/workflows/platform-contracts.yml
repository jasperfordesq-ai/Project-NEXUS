name: Platform contracts

on:
  pull_request:
    # Restricted to main, matching ci.yml/pr-checks.yml/lighthouse.yml. Without
    # this a PR targeting some other branch got the ~92-runner-minute contracts
    # suite but NOT the CI pipeline — the expensive half of the pair with none
    # of the gating half.
    branches: [main]
    # `ready_for_review` is REQUIRED: the ASP.NET test matrix skips while a PR
    # is a draft, so marking it ready must itself re-run it.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'app/**'
      - 'routes/**'
      - 'config/**'
      - 'database/**'
      - 'openapi.json'
      - 'react-frontend/**'
      - 'aspnet-backend/**'
      - 'web-uk/**'
      - 'contracts/**'
      - 'scripts/verify-platform-contracts.ps1'
      - '.github/workflows/platform-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'routes/**'
      - 'config/**'
      - 'database/**'
      - 'openapi.json'
      - 'react-frontend/**'
      - 'aspnet-backend/**'
      - 'web-uk/**'
      - 'contracts/**'
      - 'scripts/verify-platform-contracts.ps1'
      - '.github/workflows/platform-contracts.yml'
  # Forces every job on regardless of what changed — the escape hatch for
  # "check the whole platform", matching the same convention in ci.yml.
  workflow_dispatch:
  # Weekly full sweep. Change-aware skipping means a job can stay asleep while
  # code it depends on drifts — ci.yml added its nightly sweep for exactly this
  # reason (the mobile contract bug, 2026-08-03, sat invisible that way), and
  # this workflow now has the same skipping with none of that cover. It is also
  # the compensating control for the sibling filters in .github/ci-paths.yml no
  # longer waking on CI-config edits.
  #
  # WEEKLY, not nightly, deliberately: both imported workstreams have been
  # paused since 2026-07-15 with unchanged scores, so a nightly ~120-runner-
  # minute sweep would be paying daily for code nobody is changing. Promote to
  # nightly when ASP.NET or Web UK work actually resumes.
  schedule:
    - cron: '10 4 * * 1'

permissions:
  contents: read

concurrency:
  # Scheduled runs get their own group so the weekly sweep can neither cancel
  # nor be cancelled by a push or PR run — same reasoning as ci.yml:41.
  group: platform-contracts-${{ github.ref }}-${{ github.event_name == 'schedule' && 'weekly' || 'ci' }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Which sibling actually changed?
  #
  # This workflow's `on: paths:` above is deliberately broad, because the
  # Laravel-side contract inventory genuinely does depend on app/, routes/ and
  # config/. Without per-job gating, though, that breadth was charged to EVERY
  # job: a one-line React or Laravel change fired the full ASP.NET test suite,
  # which is the single slowest thing in this repository.
  #
  # Path lists live in .github/ci-paths.yml — the same single-source-of-truth
  # file ci.yml and the deploy verifier read.
  # ─────────────────────────────────────────────────────────────────
  changes:
    name: Detect changed siblings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      aspnet: ${{ steps.filter.outputs.aspnet }}
      webuk: ${{ steps.filter.outputs.webuk }}
      contracts_inventory: ${{ steps.filter.outputs.contracts_inventory }}
      react_contracts: ${{ steps.filter.outputs.react_contracts }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: .github/ci-paths.yml

  static-contract-inventory:
    name: Static contract inventory
    needs: changes
    if: >-
      needs.changes.outputs.contracts_inventory == 'true'
      || github.event_name == 'workflow_dispatch'
      || github.event_name == 'schedule'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # -SkipDotNet/-SkipReact/-SkipWebUk skip the build, lint and test steps
      # ONLY. Those are not disabled checks — the aspnet-build, aspnet-api-tests,
      # react-contracts and web-uk jobs in this same workflow run them properly,
      # in parallel, on the right runners. What this step performs is the
      # inventory and comparison work, which now includes the Laravel-to-frontend
      # consumer comparison that until 2026-08-10 was never invoked from
      # anywhere.
      - name: Verify comparison tools and generate current inventory
        shell: pwsh
        run: ./scripts/verify-platform-contracts.ps1 -SkipDotNet -SkipReact -SkipWebUk
      # The markdown link checker takes one root at a time, so both siblings get
      # their own pass. Not previously run by any workflow, while failing.
      - name: Markdown links resolve (ASP.NET)
        shell: pwsh
        run: ./aspnet-backend/scripts/check-markdown-links.ps1 -RepositoryRoot ./aspnet-backend
      - name: Markdown links resolve (Web UK)
        shell: pwsh
        run: ./aspnet-backend/scripts/check-markdown-links.ps1 -RepositoryRoot ./web-uk
      - name: Upload contract comparison reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-contract-reports
          path: .local-docs-archive/platform-contracts/latest
          if-no-files-found: warn

  aspnet-build:
    name: ASP.NET build
    needs: changes
    if: >-
      needs.changes.outputs.aspnet == 'true'
      || github.event_name == 'workflow_dispatch'
      || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build aspnet-backend/Nexus.sln --configuration Release
      # BLOCKING, shrink-only. Counts controller actions that return a
      # success-shaped payload while performing no work at all. That class of
      # defect is invisible to every route inventory and to the route-alias
      # tests (which assert only "not 404, not 405"), because the stub answers
      # 200 with plausible JSON. Deliberately lives in THIS job, not in
      # static-contract-inventory: contracts_inventory does not watch
      # aspnet-backend/**, so the ratchet would never have run on the very
      # changes it exists to police. See docs/PRODUCTION_READINESS_REMEDIATION.md
      # (R-1).
      - name: No-op stub ratchet
        shell: pwsh
        run: ./aspnet-backend/scripts/check-noop-stubs.ps1

  # ─────────────────────────────────────────────────────────────────
  # ASP.NET API tests — sharded.
  #
  # 🔴 Do NOT collapse this back into a single `dotnet test` call.
  #
  # tests/Nexus.Api.Tests/xunit.runner.json sets parallelizeTestCollections to
  # false, and ~270 of its ~396 files share one [Collection("Integration")]
  # fixture, so in-process the 3,386 tests run strictly one at a time. As a
  # single job that measured 54m38s of tests inside a 58m job (run
  # 31332137158, 2026-08-09) — the entire wall-clock cost of a push.
  #
  # scripts/test-backend-shard.ps1 is the supported way to split it. It
  # discovers tests with --list-tests, balances whole CLASSES across shards
  # (largest-first greedy, so a shared-fixture class is never split across two
  # runners), and starts ONE disposable PostgreSQL container per shard, handed
  # to the fixture via NEXUS_TEST_POSTGRES. Shards therefore never share a
  # database. It came from the upstream ASP.NET repository, where the same
  # script ran green on ubuntu-latest at 4 shards.
  #
  # 6 shards, not 4: at 4 the upstream shards finished between 11 and 22
  # minutes, so the slowest one set the pace. More shards buys balance as well
  # as throughput. Raising ShardCount here needs no other change.
  # ─────────────────────────────────────────────────────────────────
  aspnet-api-tests:
    name: ASP.NET API tests (shard ${{ matrix.shard }}/6)
    needs: changes
    # Draft PRs skip this matrix — it is the most expensive thing in the repo
    # (~90 runner-minutes). `!= true` not `== false`: on push, schedule and
    # dispatch there is no pull_request object, so the expression must hold when
    # the field is absent. aspnet-build and aspnet-messaging-tests are
    # deliberately NOT gated — they are short, and a draft should still get a
    # compile-and-smoke signal.
    if: >-
      (needs.changes.outputs.aspnet == 'true' && github.event.pull_request.draft != true)
      || github.event_name == 'workflow_dispatch'
      || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # The shard script runs with --no-restore --no-build so that discovery
      # and execution reuse one build; restore and build explicitly first.
      - name: Restore
        run: dotnet restore aspnet-backend/tests/Nexus.Api.Tests/Nexus.Api.Tests.csproj
      - name: Build tests
        run: >-
          dotnet build aspnet-backend/tests/Nexus.Api.Tests/Nexus.Api.Tests.csproj
          --no-restore --configuration Release
      - name: Run shard ${{ matrix.shard }} of 6
        shell: pwsh
        working-directory: aspnet-backend
        run: >-
          ./scripts/test-backend-shard.ps1
          -ShardCount 6
          -ShardIndex ${{ matrix.shard }}
          -HangTimeoutSeconds 600
          -ManifestPath "artifacts/backend-test-shards/manifest-shard-${{ matrix.shard }}.json"
      - name: Upload API test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aspnet-api-test-results-shard-${{ matrix.shard }}
          path: aspnet-backend/artifacts/backend-test-shards
          if-no-files-found: warn

  aspnet-messaging-tests:
    name: ASP.NET Messaging tests
    needs: changes
    if: >-
      needs.changes.outputs.aspnet == 'true'
      || github.event_name == 'workflow_dispatch'
      || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test Nexus.Messaging.Tests (10-minute hard limit)
        run: >-
          timeout --signal=INT --kill-after=60s 10m
          dotnet test aspnet-backend/tests/Nexus.Messaging.Tests/Nexus.Messaging.Tests.csproj
          --configuration Release
          --blame-hang
          --blame-hang-timeout 2m
          --logger "trx;LogFileName=nexus-messaging-tests.trx"
          --results-directory "${{ github.workspace }}/aspnet-test-results/messaging"
      - name: Upload Messaging test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aspnet-messaging-test-results
          path: aspnet-test-results/messaging
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────
  # Sibling image smoke builds.
  #
  # Neither sibling Dockerfile was built by ANY workflow until 2026-08-10:
  # ci.yml's docker-verify builds the root Dockerfile, Dockerfile.prod and
  # react-frontend/Dockerfile.prod; security-scan's container-scan builds the
  # root Dockerfile only. A syntax or dependency error in either sibling image
  # was therefore invisible.
  #
  # It was not hypothetical. aspnet-backend/Dockerfile could not build at all:
  # Nexus.sln references five projects and the Dockerfile copied four, so
  # `dotnet restore` failed with MSB3202. Fixed in the same commit that added
  # this job. Both images were built locally before wiring this up, so it goes
  # in green rather than red.
  #
  # Build only — nothing is pushed, and per docs/PLATFORM-MONOREPO.md a green
  # build here does not authorize or certify any deployment.
  # ─────────────────────────────────────────────────────────────────
  aspnet-docker-build:
    name: ASP.NET image builds
    needs: changes
    if: >-
      (needs.changes.outputs.aspnet == 'true' && github.event.pull_request.draft != true)
      || github.event_name == 'workflow_dispatch'
      || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build aspnet-backend image
        run: docker build -t nexus-aspnet:ci aspnet-backend/

  webuk-docker-build:
    name: Web UK image builds
    needs: changes
    if: >-
      needs.changes.outputs.webuk == 'true'
      || github.event_name == 'workflow_dispatch'
      || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # --target production: the stage compose.prod.yml selects. The default
      # final stage would not exercise it.
      - name: Build web-uk production image
        run: docker build -t nexus-webuk:ci --target production web-uk/

  react-contracts:
    name: React backend guardrails
    needs: changes
    if: >-
      needs.changes.outputs.react_contracts == 'true'
      || github.event_name == 'workflow_dispatch'
      || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: react-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: react-frontend/package-lock.json
      - run: npm ci
      - run: npm run check:dual-backend-prep

  web-uk:
    name: Web UK checks
    needs: changes
    if: >-
      needs.changes.outputs.webuk == 'true'
      || github.event_name == 'workflow_dispatch'
      || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web-uk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-uk/package-lock.json
      - run: npm ci
      # 🔴 build:css MUST come before brand:check. `web-uk/public/css/` is gitignored, so
      # a fresh checkout has no compiled stylesheet — and brand:check now scans the
      # COMPILED CSS for the licensed GDS Transport typeface, because scanning templates
      # (all it did before 2026-08-13) cannot see a font at all. Running it first made it
      # refuse outright: "a missing stylesheet is not a pass". That refusal is correct and
      # must stay; the ordering was the bug.
      #
      # Worth knowing: for as long as brand:check only scanned templates, this ordering
      # was invisible — the check passed here without a stylesheet ever existing, which is
      # exactly the vacuous pass the hardening was written to stop.
      - run: npm run build:css
      - run: npm run brand:check
      - run: npm run lint
      - run: npm test -- --runInBand
      # 🔴 The route matrix is described as a "live drift alarm" — a Laravel
      # accessible route that web-uk has not built is supposed to show up here as
      # a missing route. It was not live: nothing regenerated it, so it was only
      # ever as current as the last time somebody ran it by hand. Found stale on
      # 2026-08-12 (721 committed routes against 722 in the code). A MISSING route
      # would have hidden exactly as quietly as that extra one did.
      #
      # Regenerate both and fail if the committed copies differ. Run back to back
      # and diff once: each artefact records the commit it was generated from, so
      # regenerating one alone leaves the pair naming different commits, which
      # check-doc-scores.mjs separately refuses.
      #
      # Regenerated back to back on purpose: each artefact records the commit it
      # came from, so refreshing one alone leaves the pair naming different
      # commits, which check-doc-scores.mjs separately refuses.
      - name: Route matrix and API ledger are current
        run: |
          npm run route:matrix
          npm run api:ledger
      # Compares summary counts, NOT the files. The artefacts stamp a timestamp,
      # a commit SHA, a dirty-tree flag and absolute source paths, all four of
      # which differ on a runner — a plain `git diff` here would fail every run.
      - name: Fail if the generated artefacts drifted from what is committed
        run: node scripts/check-generated-artefacts-current.js
      # 🔴 The 24 automated accessibility checks existed but ran nowhere: they
      # only happened when somebody chose to run them locally, on an accessible
      # frontend whose entire reason for existing is accessibility. Added
      # 2026-08-12.
      #
      # The ISOLATED variant deliberately, not the full `test:accessibility`
      # aggregate. The isolated harness starts its own mock backend that refuses
      # anything other than GET/HEAD, so it touches no Laravel environment and
      # writes no state. The full aggregate includes an authenticated login
      # journey, which writes rate-limit and audit rows and must never run here.
      - name: Install Playwright browser for the accessibility gate
        run: npx playwright install --with-deps chromium
      - name: Automated accessibility checks (isolated fixture, no backend)
        run: npm run test:accessibility:isolated
      # Without the report a failure here is just a red cross — the traces and
      # screenshots are what make it diagnosable.
      - name: Upload accessibility report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webuk-accessibility-report
          path: web-uk/artifacts/accessibility/
          retention-days: 7
      # The scoring markers in web-uk/docs are enforced here as well as in
      # docs-lint, because a change under web-uk/ that moves a count does not
      # necessarily touch a path docs-lint watches.
      - name: Documentation score markers agree with their own tables and artefacts
        working-directory: .
        run: node scripts/check-doc-scores.mjs

  # ---------------------------------------------------------------------------
  # 🔴 The accessibility gates that had never run.
  #
  # `Web UK checks` above runs the ISOLATED accessibility variant, whose runner
  # greps three describes only (scripts/accessibility-isolated-selection.js),
  # because its mock backend serves four endpoints and 404s everything else. The
  # authenticated, Irish and Arabic RTL gates — 72 checks over the pages members
  # actually use — were therefore in the repository but executed nowhere. They
  # were run by hand for the first time on 2026-08-19 (52 + 13 passing, evidence
  # in web-uk/docs/MANUAL_ACCESSIBILITY_EVIDENCE.md); this job is what stops that
  # becoming a dated snapshot that silently rots again.
  #
  # It stands up a real Laravel against a throwaway MariaDB and seeds SYNTHETIC
  # accounts only, using the same seeder the disposable local environment uses.
  # No production or production-derived data is involved at any point.
  # ---------------------------------------------------------------------------
  web-uk-accessibility:
    name: Web UK authenticated accessibility
    needs: changes
    if: >-
      needs.changes.outputs.webuk == 'true'
      || github.event_name == 'workflow_dispatch'
      || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: testing
          MARIADB_DATABASE: nexus_a11y
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: nexus_a11y
      DB_USER: root
      DB_PASS: testing
      APP_ENV: local
      APP_KEY: base64:HfQEDtbtr90JIXhsaAhSFWnzIo1f31VZ2e5qLqKKnls=
      # No Redis in this job, so the same driver set the PHP test jobs use.
      # APP_ENV is `local`, NOT `testing`: `testing` makes Laravel load the repo's
      # .env.testing, which points DB_DATABASE at PHPUnit's own database.
      CACHE_DRIVER: array
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: "null"
      BROADCAST_DRIVER: "null"
      MAIL_MAILER: array
      A11Y_TENANT_SLUG: a11y-community
      A11Y_MEMBER_EMAIL: e2e.user.a@project-nexus.local
      A11Y_MEMBER_PASSWORD: TestPassword123!
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, gmp, bcmath, intl, zip
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Create the schema
        run: php artisan migrate --force

      - name: Seed SYNTHETIC accounts only
        run: |
          set -euo pipefail
          php artisan db:seed --class=TenantSeeder --force
          mysql -h 127.0.0.1 -uroot -ptesting nexus_a11y -e "
            INSERT INTO tenants (name, slug, tenant_category, is_active, parent_id, depth, allows_subtenants, max_depth, created_at, updated_at)
            SELECT 'A11y Community', '${A11Y_TENANT_SLUG}', 'community', 1, NULL, 0, 1, 3, NOW(), NOW()
            WHERE NOT EXISTS (SELECT 1 FROM tenants WHERE slug = '${A11Y_TENANT_SLUG}');
            UPDATE tenants SET path = CONCAT('/', id, '/')
              WHERE slug = '${A11Y_TENANT_SLUG}' AND (path IS NULL OR path = '');"
          TENANT_ID=$(mysql -h 127.0.0.1 -uroot -ptesting nexus_a11y -N -e \
            "SELECT id FROM tenants WHERE slug='${A11Y_TENANT_SLUG}' LIMIT 1;")
          echo "TENANT_ID=$TENANT_ID" >> "$GITHUB_ENV"
          E2E_TENANT_ID="$TENANT_ID" php artisan db:seed --class=E2ETestDataSeeder --force

      # 🔴 The same invariant the local disposable environment enforces: this job
      # must never be pointed at anything holding real members. Assert it rather
      # than trust it — a non-synthetic address here is a hard stop.
      - name: Refuse to continue unless every account is synthetic
        run: |
          set -euo pipefail
          REAL=$(mysql -h 127.0.0.1 -uroot -ptesting nexus_a11y -N -e \
            "SELECT COUNT(*) FROM users WHERE email NOT LIKE '%.local';")
          echo "non-synthetic accounts: $REAL"
          test "$REAL" -eq 0

      - name: Resolve the fixture ids the gate needs
        run: |
          set -euo pipefail
          # 🔴 Must NOT be the member the gate signs in as: the appreciation wall
          # renders its form only `{% if not isSelf %}`.
          OTHER=$(mysql -h 127.0.0.1 -uroot -ptesting nexus_a11y -N -e \
            "SELECT id FROM users WHERE tenant_id=${TENANT_ID} AND email <> '${A11Y_MEMBER_EMAIL}' LIMIT 1;")
          echo "ACCESSIBILITY_MEMBER_ID=$OTHER" >> "$GITHUB_ENV"

      - name: Start Laravel
        run: |
          php -S 127.0.0.1:8099 -t httpdocs httpdocs/index.php &
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "http://127.0.0.1:8099/api/v2/tenant/bootstrap?slug=${A11Y_TENANT_SLUG}"; then
              echo "laravel up"; exit 0
            fi
            sleep 2
          done
          echo "Laravel did not come up"; exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-uk/package-lock.json

      - name: Install web-uk dependencies
        working-directory: web-uk
        run: npm ci

      - name: Install Playwright browser
        working-directory: web-uk
        run: npx playwright install --with-deps chromium

      # The authenticated gate plus the Irish and Arabic RTL gates. Organisation,
      # goal and ranked-poll fixtures are not seeded here, so those checks declare
      # themselves skipped rather than failing on a 404 — a declaration this job
      # makes explicitly, never a silent pass.
      - name: Authenticated, Irish and Arabic RTL accessibility gates
        working-directory: web-uk
        env:
          LARAVEL_BASE_URL: http://127.0.0.1:8099
          SMOKE_EMAIL: ${{ env.A11Y_MEMBER_EMAIL }}
          SMOKE_PASSWORD: ${{ env.A11Y_MEMBER_PASSWORD }}
          SMOKE_TENANT: ${{ env.A11Y_TENANT_SLUG }}
          ACCESSIBILITY_TENANT_SLUG: ${{ env.A11Y_TENANT_SLUG }}
          ACCESSIBILITY_ORG_ID: none
          ACCESSIBILITY_GOAL_ID: none
        run: |
          npm run build:css
          node scripts/accessibility-local-server.js --grep="authenticated-page|narrow reflow"

      # The API contract ledger's 120 GET contracts were verified by hand, against a
      # developer's disposable Laravel, whenever someone remembered. The score doc's
      # stated reason for leaving it out of CI was "CI has no running Laravel" —
      # this job now HAS one, so the verification runs on every push touching
      # web-uk. It replays each recorded contract against the real API and fails on
      # a status or shape mismatch, which is the difference between "we wrote down
      # what we think the API returns" and "we checked".
      #
      # 🔴 GETs ONLY. Mutations, uploads and side effects are still unverified here,
      # and a green run must never be read as covering them.
      - name: Verify the recorded GET API contracts against the live API
        working-directory: web-uk
        env:
          WEBUK_CONTRACT_API_URL: http://127.0.0.1:8099
          WEBUK_CONTRACT_TENANT: ${{ env.A11Y_TENANT_SLUG }}
          WEBUK_CONTRACT_EMAIL: ${{ env.A11Y_MEMBER_EMAIL }}
          WEBUK_CONTRACT_PASSWORD: ${{ env.A11Y_MEMBER_PASSWORD }}
          # Reaches the SAME synthetic-accounts guard the local run uses; the runner
          # has a mysql client and no container of that name. Proven to still refuse:
          # fed a fake client reporting real accounts, the sweep exits 2 and runs nothing.
          WEBUK_CONTRACT_MYSQL_CMD: mysql -h 127.0.0.1 -uroot -ptesting nexus_a11y
        run: npm run api:verify

      - name: Upload the contract verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-uk-api-contract-verification
          path: web-uk/docs/generated/api-contract-verification.*
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload accessibility report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-uk-authenticated-accessibility
          path: web-uk/artifacts/accessibility
          retention-days: 7
