name: Platform contracts

on:
  pull_request:
    paths:
      - 'app/**'
      - 'routes/**'
      - 'config/**'
      - 'database/**'
      - 'openapi.json'
      - 'react-frontend/**'
      - 'accessible-frontend/**'
      - 'aspnet-backend/**'
      - 'web-uk/**'
      - 'contracts/**'
      - 'scripts/verify-platform-contracts.ps1'
      - '.github/workflows/platform-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'routes/**'
      - 'config/**'
      - 'database/**'
      - 'openapi.json'
      - 'react-frontend/**'
      - 'accessible-frontend/**'
      - 'aspnet-backend/**'
      - 'web-uk/**'
      - 'contracts/**'
      - 'scripts/verify-platform-contracts.ps1'
      - '.github/workflows/platform-contracts.yml'

permissions:
  contents: read

concurrency:
  group: platform-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contract-inventory:
    name: Static contract inventory
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify comparison tools and generate current inventory
        shell: pwsh
        run: ./scripts/verify-platform-contracts.ps1 -SkipDotNet -SkipReact -SkipWebUk

  aspnet-build:
    name: ASP.NET build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build aspnet-backend/Nexus.sln --configuration Release

  aspnet-api-tests:
    name: ASP.NET API tests
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test Nexus.Api.Tests (70-minute hard limit)
        run: >-
          timeout --signal=INT --kill-after=60s 70m
          dotnet test aspnet-backend/tests/Nexus.Api.Tests/Nexus.Api.Tests.csproj
          --configuration Release
          --blame-hang
          --blame-hang-timeout 5m
          --logger "trx;LogFileName=nexus-api-tests.trx"
          --results-directory "${{ github.workspace }}/aspnet-test-results/api"
      - name: Upload API test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aspnet-api-test-results
          path: aspnet-test-results/api
          if-no-files-found: warn

  aspnet-messaging-tests:
    name: ASP.NET Messaging tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test Nexus.Messaging.Tests (10-minute hard limit)
        run: >-
          timeout --signal=INT --kill-after=60s 10m
          dotnet test aspnet-backend/tests/Nexus.Messaging.Tests/Nexus.Messaging.Tests.csproj
          --configuration Release
          --blame-hang
          --blame-hang-timeout 2m
          --logger "trx;LogFileName=nexus-messaging-tests.trx"
          --results-directory "${{ github.workspace }}/aspnet-test-results/messaging"
      - name: Upload Messaging test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aspnet-messaging-test-results
          path: aspnet-test-results/messaging
          if-no-files-found: warn

  react-contracts:
    name: React backend guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: react-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: react-frontend/package-lock.json
      - run: npm ci
      - run: npm run check:dual-backend-prep

  web-uk:
    name: Web UK checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web-uk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-uk/package-lock.json
      - run: npm ci
      - run: npm run brand:check
      - run: npm run lint
      - run: npm test -- --runInBand
      - run: npm run build:css
