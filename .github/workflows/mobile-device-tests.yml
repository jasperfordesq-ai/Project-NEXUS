#
# Mobile device tests — the twelve Maestro end-to-end flows, on a real Android
# emulator, against a real Laravel API.
#
# WHY THIS IS A SEPARATE WORKFLOW
#
# `ci.yml`'s `mobile-release` job runs on a bare Node runner: no PHP, no database,
# no Android SDK. It can typecheck, run Jest and inspect a generated manifest, and
# it cannot launch an app. This workflow does the expensive half — MariaDB, Redis,
# Laravel, an emulator, a native build, Metro — which is why it is scheduled rather
# than run on every push. A ~35-minute job on every commit would be ignored within
# a week.
#
# The workflow is established CI evidence, not an experiment. Each flow starts from
# isolated app state, while the two effect suites share one deterministic Laravel reset
# and finish with independent database assertions. A failure is therefore an app,
# fixture, runner or harness signal that must be classified from the uploaded evidence.
#
# WHY THE SCREENSHOT COMPARISON IS NOT A GATE HERE
#
# The committed baselines were captured on the dev machine's AVD. Pixel-level
# equality does not transfer between environments — a different system-image build
# renders text with different anti-aliasing, and the comparison would fail on day
# one for reasons that have nothing to do with the app. So this workflow CAPTURES
# the screens and uploads them as artefacts, and the comparison stays local until a
# CI-specific baseline is captured deliberately (see docs/TESTING.md). Shipping a
# visual gate that fails spuriously would train everyone to ignore it.

name: Mobile Device Tests

on:
  workflow_dispatch:
  schedule:
    # 04:40 UTC — after ci.yml's 03:30 sweep, so the two do not contend for runners.
    - cron: '40 4 * * *'

permissions:
  contents: read

concurrency:
  group: mobile-device-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PHP_VERSION: '8.2'
  # The emulator reaches the runner's own loopback on this address. A DEBUG build
  # is required: lib/constants.ts refuses a loopback API URL when __DEV__ is false
  # and silently uses production instead.
  API_URL: 'http://10.0.2.2:8090'
  # Matches the dev machine so CI and local behave identically — the Maestro flows
  # tap this slug on the tenant-selection screen.
  TENANT_SLUG: 'hour-timebank'
  E2E_TENANT_ID: '2'

jobs:
  device-tests:
    name: Maestro flows on an Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: testing
          MYSQL_DATABASE: nexus
          MYSQL_USER: nexus
          MYSQL_PASSWORD: nexus_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v5

      # ── The API side ────────────────────────────────────────────────────────
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_mysql, mbstring, xml, zip, redis, gd, intl, bcmath, opcache, curl, fileinfo, gmp
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare Laravel runtime directories
        run: |
          mkdir -p bootstrap/cache storage/framework/{cache,sessions,views} storage/logs
          chmod -R ug+rw bootstrap/cache storage

      - name: Load the schema and seed the tenant
        run: |
          mysql -h 127.0.0.1 -u root -ptesting nexus < database/schema/mysql-schema.sql
          # Tenant 2 carries the same slug as the dev machine so the Maestro flows,
          # which tap "hour-timebank" on the tenant chooser, behave identically.
          mysql -h 127.0.0.1 -u root -ptesting nexus -e \
            "INSERT INTO tenants (id, name, slug, is_active) VALUES (1, 'Master', 'master', 1), (2, 'Hour Timebank', '${{ env.TENANT_SLUG }}', 1) \
             ON DUPLICATE KEY UPDATE slug = VALUES(slug), is_active = 1;"
          mysql -h 127.0.0.1 -u root -ptesting nexus -e \
            "INSERT IGNORE INTO categories (id, name, slug, tenant_id, type) VALUES (1, 'General', 'general', 2, 'listing');"
          # The expanded native-module journey must exercise ordinary navigation to
          # Courses, Podcasts and Partner venues. These are opt-in tenant features,
          # so make them explicit in the disposable CI tenant rather than silently
          # skipping the screens because production policy has them disabled.
          mysql -h 127.0.0.1 -u root -ptesting nexus -e \
            "UPDATE tenants SET features = JSON_SET(COALESCE(features, '{}'), '$.courses', true, '$.podcasts', true, '$.partner_venues', true) WHERE id = 2;"

      - name: Run pending migrations
        run: php artisan migrate --force
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: nexus
          DB_USER: root
          DB_PASS: testing
          APP_ENV: testing
          APP_KEY: base64:HfQEDtbtr90JIXhsaAhSFWnzIo1f31VZ2e5qLqKKnls=

      - name: Seed the E2E fixture (members, listings and reversible effect targets)
        run: php artisan db:seed --class=E2ETestDataSeeder --force
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: nexus
          DB_USER: root
          DB_PASS: testing
          APP_ENV: testing
          APP_KEY: base64:HfQEDtbtr90JIXhsaAhSFWnzIo1f31VZ2e5qLqKKnls=
          E2E_TENANT_ID: ${{ env.E2E_TENANT_ID }}

      # 🔴 NOT `php artisan serve`. That serves `public/`, which in this repo holds
      # only `uploads/` — the real document root is `httpdocs/` (see Dockerfile:
      # APACHE_DOCUMENT_ROOT=/var/www/html/httpdocs). Verified in the app container:
      # with `-t httpdocs httpdocs/index.php`, POST /api/auth/login returns 200.
      - name: Serve the API on 8090
        run: |
          php -S 0.0.0.0:8090 -t httpdocs httpdocs/index.php > "$RUNNER_TEMP/laravel.log" 2>&1 &
          echo "started"
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: nexus
          DB_USER: root
          DB_PASS: testing
          APP_ENV: local
          APP_DEBUG: 'true'
          # 🔴 THIS is why the first run of this workflow failed (run 32218116959,
          # 2026-08-19). The runner has no `.env` — it is gitignored — so neither
          # JWT_SECRET nor APP_KEY was set. `TokenService::getSecretKey()` signs the
          # mobile access token and falls back JWT_SECRET -> APP_KEY -> throw:
          #
          #   RuntimeException: Security configuration error: JWT_SECRET or APP_KEY must be set
          #
          # So login 500'd at the moment it tried to ISSUE a token. The readiness poll
          # below therefore never saw success, timed out after 60s, and the emulator, the
          # APK build and all eleven Maestro flows were skipped.
          #
          # Note the shape of this bug: bad credentials returned a clean 401, and only a
          # SUCCESSFUL login failed — so probing the endpoint the obvious way says the API
          # is healthy. Reproduced in the app container against the real login route:
          # with both cleared -> 500 + that message; with APP_KEY alone -> 200
          # "success":true (the fallback at TokenService.php:48 covers it).
          #
          # The same fixed, non-secret test key ci.yml uses for every PHP job.
          APP_KEY: base64:HfQEDtbtr90JIXhsaAhSFWnzIo1f31VZ2e5qLqKKnls=
          REDIS_HOST: 127.0.0.1

      # One step proves two things: the API is answering, AND the seeded account
      # authenticates. Fail here rather than eleven flows later — if login does not
      # work, nothing downstream is testing the app.
      #
      # 🔴 The readiness probe is the LOGIN endpoint, not /health.php. Under PHP's
      # built-in server a router script handles every request, so static files like
      # httpdocs/health.php are never served and return 404. Verified in the app
      # container. Polling login is a better signal anyway: it is exactly what the
      # app does first.
      - name: Wait for the API and confirm the seeded account authenticates
        run: |
          for i in $(seq 1 60); do
            # `Accept: application/json` matters on the failure path: without it Laravel
            # renders a server error as an HTML page, which is what run 32218116959
            # captured — 600 bytes of the app shell instead of the error.
            body=$(curl -s --max-time 10 -X POST http://127.0.0.1:8090/api/auth/login \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json' \
              -H "X-Tenant-Slug: ${{ env.TENANT_SLUG }}" \
              -d '{"email":"e2e.user.a@project-nexus.local","password":"TestPassword123!"}' || true)
            if echo "$body" | grep -q '"success"[[:space:]]*:[[:space:]]*true'; then
              echo "API up and the E2E account authenticates (after ${i}s)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the API never accepted the seeded E2E account on :8090"
          # 🔴 This block used to destroy its own evidence, which is why run 32218116959 had
          # to be diagnosed by reading the application rather than its logs. Reproduced
          # faithfully in the app container (php -S, both secrets cleared):
          #
          #   * The cause is in the RESPONSE BODY, not the server log. The `Accept` header
          #     added to the request above is therefore the fix that matters: without it the
          #     body was 600 bytes of `<!DOCTYPE html>` app shell; with it the body is
          #     `{"message":"Security configuration error: JWT_SECRET or APP_KEY must be
          #     set","exception":"RuntimeException",...}`.
          #   * `tail -40` on the server log named the cause 0 times, measured — a Laravel
          #     trace is ~70 lines, so the tail showed frames #34 onwards and cut off the
          #     message. Raised to 120, but it is the SECONDARY source; its real job is the
          #     case where the API never started, where there is no response body at all.
          #   * `echo "$body" | head -c 600` also emitted "write error: Broken pipe", since
          #     head exited first. Now a substring expansion, so nothing pipes.
          #
          # Deliberately NOT grepping the log for '"message"' — measured as finding nothing
          # here, and a diagnostic that reliably prints nothing is worse than none at all.
          echo "--- last response (1200 bytes) — the cause is normally HERE ---"
          echo "${body:0:1200}"
          echo "--- server log (last 120 lines) — for a server that never started ---"
          tail -120 "$RUNNER_TEMP/laravel.log" || echo "(no server log at $RUNNER_TEMP/laravel.log)"
          exit 1

      # ── The app side ────────────────────────────────────────────────────────
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Verify live member response contracts across fixture roles
        working-directory: mobile
        run: npm run verify:live-member-contracts
        env:
          # This check runs on the host, before the emulator exists. The workflow-level
          # 10.0.2.2 URL is only correct from inside Android's network namespace.
          API_URL: http://127.0.0.1:8090

      # 🔴 JDK 17, NOT a newer one. Gradle 8.14.3 rejects Java 25 outright with
      # "Unsupported class file major version 69", which is what Android Studio
      # bundles locally.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Write the mobile environment
        working-directory: mobile
        run: |
          cat > .env.local <<ENVFILE
          EXPO_PUBLIC_API_URL=${{ env.API_URL }}
          EXPO_PUBLIC_DEFAULT_TENANT=${{ env.TENANT_SLUG }}
          EXPO_PUBLIC_APP_URL=https://app.project-nexus.ie
          EXPO_PUBLIC_ALLOW_PRODUCTION_API_IN_DEV=true
          # 🔴 Suppresses LogBox for this build only. A warning banner sits over the tab
          # bar and swallows the tap, which broke four of these flows on 2026-08-24
          # while every unit test passed. A suite an unrelated warning can break cannot be
          # trusted to report on the app. See app/_layout.tsx for the measurement.
          EXPO_PUBLIC_E2E=1
          ENVFILE
          cat .env.local

      - name: Verify the network security split before building
        # The debug build can only reach an http:// API because of the debug-only
        # network security config. If that has regressed, the flows would fail with
        # a confusing "Invalid credentials" instead of the real reason.
        working-directory: mobile
        run: npm run verify:network-security

      - name: Generate the native project
        working-directory: mobile
        run: |
          npx expo prebuild --platform android --no-install
          # Only the emulator's architecture: building arm64 as well doubles the
          # native C++ compile for a slice an x86_64 emulator cannot run.
          if grep -q '^reactNativeArchitectures=' android/gradle.properties; then
            sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=x86_64/' android/gradle.properties
          else
            echo 'reactNativeArchitectures=x86_64' >> android/gradle.properties
          fi

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-mobile-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: gradle-mobile-

      - name: Build the debug APK
        working-directory: mobile/android
        run: ./gradlew app:assembleDebug -x lint -x test --build-cache

      - name: Start Metro
        working-directory: mobile
        run: |
          npx expo start --port 8081 > "$RUNNER_TEMP/metro.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8081/status | grep -q 'packager-status:running'; then
              echo "Metro is up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::Metro did not start within 60s"
          cat "$RUNNER_TEMP/metro.log"
          exit 1

      # KVM is available on GitHub-hosted Ubuntu runners; without it the emulator
      # falls back to software CPU emulation and is far too slow to finish.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run the eleven flows on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # The effect verifier is a Laravel CLI process on the host. Give it the same
          # disposable database/runtime configuration used by migration and seeding.
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: nexus
          DB_USER: root
          DB_PASS: testing
          APP_ENV: testing
          APP_KEY: base64:HfQEDtbtr90JIXhsaAhSFWnzIo1f31VZ2e5qLqKKnls=
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          # swiftshader_indirect matches the local AVD: CPU rendering is slower but
          # deterministic, which is what a pixel comparison needs.
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: false # 🔴 see below
          script: |
            # 🔴 disable-animations MUST stay false. With animation scales at 0,
            # Android reports reduced motion, Reanimated logs a dev warning, and
            # LogBox draws a banner across the BOTTOM of the screen — over the tab
            # bar. Maestro's taps on "More" then hit the banner, and five flows fail
            # on a "View wallet" they never reached. Measured locally.
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb reverse tcp:8081 tcp:8081

            # Keep the headless device awake for the full suite. Run 33249852302
            # presented a System UI ANR over the app after the emulator slept,
            # causing every otherwise-independent flow to fail on the overlay.
            adb emu power ac on
            adb shell settings put global stay_on_while_plugged_in 7
            adb shell settings put secure screensaver_enabled 0
            # API 36's headless System UI can raise its own ANR dialog over a
            # perfectly rendered app. Run 33268853140 showed that same system
            # process overlay in all eleven independent failure screenshots while
            # Metro kept bundling the app normally. Suppress platform crash/ANR
            # dialogs on this disposable emulator so they cannot intercept the
            # app journey; app crashes still fail through Maestro and logs.
            adb shell settings put global hide_error_dialogs 1
            adb shell settings put global show_first_crash_dialog 0
            adb shell locksettings set-disabled true
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard

            curl -Ls "https://get.maestro.mobile.dev" | bash
            export PATH="$HOME/.maestro/bin:$PATH"
            export MAESTRO_CLI_NO_ANALYTICS=1
            export MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED=true

            # e2e.mjs checks every precondition first and says which one is wrong,
            # rather than letting Maestro report a missing button ten times.
            php scripts/mobile-device-effects.php reset
            npm run e2e -- --serial emulator-5554
            php scripts/mobile-device-effects.php assert

            # Captured for eyeballing and uploaded below. NOT compared: the
            # committed baselines were taken on a different emulator build, and
            # pixel equality does not transfer between environments.
            npm run screenshot:tour
          working-directory: mobile

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-screenshots
          path: mobile/screenshots/current/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Maestro output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-output
          path: ~/.maestro/tests/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            ${{ runner.temp }}/laravel.log
            ${{ runner.temp }}/metro.log
            storage/logs/
          if-no-files-found: warn
          retention-days: 14
