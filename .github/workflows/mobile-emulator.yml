#
# Does the native Android app actually start?
#
# 🔴 Why this is its OWN workflow, and not a job in ci.yml.
#
# 1. It runs on a SCHEDULE, never on push. An emulator job is the slowest and by
#    far the flakiest tier of testing available — AVD boot, Metro attach, Gradle,
#    an ANR sheet the platform puts up on its own — and most of its failures are
#    not the change under test. `main` going red for reasons nobody caused is how
#    a team learns to ignore CI, which this repository has already paid for once.
#    Nightly detection of a launch crash is worth far more than a red tick on a
#    push that a developer will simply re-run.
#
# 2. `scripts/predeploy-ci-verify.mjs` reads ci.yml and platform-contracts.yml
#    only. Anything defined here is therefore outside the deploy verifier's scope
#    by construction: it cannot trip the unknown-job rule, and it cannot block a
#    deploy. That is deliberate — a job whose infrastructure is this involved
#    should not be able to hold a release hostage until it has earned trust.
#    Promoting it into ci.yml later means adding it to REQUIRED_JOBS in the same
#    commit; read the note above that list first.
#
# 🔴 What this does NOT do, so nobody reads a green tick here as more than it is:
#   - it does not run the 01-13 journey flows. Those need a live API and a real
#     account, and `compose.ci.yml` publishes no port for the app service, so the
#     emulator cannot reach it without wiring that does not exist yet;
#   - it does not check anything VISUAL. Emulator screenshots are not stable
#     enough across API levels and renderers to gate on, which is why
#     `mobile/scripts/screenshots.mjs` is a local tool;
#   - it does not run TalkBack, and it never touches iOS.
# The audit's visual, accessibility and signed-binary gap (F10) stays open.

name: Mobile Emulator

on:
  # 04:40 UTC — an hour after ci.yml's nightly sweep at 03:30, so the two do not
  # compete for runners.
  schedule:
    - cron: '40 4 * * *'
  workflow_dispatch:
    inputs:
      flow:
        description: 'Maestro flow to run, relative to mobile/. Journey flows need a live API. Applies to the Android job; the iOS job always runs the launch smoke.'
        required: false
        default: '.maestro/00-launch-smoke.yaml'

concurrency:
  group: mobile-emulator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  ANDROID_API_LEVEL: '34'

jobs:
  launch-smoke:
    name: Android Launch Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # Hardware acceleration. Without it the AVD falls back to software
      # rendering and a cold boot goes from ~2 minutes to well past the timeout.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # Gradle needs a JDK; the runner's default is not guaranteed to be 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      # `--no-install` because npm ci above already did it, and --clean so the
      # generated project cannot inherit stale native config from a cached run.
      - name: Generate the native Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install --clean

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-emulator-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/package-lock.json') }}
          restore-keys: gradle-emulator-${{ runner.os }}-

      # A DEBUG build on purpose. A release build needs the signing key, which is
      # not on this runner and should not be — and the debug variant is the one
      # whose network-security config permits the local hosts these flows use.
      - name: Build the debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # A debug build fetches its JavaScript from Metro at runtime, so Metro has
      # to be up BEFORE the app launches. `adb reverse` is set inside the emulator
      # step below, because it is device state and needs a booted device.
      - name: Start Metro
        working-directory: mobile
        run: |
          npx expo start --port 8081 > "${RUNNER_TEMP}/metro.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf --max-time 2 http://127.0.0.1:8081/status >/dev/null; then
              echo "Metro is serving"; exit 0
            fi
            sleep 2
          done
          echo "Metro did not come up within 120s"; cat "${RUNNER_TEMP}/metro.log"; exit 1

      # 🔴 `script:` is ONE LINE, calling a committed file. This action runs each
      # line of the script input in its own `sh -c`, so a `cd` does not persist and
      # a trailing `\` is passed through as an argument rather than continuing the
      # line. The first version hit both and invoked Maestro from the repo root with
      # a single backslash as its flow path. See the script's own header.
      - name: Boot the emulator and run the flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          arch: x86_64
          profile: pixel_6
          # No window, no audio, no boot animation: this runner has no display and
          # each of them is a source of delay or of a spurious system dialog.
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          disable-animations: true
          script: bash mobile/scripts/ci-launch-smoke-android.sh "${{ github.event.inputs.flow || '.maestro/00-launch-smoke.yaml' }}"

      # 🔴 On failure the artefacts are the whole point: a launch crash is
      # unreadable without the device log and the screenshot Maestro captured.
      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p "${RUNNER_TEMP}/diagnostics"
          cp "${RUNNER_TEMP}/metro.log" "${RUNNER_TEMP}/diagnostics/" 2>/dev/null || true
          cp "${RUNNER_TEMP}/maestro-report.xml" "${RUNNER_TEMP}/diagnostics/" 2>/dev/null || true
          cp -r "$HOME/.maestro/tests" "${RUNNER_TEMP}/diagnostics/maestro-tests" 2>/dev/null || true
          # Written by the trap inside the emulator step, while a device still existed.
          cp "${RUNNER_TEMP}/logcat.txt" "${RUNNER_TEMP}/diagnostics/" 2>/dev/null || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-emulator-diagnostics
          path: ${{ runner.temp }}/diagnostics
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # iOS is the platform with NO evidence at all, which is why this job exists
  # despite costing more than the Android one.
  #
  # 🔴 Two of the fixes in this repository are specifically about iOS behaviour
  # and have never been run on it. `useUnsavedChangesGuard` is built on
  # `usePreventRemove` precisely because a `beforeRemove` listener does not work
  # on a native stack — and the case that breaks is the iOS SWIPE-BACK gesture.
  # The bottom-inset work is the same shape: the home indicator is an iOS
  # concern. Android passing says nothing about either.
  #
  # 🔴 A simulator build needs NO signing key, which is the only reason this is
  # possible here at all — `CODE_SIGNING_ALLOWED=NO` below is what makes it work
  # on a runner with no certificates, and it is why this job can exist while
  # `verify:ios-release` is still blocked on owner-held Apple identifiers.
  #
  # macOS runners are free on public repositories, so this costs queue time
  # rather than money. It is slower and more fragile than the Android job:
  # CocoaPods and xcodebuild are the least forgiving part of this toolchain.
  # ---------------------------------------------------------------------------
  ios-launch-smoke:
    name: iOS Launch Smoke
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      # --no-install skips BOTH npm and pod install; npm ci above did the first
      # and the cached pod install below does the second.
      - name: Generate the native iOS project
        working-directory: mobile
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Cache CocoaPods
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/CocoaPods
            mobile/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('mobile/ios/Podfile.lock', 'mobile/package-lock.json') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Install pods
        working-directory: mobile/ios
        run: pod install --repo-update

      # 🔴 The scheme is derived from the WORKSPACE NAME, and the run fails if that
      # scheme is missing. The first version took `schemes[0]` and picked
      # `EASClient` — the expo-dev-client helper that arrives as a pod, not the
      # app — so xcodebuild built a helper, produced no .app, and the next step
      # reported it. Expo names both the workspace and the app scheme from the app
      # name ("Timebank Global" -> TimebankGlobal), so they always agree.
      #
      # Failing loudly beats falling back to a list position: falling back is what
      # built the wrong target in the first place. The available schemes are
      # printed either way, because that one line is what diagnosed it.
      - name: Build for the simulator
        working-directory: mobile/ios
        run: |
          set -euo pipefail
          WORKSPACE="$(ls -d *.xcworkspace | head -1)"
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "workspace=$WORKSPACE  expected scheme=$SCHEME"
          echo "schemes in this workspace:"
          xcodebuild -workspace "$WORKSPACE" -list -json \
            | python3 -c 'import json,sys; print("\n".join("  " + x for x in json.load(sys.stdin)["workspace"]["schemes"]))'
          xcodebuild -workspace "$WORKSPACE" -list -json \
            | python3 -c 'import json,sys; sys.exit(0 if "'"$SCHEME"'" in json.load(sys.stdin)["workspace"]["schemes"] else 1)' \
            || { echo "scheme $SCHEME is not in $WORKSPACE — see the list above"; exit 1; }
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${RUNNER_TEMP}/ios-build" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -quiet \
            build
          echo "products:"
          find "${RUNNER_TEMP}/ios-build/Build/Products" -maxdepth 2 -name '*.app' -print

      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # A Debug build fetches its JavaScript from Metro at runtime, exactly as on
      # Android. A simulator reaches the host's localhost directly, so no
      # equivalent of `adb reverse` is needed here.
      - name: Start Metro
        working-directory: mobile
        run: |
          npx expo start --port 8081 > "${RUNNER_TEMP}/metro.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf --max-time 2 http://127.0.0.1:8081/status >/dev/null; then
              echo "Metro is serving"; exit 0
            fi
            sleep 2
          done
          echo "Metro did not come up within 120s"; cat "${RUNNER_TEMP}/metro.log"; exit 1

      # 🔴 The device is CHOSEN from what the runner actually has. Runner images
      # change their preinstalled simulators without notice, so a hardcoded
      # "iPhone 16" is a job that breaks on an image bump for no real reason.
      # 🔴 The device is CHOSEN from what the runner actually has. Runner images
      # change their preinstalled simulators without notice, so a hardcoded
      # "iPhone 16" is a job that breaks on an image bump for no real reason.
      # `simctl list` prints "iPhone 16 (UDID) (Shutdown)", so the UDID is the
      # first parenthesised field of the first iPhone line.
      - name: Boot a simulator and run the flow
        working-directory: mobile
        run: |
          set -euo pipefail
          xcrun simctl list devices available | sed -n '1,40p'
          UDID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')"
          if [ -z "${UDID}" ]; then echo "no available iPhone simulator on this runner"; exit 1; fi
          echo "booting ${UDID}"
          xcrun simctl boot "${UDID}" || true
          xcrun simctl bootstatus "${UDID}" -b
          APP="$(find "${RUNNER_TEMP}/ios-build/Build/Products" -maxdepth 3 -name '*.app' | head -1)"
          if [ -z "${APP}" ]; then echo "no .app was produced by the build"; exit 1; fi
          echo "installing ${APP}"
          xcrun simctl install "${UDID}" "${APP}"
          maestro test --format junit --output "${RUNNER_TEMP}/maestro-report-ios.xml" \
            .maestro/00-launch-smoke.yaml

      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p "${RUNNER_TEMP}/diagnostics-ios"
          cp "${RUNNER_TEMP}/metro.log" "${RUNNER_TEMP}/diagnostics-ios/" 2>/dev/null || true
          cp "${RUNNER_TEMP}/maestro-report-ios.xml" "${RUNNER_TEMP}/diagnostics-ios/" 2>/dev/null || true
          cp -r "$HOME/.maestro/tests" "${RUNNER_TEMP}/diagnostics-ios/maestro-tests" 2>/dev/null || true
          xcrun simctl spawn booted log collect --output "${RUNNER_TEMP}/diagnostics-ios/sim.logarchive" 2>/dev/null || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-emulator-diagnostics
          path: ${{ runner.temp }}/diagnostics-ios
          retention-days: 14
          if-no-files-found: warn
