            docker compose -f compose.ci.yml logs --no-color app || true
            echo "::endgroup::"
            echo "::group::Frontend container logs"
            docker compose -f compose.ci.yml logs --no-color frontend || true
            echo "::endgroup::"
            exit 1
          }
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_API_URL: http://localhost:3000
          CI: true

      - name: Verify Editor Bundle Isolation
        run: npm run test:e2e:editor-isolation
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_API_URL: http://localhost:3000
          E2E_USER_EMAIL: e2e-member@example.test
          E2E_USER_PASSWORD: password
          E2E_ADMIN_EMAIL: e2e-admin@example.test
          E2E_ADMIN_PASSWORD: password
          E2E_SKIP_DATA_SEED: 1
          E2E_REQUIRE_AUTH: 1
          CI: true

      - name: Upload Smoke Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-smoke-report
          path: |
            e2e/reports/
            e2e/test-results/
          retention-days: 14

      - name: Stop Application Stack
        if: always()
        run: docker compose -f compose.ci.yml down -v

  # ─────────────────────────────────────────────────────────────────
  # Stage 8: Accessibility Checks (blocking)
  # ─────────────────────────────────────────────────────────────────
  accessibility-check:
    name: Accessibility Audit (App Shell & Offline State)
    runs-on: ubuntu-latest
    needs: [changes, react-build]
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Download React build artifact
        uses: actions/download-artifact@v4
        with:
          name: react-frontend-build
          path: react-frontend/dist

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # 🔴 This job used to run the axe CLI over four tenant URLs served by
      # `serve -s dist`. Measured on 2026-08-05, that was vacuous:
      #   * `serve -s` is an SPA fallback server, so all four URLs returned the
      #     SAME byte-identical 1,836-byte index.html. There were never 4 pages.
      #   * With no API reachable, TenantShell cannot load tenant config, so the
      #     app rendered its "Unable to connect" screen for every one of them.
      #     About, Help and Login were never scanned and could not be.
      #   * The count was forced to zero by three independent swallowing paths:
      #     `> file 2>&1` wrote axe's own error text into the JSON file, `|| true`
      #     discarded its exit code, and the inline python parser ended in a bare
      #     `except: print(0)`. A scanner crash counted as a pass.
      # Scanned honestly, that screen had 1 serious violation (white on the
      # default accent, 4.46:1 against AA's 4.5:1) and no `main` landmark at all.
      #
      # It now tests exactly what a backendless build can legitimately render —
      # the app shell and its offline state — through Playwright + axe with real
      # exit codes. Pages with real data are covered by the Real-Browser
      # Accessibility Gate in the e2e-smoke job, which runs the full Docker stack
      # with authenticated member and admin sessions and fails on ALL violations.
      # That is the authoritative browser-level gate; this is the cheap signal.
      - name: "BLOCKING: App shell and offline-state accessibility"
        run: |
          npx --yes serve -s react-frontend/dist -l 3000 > /tmp/serve.log 2>&1 &
          SERVE_PID=$!
          trap 'kill "$SERVE_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://localhost:3000/ >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://localhost:3000/ >/dev/null || {
            echo "::error::Static server never became ready"
            cat /tmp/serve.log || true
            exit 1
          }
          npx playwright test --config=e2e/playwright.shell.config.ts
        env:
          E2E_SHELL_BASE_URL: http://localhost:3000
          E2E_TENANT: hour-timebank
          CI: true

  mobile-release:
    name: Android Native Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: "BLOCKING: Verify Android release and OTA policy"
        working-directory: mobile
        run: npm run verify:release

      # The debug build permits cleartext to local dev hosts so the app can reach
      # a local API and Metro (without it, local device testing is impossible —
      # a network security config overrides android:usesCleartextTraffic on API
      # 24+, so the debug manifest's exemption alone did nothing). That split is
      # one careless edit away from disabling certificate pinning in production,
      # so it is asserted rather than trusted.
      - name: "BLOCKING: Verify the network security split (production still pinned)"
        working-directory: mobile
        run: npm run verify:network-security

      # The suite runs ONCE, under coverage. Running `npm test` and then the
      # coverage run separately doubled a ~90s serial job for no extra signal.
      # `--runInBand` is deliberate: ubuntu-latest is 4 vCPU, where parallel buys
      # little, and it keeps CI reproducible with `npx jest --runInBand` locally.
      # (Measured 2026-08-18 on the dev workstation: parallel 16s vs serial 71s,
      # identical 263-suite / 1,563-test pass counts. Parallel is for laptops.)
      - name: "BLOCKING: Mobile typecheck, tests and coverage ratchet"
        working-directory: mobile
        run: |
          npm run type-check
          npm run test:coverage -- --runInBand
          npm run coverage:ratchet
          npx expo-doctor

      # The Jest suite mocks the HTTP client, so it cannot see that an endpoint
      # was renamed or that React grew a member route mobile knows nothing about.
      # These two checks are the compensating controls. Both are static — no PHP,
      # no database, no device — so they run on this bare Node runner.
      #
      # api:check verifies against mobile/docs/generated/laravel-api-route-inventory.json
      # (from `artisan route:list`), NOT openapi.json, which documents only 862 of
      # the 2,232 paths the app registers. It exits 2 if that snapshot's fingerprint
      # no longer matches routes/**, so a stale snapshot fails rather than passing
      # vacuously — refresh it with `npm run api:routes`.
      - name: "BLOCKING: Mobile drift — route parity and API contract"
        working-directory: mobile
        run: npm run drift:check

      # Two value-level i18n gates. Both are shrink-only ratchets, and both exist
      # because the key-set parity checks report a clean sheet on this codebase:
      # every mobile key is present in every locale, so nothing could see that
      # 5,671 values were still English, or that the app's sign-up said nothing
      # about a minimum age while the web app's said 18 in all eleven languages.
      #
      # check:age-declaration is a ROOT script on purpose — it compares all three
      # sign-up doors (web, native, accessible), so it also runs in the i18n job,
      # which wakes on lang/** and the React locales. Here it covers the door that
      # changes under mobile/**.
      - name: "BLOCKING: Mobile translation ratchet and sign-up age declaration"
        working-directory: mobile
        run: |
          npm run check:untranslated
          node ../scripts/check-age-declaration.mjs

      # A bare language code has no region, so Intl formats English as US
      # English — 17 August 2026 renders 8/17/2026. Passing no locale at all
      # follows the device instead of the language chosen in Settings. Both
      # shipped. Every formatter must take dateLocale(); deliberate machine
      # formats carry a locale-exempt comment saying why. Mirrors the web app's
      # check-locale-formatting so both clients obey one rule.
      - name: "BLOCKING: Mobile dates must use the app's own locale"
        working-directory: mobile
        run: node scripts/check-date-locale.mjs

      # The bundle a release embeds, measured with the same Expo export a release
      # build uses, against the ceiling in mobile/startup-budget.json. It needs no
      # Android toolchain, so it belongs on this runner — and it is the only place
      # anything in this repo notices the app getting heavier. The script exits 2
      # when it cannot measure (no Expo CLI, export failure), which fails the step
      # rather than passing vacuously.
      - name: "BLOCKING: Mobile JavaScript bundle inside its budget"
        working-directory: mobile
        run: npm run budget:check

      # coverage:ratchet above enforces per-area shrink-only line floors from
      # mobile/coverage-baseline.json. A single global percentage cannot gate this
      # codebase: app/(modals)/ is 10,343 of 16,057 instrumented lines, so every
      # native-integration seam (secure storage, Pusher, Stripe, the root layout)
      # could go to zero while the global figure moved under two points.

      - name: "BLOCKING: Generate and inspect native Android policy"
        working-directory: mobile
        run: |
          npx expo prebuild --platform android --no-install --clean
          test -f android/app/src/main/res/xml/network_security_config.xml
          grep -q 'android:networkSecurityConfig="@xml/network_security_config"' android/app/src/main/AndroidManifest.xml
          grep -q '<domain includeSubdomains="false">api.project-nexus.ie</domain>' android/app/src/main/res/xml/network_security_config.xml
          grep -q 'digest="SHA-256"' android/app/src/main/res/xml/network_security_config.xml

  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - php-checks
      - react-build
      - react-tests-full
      - api-contract
      - docker-verify
      - dockerfile-drift
      - migration-gate
      - i18n-changed
      - i18n-drift
      - docs-hygiene
      - spdx-compliance
      - regression-patterns
      - e2e-smoke
      - accessibility-check
      - mobile-release

    steps:
      - name: Require every authoritative release gate
        env:
          RESULTS: >-
            ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Gate results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::At least one authoritative release gate failed or was cancelled."
              exit 1
            fi
          done
