            echo "::group::App container health"
            docker inspect nexus-ci-app --format='{{json .State.Health}}' || true
            echo "::endgroup::"
            echo "::group::App container logs"
            docker compose -f compose.ci.yml logs --no-color app || true
            echo "::endgroup::"
            echo "::group::Frontend container logs"
            docker compose -f compose.ci.yml logs --no-color frontend || true
            echo "::endgroup::"
            exit 1
          }
          echo "CI stack is healthy — all services passed their healthchecks."

