name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger — forces every job to run regardless of changed paths
  # (the per-job workflow_dispatch/schedule conditions below already opt in).
  # Use this to run the full suite on the current HEAD when the last push only
  # touched paths the changes-preflight skips (e.g. a CHANGELOG- or
  # .github-only commit). The deploy verifier (scripts/predeploy-ci-check.sh)
  # relies on this: it refuses to deploy a commit whose required jobs never
  # ran, and --trigger uses this dispatch to force the full run.
  workflow_dispatch:
  # Nightly full sweep at 03:30 UTC. Change-aware skipping means a job can stay
  # asleep for weeks while code it depends on drifts (the mobile contract bug,
  # 2026-08-03, sat invisible exactly this way). Every job below treats
  # `schedule` like `workflow_dispatch`, so the complete suite runs nightly —
  # and the deploy verifier then finds fresh full evidence instead of forcing
  # a ~40-minute dispatch run at deploy time. Scheduled runs get their own
  # concurrency group (below) so they never cancel, or get cancelled by, a
  # late-night push run.
  schedule:
    - cron: '30 3 * * *'

permissions:
  contents: read
  pull-requests: write

# Cancel superseded runs on the same ref. During an iterative fix session,
# each push previously started a full fresh pipeline while the older runs kept
# executing and saturated the runner pool — the "CI has been queued for hours"
# symptom. A new push now cancels its own in-flight predecessor on this ref.
# (Different workflows use different github.workflow names, so they never
# cancel each other; different branches/PRs get their own group via github.ref.)
concurrency:
  # Scheduled (nightly) runs get their own group: a 03:30 sweep must not cancel
  # an in-flight late-night push run, and a morning push must not kill the
  # nightly evidence the deploy verifier depends on.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'schedule' && 'nightly' || 'ci' }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.2'
  # Must match react-frontend/package.json engines (node >=22) and the
  # node:22 base in all Dockerfiles. On node 20 (npm 10.8.2) `npm ci` fails
  # because newer deps (posthog-node, i18next-cli) require node >=22 and the
  # older npm enforces lockfile sync more strictly. See commit history.
  NODE_VERSION: '22'

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Stage 0: Detect which areas changed. Unrelated changes should not pay
  # for the whole pipeline: a frontend-only change skips the ~sharded PHP
  # suite, a backend-only change skips the React build + e2e + a11y cluster,
  # and a docs/CI-only change skips both. Manual `workflow_dispatch` always
  # runs everything (escape hatch). Mirrors the existing i18n-changed filter,
  # which already runs dorny/paths-filter on this repo for push and PR events.
  # ─────────────────────────────────────────────────────────────────
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      php: ${{ steps.filter.outputs.php }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mobile: ${{ steps.filter.outputs.mobile }}
      accessible: ${{ steps.filter.outputs.accessible }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          # Path lists live in .github/ci-paths.yml — the SAME file the deploy
          # verifier (scripts/predeploy-ci-verify.mjs) reads to decide whether
          # an older check result still covers the commit being deployed. One
          # source of truth: CI's skip decisions and the deploy verifier can
          # never disagree about what a job depends on. Change watch-lists
          # there and only there.
          filters: .github/ci-paths.yml

  # ─────────────────────────────────────────────────────────────────
  # Stage 1a: PHP Tests — PHPUnit, sharded across parallel runners.
  #
  # The ~12.5k-test Laravel suite ran single-threaded and took ~2h, making it
  # the long pole every PR waited on. It is now split into SHARD_TOTAL stable
  # buckets by scripts/ci/phpunit-shard.php and run as a matrix. Stable path
  # hashing avoids surprise shard reshuffles, but runtime balance can drift as
  # the suite changes. Each shard gets its OWN MariaDB + Redis service,
  # so there is no cross-worker DB contention — every shard is the same
  # isolated, single-threaded environment the suite was written for, just
  # smaller. (Keep the matrix list length in sync with SHARD_TOTAL.)
  # ─────────────────────────────────────────────────────────────────
  php-tests:
    name: PHP Tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: needs.changes.outputs.php == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    env:
      SHARD_TOTAL: '6'
      PHPUNIT_SHARD_TIMEOUT_SECONDS: '2400'

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: testing
          MYSQL_DATABASE: nexus_test
          MYSQL_USER: nexus
          MYSQL_PASSWORD: nexus_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_mysql, mbstring, xml, zip, redis, gd, intl, bcmath, opcache, curl, fileinfo, gmp
          # coverage disabled: xdebug instrumented every test and made the suite
          # take 20+ min. php-tests does not consume coverage output.
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare Laravel Runtime Directories
        run: |
          mkdir -p bootstrap/cache storage/framework/{cache,sessions,views} storage/logs
          chmod -R ug+rw bootstrap/cache storage

      - name: Setup Test Database Schema
        run: |
          echo "Loading schema into nexus_test database..."
          mysql -h 127.0.0.1 -u root -ptesting nexus_test < database/schema/mysql-schema.sql
          echo "Creating nexus database for DatabaseTestCase fallback..."
          mysql -h 127.0.0.1 -u root -ptesting -e "CREATE DATABASE IF NOT EXISTS nexus;"
          mysql -h 127.0.0.1 -u root -ptesting -e "GRANT ALL PRIVILEGES ON nexus.* TO 'nexus'@'%';"
          mysql -h 127.0.0.1 -u root -ptesting -e "FLUSH PRIVILEGES;"
          mysql -h 127.0.0.1 -u root -ptesting nexus < database/schema/mysql-schema.sql
          echo "Seeding test tenants and categories..."
          mysql -h 127.0.0.1 -u root -ptesting nexus_test -e "INSERT INTO tenants (id, name, slug, is_active) VALUES (1, 'Test Tenant', 'test-tenant', 1), (2, 'Test Tenant 2', 'test-tenant-2', 1);"
          mysql -h 127.0.0.1 -u root -ptesting nexus_test -e "INSERT IGNORE INTO categories (id, name, slug, tenant_id, type) VALUES (1, 'General', 'general', 1, 'listing');"
          mysql -h 127.0.0.1 -u root -ptesting nexus -e "INSERT INTO tenants (id, name, slug, is_active) VALUES (1, 'Test Tenant', 'test-tenant', 1), (2, 'Test Tenant 2', 'test-tenant-2', 1);"
          mysql -h 127.0.0.1 -u root -ptesting nexus -e "INSERT IGNORE INTO categories (id, name, slug, tenant_id, type) VALUES (1, 'General', 'general', 1, 'listing');"
          echo "Test database schema and seed data loaded successfully."

      # The schema dump is refreshed from PRODUCTION, so migrations that
      # haven't been deployed yet are missing from it. Run pending Laravel
      # migrations on both databases so feature tests see new tables/columns
      # before the code that needs them ships.
      - name: Run pending migrations on test databases
        run: |
          php artisan migrate --force
          DB_DATABASE=nexus php artisan migrate --force
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: nexus_test
          DB_USER: root
          DB_PASS: testing
          APP_ENV: testing
          APP_KEY: base64:HfQEDtbtr90JIXhsaAhSFWnzIo1f31VZ2e5qLqKKnls=
          CACHE_DRIVER: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          LOG_CHANNEL: "null"
          BROADCAST_CONNECTION: "null"
          BROADCAST_DRIVER: "null"

      # --display-warnings/--display-deprecations: phpunit.xml sets
      # failOnWarning/failOnRisky=true, so a single warning fails this gate
      # with a bare "OK, but there were issues!" and no detail. The display
      # flags itemise the offending tests so the red is actionable.
      #
      # The test files for this shard come from phpunit-shard.php; passing
      # explicit paths still honours phpunit.xml (bootstrap, <php> env, and the
      # slow/external <groups> excludes), so behaviour matches the full run.
      - name: "BLOCKING: PHPUnit Laravel suite (shard ${{ matrix.shard }}/${{ env.SHARD_TOTAL }})"
        shell: bash
        run: |
          mapfile -t FILES < <(php scripts/ci/phpunit-shard.php "${{ matrix.shard }}" "$SHARD_TOTAL")
          echo "Shard ${{ matrix.shard }}/$SHARD_TOTAL -> ${#FILES[@]} test files"
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::No test files assigned to shard ${{ matrix.shard }}/$SHARD_TOTAL"
            exit 1
          fi

          {
            echo "### PHP shard ${{ matrix.shard }}/$SHARD_TOTAL"
            echo ""
            echo "- Test files: ${#FILES[@]}"
            echo "- PHPUnit timeout: ${PHPUNIT_SHARD_TIMEOUT_SECONDS}s"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::group::Shard ${{ matrix.shard }} test files"
          printf '%s\n' "${FILES[@]}"
          echo "::endgroup::"

          start_epoch="$(date +%s)"
          set +e
          timeout --kill-after=60s "${PHPUNIT_SHARD_TIMEOUT_SECONDS}s" \
            vendor/bin/phpunit --colors=always --no-coverage \
            --display-warnings --display-deprecations --display-incomplete --display-skipped \
            "${FILES[@]}"
          status=$?
          set -e
          elapsed=$(( $(date +%s) - start_epoch ))

          {
            echo "- PHPUnit elapsed: ${elapsed}s"
            echo "- Exit code: ${status}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$status" -eq 124 ]; then
            echo "::error::PHPUnit shard ${{ matrix.shard }}/$SHARD_TOTAL exceeded ${PHPUNIT_SHARD_TIMEOUT_SECONDS}s before completing. Rebalance this shard or raise the shard timeout."
          elif [ "$status" -eq 137 ]; then
            echo "::error::PHPUnit shard ${{ matrix.shard }}/$SHARD_TOTAL was killed after exceeding the grace period."
          fi

          exit "$status"
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: nexus_test
          DB_USER: nexus
          DB_PASS: nexus_test
          APP_ENV: testing
          # Fixed test key (matches phpunit.xml) so encryption/Crypt tests don't
          # MissingAppKeyException — this step runs before key:generate.
          APP_KEY: base64:HfQEDtbtr90JIXhsaAhSFWnzIo1f31VZ2e5qLqKKnls=
          CACHE_DRIVER: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          LOG_CHANNEL: null

  # ─────────────────────────────────────────────────────────────────
  # Stage 1b: PHP Static Analysis & guards — syntax, schema-skip budget,
  # PHPStan, env-var doc check, and the artisan cache fail-fast test. These
  # are independent of the test run, so they execute in parallel with the
  # shards instead of waiting behind a 2h suite (as they did before).
  # ─────────────────────────────────────────────────────────────────
  php-analysis:
    name: PHP Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.php == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: testing
          MYSQL_DATABASE: nexus_test
          MYSQL_USER: nexus
          MYSQL_PASSWORD: nexus_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_mysql, mbstring, xml, zip, redis, gd, intl, bcmath, opcache, curl, fileinfo, gmp
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare Laravel Runtime Directories
        run: |
          mkdir -p bootstrap/cache storage/framework/{cache,sessions,views} storage/logs
          chmod -R ug+rw bootstrap/cache storage

      - name: Setup Test Database Schema
        run: |
          echo "Loading schema into nexus_test database..."
          mysql -h 127.0.0.1 -u root -ptesting nexus_test < database/schema/mysql-schema.sql
          mysql -h 127.0.0.1 -u root -ptesting -e "CREATE DATABASE IF NOT EXISTS nexus;"
          mysql -h 127.0.0.1 -u root -ptesting -e "GRANT ALL PRIVILEGES ON nexus.* TO 'nexus'@'%';"
          mysql -h 127.0.0.1 -u root -ptesting -e "FLUSH PRIVILEGES;"
          mysql -h 127.0.0.1 -u root -ptesting nexus < database/schema/mysql-schema.sql

      - name: Run pending migrations on test databases
        run: |
          php artisan migrate --force
          DB_DATABASE=nexus php artisan migrate --force
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: nexus_test
          DB_USER: root
          DB_PASS: testing
          APP_ENV: testing
          APP_KEY: base64:HfQEDtbtr90JIXhsaAhSFWnzIo1f31VZ2e5qLqKKnls=
          CACHE_DRIVER: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          LOG_CHANNEL: "null"
          BROADCAST_CONNECTION: "null"
          BROADCAST_DRIVER: "null"

      - name: PHP Syntax Check
        run: |
          echo "Checking PHP syntax in app/ ..."
          ERRORS=$(find app -name "*.php" -print0 | xargs -0 -n1 php -l 2>&1 | grep -c "Parse error" || true)
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::Found $ERRORS PHP syntax error(s):"
            find app -name "*.php" -print0 | xargs -0 -n1 php -l 2>&1 | grep "Parse error"
            exit 1
          fi
          echo "All PHP files passed syntax check."

      # Schema-driven test-skip ratchet. Counts PHPUnit tests that skip when the
      # test DB lacks a table/column (they protect nothing) and fails if the
      # count rises above the committed baseline; refresh the schema dump and
      # convert skips to real tests to lower it.
      - name: "BLOCKING: Schema-driven test-skip budget"
        run: node scripts/check-test-skip-budget.mjs

      # --memory-limit=2G: larastan boots the Laravel app, which doesn't fit in
      # 512M alongside the parallel workers (it OOMs). GitHub runners have ample RAM.
      - name: "BLOCKING: PHPStan static analysis (level 1, larastan + baseline)"
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G --error-format=github
        env:
          # larastan boots the full Laravel app; routes/channels.php resolves the
          # default broadcaster at route load, and the 'pusher' driver throws on
          # a null PUSHER_KEY (no secrets in CI). Null-driver pin matches the
          # migration step.
          BROADCAST_CONNECTION: "null"
          BROADCAST_DRIVER: "null"

      # TD15: Validate that all required env vars referenced in config/ are
      # documented in .env.example. WARNING-ONLY (see history); surfaces new
      # gaps without blocking.
      - name: "WARNING: Validate required env vars are documented"
        run: |
          cp .env.example .env.ci
          php scripts/validate-env.php --file=.env.ci || \
              echo "::warning::New env() calls in config/ may not be documented in .env.example — review output above"
        continue-on-error: true

      # TD15: Exercise artisan cache commands — these are fail-fast at container
      # start in Dockerfile.prod. Any failure here would crash-loop production.
      - name: "BLOCKING: Artisan cache fail-fast test"
        run: |
          [ -f .env ] || cp .env.example .env
          mkdir -p bootstrap/cache
          php artisan key:generate --force --ansi
          php artisan config:cache
          php artisan route:cache
          php artisan event:cache
          php artisan config:clear
          php artisan route:clear
          php artisan event:clear
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: nexus_test
          DB_USER: nexus
          DB_PASS: nexus_test
          REDIS_HOST: 127.0.0.1
          APP_ENV: testing

  # ─────────────────────────────────────────────────────────────────
  # Stage 1: PHP Checks — aggregate gate. Kept under this exact name so the
  # existing required status check and docker-verify's `needs: php-checks`
  # stay valid. Green only when every test shard AND the static analysis job
  # succeed; reports a clear failure otherwise.
  # ─────────────────────────────────────────────────────────────────
  php-checks:
    name: PHP Checks
    runs-on: ubuntu-latest
    needs: [changes, php-tests, php-analysis]
    if: always()

    steps:
      - name: Verify PHP tests and analysis passed
        run: |
          tests="${{ needs.php-tests.result }}"
          analysis="${{ needs.php-analysis.result }}"
          echo "php-tests    = $tests"
          echo "php-analysis = $analysis"
          # 'skipped' means this change touched no PHP-relevant paths, so the
          # suite legitimately did not run — that is a pass, not a failure.
          # Only a real 'failure'/'cancelled' should red this aggregate gate
          # (which stays the same status-check name downstream jobs depend on).
          for r in "$tests" "$analysis"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::PHP checks failed (tests=$tests, analysis=$analysis)"
              exit 1
            fi
          done
          echo "PHP checks OK (tests=$tests, analysis=$analysis). 'skipped' = no PHP-relevant changes in this run."

  # ─────────────────────────────────────────────────────────────────
  # Stage 2: React Frontend (TypeScript + Vitest + Build)
  # ─────────────────────────────────────────────────────────────────
  react-build:
    name: React Build & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: react-frontend/package-lock.json

      - name: Install Dependencies
        working-directory: react-frontend
        run: npm ci

      - name: TypeScript Check (BLOCKING)
        working-directory: react-frontend
        run: npx tsc --noEmit

      # Test-file type ratchet (BLOCKING). tsconfig.json excludes every test file
      # and the src/test harness, and eslint ignores them too, so until now test
      # files were type-checked by NOTHING and ~1,950 errors accumulated unseen.
      # tsconfig.tests.json lifts that exclusion; the gate holds the count to a
      # shrink-only baseline so existing debt is recorded, not fixed in one pass,
      # while NEW breakage fails on the commit that introduces it.
      # Fixed errors also fail, demanding a baseline regenerate to lock the win in.
      - name: Test-File TypeScript Ratchet (BLOCKING)
        working-directory: react-frontend
        timeout-minutes: 10
        run: npm run check:test-types

      # Ceiling on the full-suite job's quarantine list. It lives HERE, in a
      # blocking job, and not in react-tests-full: that job carries
      # continue-on-error at the JOB level, which swallows every step inside it,
      # so a gate placed there would read as enforced while being unable to fail
      # the build. The quarantine list is the obvious way to fake a green shard,
      # so its ceiling is enforced from the start rather than at flip time.
      - name: Quarantine Budget Ceiling (BLOCKING)
        working-directory: react-frontend
        run: npm run check:quarantine-budget

      # ESLint ratchet (BLOCKING). Cap tracks the current warning count (25) with
      # a small buffer; it must only ever be LOWERED, never raised. Previously the
      # cap was 1000 and eslint ran in no CI step at all, so warnings were ungated.
      - name: ESLint (BLOCKING)
        working-directory: react-frontend
        run: npx eslint src --max-warnings 30

      - name: Component Accessibility Gate (BLOCKING)
        working-directory: react-frontend
        run: npm run test:a11y -- --run

      - name: UI Contract Console Gate (BLOCKING)
        working-directory: react-frontend
        # Also runs src/components/ui/BarrelMock.contract.test.ts, the shrink-only
        # ratchet on dead barrel-mock overrides. That file must stay in
        # src/components/ui/ — src/test/ is in no CI selection.
        run: npm run test:ui-contracts -- --run

      - name: Dead Barrel-Mock Scanner Unit Tests (BLOCKING)
        working-directory: react-frontend
        run: npm run test:dead-mocks

      - name: Remediated Barrel-Mock Suites (BLOCKING)
        # Explicit list of suites whose barrel mocks have been repaired, so they
        # cannot silently rot back. NEXUS_FAIL_ON_UNEXPECTED_CONSOLE is 0 here
        # (unlike test:ui-contracts): FeedPage.test.tsx passes 17/17 but still
        # emits pre-existing React act() warnings, and a gate that is red on day
        # one gets switched off. Raise it to 1 once those warnings are fixed.
        #
        # The script carries --retry=1 (package.json — JSON cannot hold comments,
        # so the reason lives here). This was the last blocking vitest path with
        # no retry, and it reded main twice on 2026-07-28 from load-timing flakes:
        # ConversationPage ("message-input-area" absent) and TeamChatrooms (queried
        # a button while loading spinners were still rendered). Both pass locally
        # on first attempt and both pass in the full-suite shard job, which does
        # retry. A genuinely broken test still fails both attempts and still reds
        # this step; only the timing lottery is removed.
        #
        # 🔴 The ConversationPage half is FIXED as of 2026-07-30 and is no longer a
        # reason to keep --retry=1. It was never a timing lottery: pollForNewMessages
        # rewrote the composer's safeguarding gate from every 5s poll response, and
        # three tests mocked api.get with URL branching that never modelled the poll
        # URL, so the poll answered with a payload contradicting the state under
        # test. A second 5s interval (the safeguarding recheck) disagreed on the same
        # deadline, so the gate OSCILLATED — which is exactly why --retry=1 never
        # rescued it. Fixed in ConversationPage.tsx (poll only moves the gate when
        # the response actually carried meta.conversation) plus one total api.get
        # mock in the suite. Verified deterministic with the poll interval forced to
        # 50ms, i.e. ~100 polls per test. If ConversationPage reds this step again,
        # do NOT re-attribute it to load — look for a new un-modelled request.
        # TeamChatrooms still needs the retry, so --retry=1 stays for now.
        #
        # A second, latent instance of the same family was closed on 2026-07-30:
        # the two "in-page safeguarding panel" tests submit and then assert on a
        # send-time denial, which either 5s background timer used to erase by
        # applying the preflight 'allow' the mock returns for every URL. That one
        # was fixed in the component as a safeguarding SEMANTICS change (a
        # source:'send' notice now outranks a background 'allow', because
        # MessageService::send re-checks against LOCKED rows while the preflight
        # reads unlocked) rather than by widening the mocks, so the tests assert
        # real product behaviour. Both are pinned by regression tests.
        #
        # 🔴 This step is now fully subsumed by react-tests-full (its files are a
        # subset of the 1,177 that job runs). Retire it once that job has a longer
        # green record — keeping both costs CI time for no extra coverage.
        working-directory: react-frontend
        run: npm run test:mock-contract -- --run

      - name: Vitest Focused Smoke Tests (BLOCKING)
        # The parallel-worker-pool hang (ERR_IPC_CHANNEL_CLOSED / "Channel closed")
        # that made this step non-blocking is fixed by the serial single-fork
        # invocation below, and has not recurred: this step concluded `success` in
        # every run where react-build executed (30153420222, 30152754902,
        # 30151748615, 30150856918, 30099665348). The ERR_IPC strings still visible
        # in those logs are this comment being echoed by bash, not runtime errors.
        # It is now blocking — a green step behind continue-on-error reports nothing
        # if it ever breaks, which is how six suites sat red unnoticed.
        # Keep --pool=forks --singleFork: that is the fix, not a workaround.
        working-directory: react-frontend
        shell: bash
        run: |
          # Single source of truth — this list used to be duplicated inline here
          # and in the coverage step below, free to drift apart unnoticed.
          mapfile -t TESTS < <(grep -vE '^\s*(#|$)' scripts/ci-smoke-suites.txt)
          echo "Smoke suites: ${#TESTS[@]}"
          # Run serially in a single fork — the parallel worker pool hangs/dies
          # (ERR_IPC_CHANNEL_CLOSED) on this set; serial is what passes locally.
          npx vitest run "${TESTS[@]}" --pool=forks --poolOptions.forks.singleFork=true
        timeout-minutes: 6

      - name: Vitest Coverage Report (WARNING)
        working-directory: react-frontend
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t TESTS < <(grep -vE '^\s*(#|$)' scripts/ci-smoke-suites.txt)
          set -o pipefail
          npx vitest run "${TESTS[@]}" --coverage --coverage.reporter=text --coverage.reporter=json-summary 2>&1 | tee /tmp/vitest-coverage.txt
          EXIT_CODE=${PIPESTATUS[0]}
          tail -50 /tmp/vitest-coverage.txt
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::warning::Focused coverage report did not meet the global full-suite thresholds. Full frontend coverage is tracked outside this Caring PR because the broad suite currently has unrelated stale failures."
          fi
          exit $EXIT_CODE
        timeout-minutes: 8

      - name: Post Coverage Report as PR Comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: vitest-coverage
          message: |
            ## Vitest Coverage Report

            Focused smoke tests and coverage are currently non-blocking while the documented Vitest worker hang is resolved. TypeScript, ESLint, accessibility, UI-contract, and production-build gates remain blocking.

            <details>
            <summary>View full coverage output</summary>

            _Coverage data is generated during the "Vitest Coverage Report" step above._
            _Review the step output for detailed line-by-line coverage._

            </details>

            > Generated by CI pipeline — [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Build Production Bundle (BLOCKING)
        working-directory: react-frontend
        run: npm run build
        env:
          VITE_API_BASE: /api
          NEXUS_SKIP_PRERENDER: "1"

      - name: Upload React Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-frontend-build
          path: react-frontend/dist
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────
  # Stage 2b: API Contract Validation
  # Runs Zod schema contract tests to detect frontend/backend schema drift.
  # Failure = PHP controller changed response shape without updating TypeScript.
  # ─────────────────────────────────────────────────────────────────
  api-contract:
    name: "BLOCKING: API Contract Validation"
    runs-on: ubuntu-latest
    needs: [changes, react-build]
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: react-frontend/package-lock.json

      - name: Install Dependencies
        working-directory: react-frontend
        run: npm ci

      - name: "BLOCKING: Run API contract schema tests"
        working-directory: react-frontend
        shell: bash
        run: |
          # Runs Zod schema contract tests only (fast, ~5s).
          # Tests use hardcoded representative payloads mirroring PHP backend
          # response shapes. Failure means PHP/TypeScript schema drift detected.
          npx vitest run src/lib/api-schemas.test.ts --reporter=verbose
        timeout-minutes: 3

  # Full frontend suite, sharded. The blocking vitest steps in react-build cover
  # roughly 150 of ~1,283 test files, so ~88% of the suite could break with a
  # green build — which is why breakage here is only ever found in large batches
  # (302 dead mocks, ~90 dead suites in July 2026).
  #
  # BLOCKING as of 2026-07-28. It spent its shakedown non-blocking while the
  # quarantine list was catalogued, and was flipped once two consecutive runs had
  # all eight shards green with zero real failures and zero retries needed
  # (30360722853 and 30363569366). All three parts of the flip are in place:
  #   1. no continue-on-error on this job
  #   2. `react-tests-full` IS in the release-gate `needs:` list — that job
  #      aggregates needs.*.result, so a job absent from the list cannot fail the
  #      gate no matter what it concludes. Adding a job here without adding it
  #      there produces something that reads as enforced and enforces nothing.
  #   3. the quarantine ceiling (scripts/check-quarantine-budget.mjs) runs in
  #      react-build, so the list cannot be grown to make a red shard green.
  #      It lives there and not here because a step inside THIS job would have
  #      been swallowed by the job-level continue-on-error during shakedown.
  #
  # fail-fast is off so one shard's failure does not cancel the other seven and
  # hide their results. --reporter=verbose names each file as it starts, so a
  # shard that hits the timeout identifies the suite that hung.
  #
  # The runner passes --retry=1: an intermittent test passes on its second
  # attempt while a genuinely broken one fails twice and still reds the shard.
  # That is what makes this job safe to gate on. It does not make flakiness
  # acceptable — a suite that keeps needing the retry is a bug to fix.
  react-tests-full:
    name: React Full Suite (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: react-frontend/package-lock.json

      - name: Install Dependencies
        working-directory: react-frontend
        run: npm ci

      - name: Run shard ${{ matrix.shard }} of 8
        working-directory: react-frontend
        run: node scripts/run-vitest-shard.mjs --shard ${{ matrix.shard }}/8 --extra-arg=--reporter=verbose

      # Visibility only: prints how the quarantined suites are doing so a fixed
      # one gets noticed and removed from the list, instead of sitting there
      # forever because nothing ever runs it.
      - name: Quarantined suites (VISIBILITY, shard 1 only)
        if: matrix.shard == 1
        continue-on-error: true
        working-directory: react-frontend
        run: node scripts/run-vitest-shard.mjs --quarantined --extra-arg=--reporter=basic

  # ─────────────────────────────────────────────────────────────────
  # Stage 3: Docker Build Verification
  # ─────────────────────────────────────────────────────────────────
  docker-verify:
    name: Docker Build Verify
    runs-on: ubuntu-latest
    # Only on push to main + manual dispatch — skipped on PRs.
    # Rebuilding 4 Docker images with --no-cache is ~15–25 min and almost
    # always passes; running it post-merge gives the same safety with no
    # PR-time tax. Trigger manually with `gh workflow run ci.yml` if needed.
    #
    # always() + explicit result checks: react-build / api-contract are SKIPPED
    # on a backend-only change, and a skipped need would otherwise cascade-skip
    # this job — but the PHP image still needs verifying. So skipped is
    # tolerated; only a genuine failure/cancellation (or a non-passing
    # php-checks) blocks. A docs/CI-only run (php AND frontend both unchanged)
    # skips the image build entirely.
    needs: [changes, php-checks, react-build, api-contract]
    if: >-
      always()
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
      && (needs.changes.outputs.php == 'true' || needs.changes.outputs.frontend == 'true'
      || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
      && needs.php-checks.result == 'success'
      && needs.react-build.result != 'failure' && needs.react-build.result != 'cancelled'
      && needs.api-contract.result != 'failure' && needs.api-contract.result != 'cancelled'

    steps:
      - uses: actions/checkout@v4

      - name: Build PHP Container
        run: docker build --no-cache -f Dockerfile -t nexus-php-test:ci .

      - name: Build Production PHP Container
        run: docker build --no-cache -f Dockerfile.prod -t nexus-php-prod-test:ci .

      - name: Build React Frontend Container
        working-directory: react-frontend
        run: |
          if [ -f Dockerfile.prod ]; then
            docker build --no-cache -f Dockerfile.prod --build-arg VITE_API_BASE=/api -t nexus-react-test:ci .
          elif [ -f Dockerfile ]; then
            docker build --no-cache -f Dockerfile -t nexus-react-test:ci .
          fi

      - name: Verify PHP Container Starts
        run: |
          docker run -d --name php-test nexus-php-prod-test:ci
          sleep 5
          docker exec php-test curl -sf http://localhost/up || echo "::warning::Health check failed"
          docker stop php-test

  # ─────────────────────────────────────────────────────────────────
  # Stage 4: Dockerfile Drift Detection
  # ─────────────────────────────────────────────────────────────────
  dockerfile-drift:
    name: Dockerfile Drift Detection
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compare PHP settings between Dockerfile and Dockerfile.prod
        run: |
          echo "========================================="
          echo "Dockerfile Drift Detection"
          echo "========================================="
          echo ""

          SETTINGS="upload_max_filesize post_max_size max_execution_time max_input_time max_input_vars memory_limit"
          DRIFT_FOUND=0

          for SETTING in $SETTINGS; do
            # Extract value from Dockerfile (dev)
            DEV_VALUE=$(grep -oP "${SETTING}\s*=\s*\K[^\s\\\\]+" Dockerfile || echo "NOT_SET")
            # Extract value from Dockerfile.prod
            PROD_VALUE=$(grep -oP "${SETTING}\s*=\s*\K[^\s\\\\]+" Dockerfile.prod || echo "NOT_SET")

            if [ "$DEV_VALUE" != "$PROD_VALUE" ]; then
              echo "::error::DRIFT DETECTED: ${SETTING} differs between Dockerfile (${DEV_VALUE}) and Dockerfile.prod (${PROD_VALUE})"
              DRIFT_FOUND=1
            else
              echo "OK: ${SETTING} = ${DEV_VALUE} (both files match)"
            fi
          done

          echo ""
          if [ "$DRIFT_FOUND" -eq 1 ]; then
            echo "========================================="
            echo "FAILURE: Dockerfile settings have drifted!"
            echo "Update both Dockerfile and Dockerfile.prod to keep PHP settings in sync."
            echo "========================================="
            exit 1
          else
            echo "========================================="
            echo "SUCCESS: All tracked PHP settings match."
            echo "========================================="
          fi

  # ─────────────────────────────────────────────────────────────────
  # Stage 5: Migration Safety Gate
  # ─────────────────────────────────────────────────────────────────
  migration-gate:
    name: Migration Safety Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "BLOCKING: Check schema changes have migrations"
        run: bash scripts/check-migration-ci.sh origin/${{ github.base_ref || 'main' }}

      - name: "BLOCKING: Block new legacy SQL migrations (use Laravel instead)"
        run: bash scripts/check-no-new-legacy-sql.sh origin/${{ github.base_ref || 'main' }}

      - name: "BLOCKING: Prerender cron installer runtime test"
        run: bash tests/scripts/install-prerender-cron-test.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Catches PHP writing a column or table that does not exist. Added
      # 2026-07-30 after GroupModerationService was found writing three
      # non-existent columns to group_content_flags for four months: every write
      # threw, but each method wrapped its body in catch (\Throwable) and returned
      # a plausible value, so it read as "nothing to do" rather than "broken".
      # PHPStan cannot see this — it does not know the schema — and the tests that
      # cover those paths assert the swallowed return value.
      #
      # It parses the committed schema dump rather than connecting to a database,
      # so a green result means something on every runner. Pre-existing problems
      # are tracked in .github/db-column-reference-baseline.json, shrink-only and
      # enforced in both directions: an entry that no longer occurs also fails, so
      # a fix cannot land without removing its entry.
      - name: "BLOCKING: DB column references resolve against the schema dump"
        run: node scripts/check-db-column-references.mjs

      - name: "WARNING: Schema dump drift detection"
        run: bash scripts/check-schema-drift.sh || true

  # ─────────────────────────────────────────────────────────────────
  # Stage 6: Translation Drift Detection
  # ─────────────────────────────────────────────────────────────────
  # Detect whether this push/PR actually touches files that could affect i18n.
  # Job-level paths filtering avoids running the (relatively slow) i18n-drift
  # job on backend-only or infra-only changes.
  i18n-changed:
    name: i18n changed-files filter
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.i18n }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          # The i18n path list lives in .github/ci-paths.yml alongside the
          # area filters — same single-source-of-truth rule as the `changes`
          # job above; the deploy verifier reads the identical list.
          filters: .github/ci-paths.yml

  i18n-drift:
    name: Translation Drift Detection
    needs: i18n-changed
    # workflow_dispatch forces this on even when no i18n path changed, so a
    # deliberate "check everything" run really does check everything. The
    # pre-deploy verifier (scripts/predeploy-ci-check.sh) treats a SKIPPED job
    # as "not checked", so without this escape a forced run could never reach
    # full coverage and deploys would be blocked forever.
    if: needs.i18n-changed.outputs.run == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install React i18n tooling
        run: npm ci --prefix react-frontend

      - name: "BLOCKING: Check for translation key mismatches"
        run: node scripts/check-i18n-drift.mjs

      - name: "BLOCKING: Prevent non-admin React hardcoded-string regressions"
        run: node scripts/check-i18n-literals.mjs

      - name: "BLOCKING: Check for hardcoded strings in PHP code"
        run: bash scripts/check-i18n.sh

      # PHP lang/*.php parity gate — react-frontend JSON has been drift-gated
      # for months, but lang/ was not, which let new lang/en keys sit
      # untranslated for weeks (added 2026-06-11). Uses the runner's PHP CLI.
      - name: "BLOCKING: PHP lang/ translation parity"
        run: node scripts/check-php-lang-parity.mjs

      # Added 2026-07-29. The parity gate above compares KEY SETS, so a locale
      # file passes it while every value in it is a verbatim copy of the English
      # one — which is what 62.3% of non-English lang/ values were (99,140 of
      # 159,140) on the day this was added, with parity green. Pasted English is
      # invisible to a key-set check by construction. This counts values, and is
      # a shrink-only ceiling rather than a pass/fail line: a 99k debt cannot be
      # paid off in the commit that starts measuring it.
      - name: "BLOCKING: PHP lang/ untranslated value ratchet"
        run: node scripts/check-php-lang-untranslated.mjs

      # Added 2026-08-01. This script already existed but nothing ran it, so its
      # findings rotted: it had been reporting a corrupted Spanish feedback link
      # (a translator turned "mailto:" into "enviar correo a:") for an unknown
      # length of time, and a second, worse case in Arabic was slipping past the
      # script itself. Same lesson as the token-integrity gate above — an
      # unenforced check is not a check.
      - name: "BLOCKING: Accessible frontend translation integrity"
        run: node scripts/check-govuk-alpha-translations.mjs

      # Added 2026-07-29. Translators (human or machine) translate things that
      # must stay literal — routes, placeholders, config keys. This caught the
      # Irish admin copy rendering the route /partner/v1 as /comhpháirtí/v1,
      # i.e. sending Irish-speaking admins to an address that does not exist.
      # A translated URL is a broken instruction, and the drift gate above
      # cannot see it: the key is present, only its value is wrong.
      - name: "BLOCKING: Admin i18n functional token integrity"
        run: node scripts/check-admin-i18n-token-integrity.mjs

      # Added 2026-07-29. Admin screens hold a lot of render text in TypeScript
      # objects and in server messages, where a JSX-only linter cannot see it.
      # This pass covers those indirect paths, including the case that hid a
      # whole family of untranslated toasts: a server message read through a
      # cast, `(res as { message?: string }).message`, which the old receiver
      # match could not recognise. It was already run by hand and is now
      # blocking, because a check nobody remembers to type is not a check.
      - name: "BLOCKING: Admin indirect UI literals"
        run: node scripts/check-admin-ui-literals.mjs

      # Re-added 2026-06-06: admin panel is multilingual again (policy reversed
      # 2026-05-22). Validates admin t() keys resolve against the English locale.
      - name: "BLOCKING: Admin translation key coverage"
        run: node scripts/check-admin-i18n.mjs

      # Floating-baseline gate — surfaces drift but does not block merge.
      # Counts strings where translation == English (i.e. English fallback in
      # use). Unrelated PRs frequently trip this when other commits add new
      # English keys. Refresh the baseline on `main` with:
      #   node scripts/check-i18n-gap-regression.mjs --write-baseline
      - name: "WARNING: Prevent non-admin translation-gap regressions"
        run: npm run check:i18n:baseline
        continue-on-error: true

      - name: "BLOCKING: Prevent stub placeholder translation values"
        run: node scripts/check-i18n-stubs.mjs

      # check-admin-breadcrumbs REMOVED 2026-04-22 — admin is English-only by design.
      # See memory/feedback_admin_english_only.md.

      # Floating-baseline gate — surfaces missing t() keys but does not block.
      # Ratchets down on every commit; unrelated PRs frequently trip the
      # baseline when other commits add new t() calls.
      - name: "WARNING: Exhaustive t() key coverage (ratchets down via baseline)"
        run: node scripts/check-i18n-coverage.mjs
        continue-on-error: true

      - name: "BLOCKING: Variable-name mismatches between t() args and {{placeholders}}"
        run: node scripts/check-i18n-vars.mjs

      # Floating-baseline gate — surfaces missing __() keys but does not block.
      - name: "WARNING: PHP __() key coverage (emails, notifications, services)"
        run: node scripts/check-php-i18n-coverage.mjs
        continue-on-error: true

      - name: "INFO: Audit non-admin English fallback gaps"
        run: npm run check:i18n:gaps


  # ─────────────────────────────────────────────────────────────────
  # Stage 6b: Documentation, Version, and Changelog Hygiene
  # ─────────────────────────────────────────────────────────────────
  docs-hygiene:
    name: Documentation, Version, and Changelog Hygiene
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "BLOCKING: Keep docs/ curated and public-safe"
        run: npm run check:docs

      - name: "BLOCKING: Keep security-sensitive routes aligned with OpenAPI"
        run: node scripts/check-openapi-route-contract.mjs

      - name: Generate the in-app changelog from its canonical source
        run: npm --prefix react-frontend run copy-changelog

      - name: "BLOCKING: Keep platform version references unified"
        run: npm run check:version

      - name: "BLOCKING: Require changelog for release-relevant changes"
        shell: bash
        run: |
          BASE_REF=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE_REF="${{ github.event.before }}"
          fi

          if [ -n "$BASE_REF" ]; then
            node scripts/check-changelog-updated.mjs --base "$BASE_REF" --allow-missing-base
          else
            node scripts/check-changelog-updated.mjs --allow-missing-base
          fi

  # ─────────────────────────────────────────────────────────────────
  # Stage 6c: SPDX/AGPL License Compliance Check
  # ─────────────────────────────────────────────────────────────────
  spdx-compliance:
    name: SPDX License Compliance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "BLOCKING: Check SPDX headers on all source files"
        run: node scripts/check-spdx.mjs

  # ─────────────────────────────────────────────────────────────────
  # Stage 7: Regression Pattern Detection
  # ─────────────────────────────────────────────────────────────────
  regression-patterns:
    name: Regression Pattern Detection
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "BLOCKING: Check for incorrect API response unwrapping (data.data ??)"
        run: |
          echo "Checking for 'data.data ??' pattern in React source..."
          echo "(This pattern causes ErrorBoundary crashes — must use 'data' in data ? data.data : data)"
          echo ""

          MATCHES=$(grep -rn "data\.data ??" react-frontend/src/ || true)

          if [ -n "$MATCHES" ]; then
            echo "::error::REGRESSION DETECTED: Found 'data.data ??' pattern (incorrect API response unwrapping)."
            echo ""
            echo "Offending files:"
            echo "$MATCHES"
            echo ""
            echo "Fix: Use \"'data' in data ? data.data : data\" instead of \"data.data ?? data\""
            exit 1
          fi

          echo "PASS: No incorrect 'data.data ??' patterns found."

      - name: "WARNING: Count 'as any' type assertions"
        run: |
          echo "Counting 'as any' type assertions in React source..."
          echo ""

          COUNT=$(grep -rn "as any" react-frontend/src/ | wc -l || echo "0")
          COUNT=$(echo "$COUNT" | tr -d ' ')

          echo "Found ${COUNT} 'as any' assertion(s)."

          if [ "$COUNT" -gt 20 ]; then
            echo "::warning::TypeScript safety: Found ${COUNT} 'as any' assertions (threshold: 20). Consider reducing type assertion usage."
          else
            echo "PASS: 'as any' count (${COUNT}) is within acceptable threshold (<=20)."
          fi

      - name: "WARNING: Check for DELETE without tenant_id scoping"
        run: |
          echo "Checking for DELETE FROM statements without tenant_id in PHP source..."
          echo ""

          # Find DELETE FROM statements, then check if they lack tenant_id
          # We look for DELETE FROM in PHP files, excluding migrations and test files
          UNSCOPED=$(grep -rn "DELETE FROM" app/ \
            --include="*.php" \
            | grep -iv "tenant_id" \
            | grep -iv "migration" \
            | grep -iv "// " \
            | grep -iv "sessions" \
            | grep -iv "password_resets" \
            | grep -iv "cache" \
            | grep -iv "jobs" \
            | grep -iv "failed_jobs" \
            || true)

          if [ -n "$UNSCOPED" ]; then
            echo "::warning::Potential unscoped DELETE statements found (missing tenant_id). Review these carefully:"
            echo ""
            echo "$UNSCOPED"
            echo ""
            echo "If these tables are intentionally not tenant-scoped (e.g., sessions, cache), this warning can be ignored."
          else
            echo "PASS: All DELETE FROM statements appear to include tenant_id scoping."
          fi

      - name: "BLOCKING: Notification recipient-locale guard (Services/Listeners/Jobs)"
        run: node scripts/check-notification-locale.mjs

  # ─────────────────────────────────────────────────────────────────
  # Stage 7: E2E Smoke Tests (Playwright)
  # ─────────────────────────────────────────────────────────────────
  e2e-smoke:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    needs: [changes, react-build]
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_mysql, mbstring, xml, zip, redis, gd, intl, bcmath, opcache, curl, fileinfo, gmp
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-e2e-${{ hashFiles('composer.lock') }}
          restore-keys: composer-e2e-

      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Dependencies
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: |
          VERSION=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test']?.version || require('./package-lock.json').packages['node_modules/playwright']?.version || 'unknown'")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

