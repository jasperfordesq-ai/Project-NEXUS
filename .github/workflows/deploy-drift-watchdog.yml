#
# Deploy Drift Watchdog (Telegram alerting)
# Runs every 10 minutes. Compares the commit on api.project-nexus.ie against
# origin/main. On drift >30 min, sends a Telegram alert AND fails the workflow.

name: Deploy Drift Watchdog

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  VERSION_URL: https://api.project-nexus.ie/version.php
  DRIFT_THRESHOLD_MINUTES: 30

jobs:
  check-drift:
    name: Check prod matches main
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          # 🔴 Must be >1. The "newest deployable commit" step below walks back
          # through history; at depth 1 only HEAD exists, the walk finds nothing
          # and silently falls back to HEAD — reinstating the exact false-alarm
          # behaviour this change removes, with no error to show for it.
          # 250 covers the 200-commit bounded walk with room to spare.
          fetch-depth: 250

      - name: Fetch version.php from production
        id: prod
        run: |
          HTTP_CODE=$(curl -sS -o prod.json -w "%{http_code}" \
            --max-time 20 --retry 3 --retry-delay 5 \
            "${VERSION_URL}" || echo "000")
          echo "HTTP status: ${HTTP_CODE}"

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "status=endpoint_unreachable" >> "$GITHUB_OUTPUT"
            echo "http_code=${HTTP_CODE}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cat prod.json; echo ""
          PROD_COMMIT=$(jq -r '.commit // "unknown"' prod.json)

          if [ "${PROD_COMMIT}" = "unknown" ] || [ -z "${PROD_COMMIT}" ]; then
            echo "status=no_commit_field" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "status=ok" >> "$GITHUB_OUTPUT"
          echo "prod_commit=${PROD_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "prod_commit_short=${PROD_COMMIT:0:8}" >> "$GITHUB_OUTPUT"

      # 🔴 Compares against the newest DEPLOYABLE commit, not simply HEAD.
      #
      # Production only ever ships Laravel and React. Once the platform monorepo
      # lands on main, a commit touching ONLY aspnet-backend/ or web-uk/ — or
      # only documentation — leaves production legitimately behind HEAD with
      # nothing to deploy. Comparing against bare HEAD would then raise
      # "production is behind, run a deploy" every 10 minutes, for ever, about
      # work that production must never receive.
      #
      # That matters more than the noise: this watchdog is the ONLY thing
      # proving production runs what the code says. An alarm that cries wolf
      # gets muted, and muting it removes the proof.
      #
      # So walk back from HEAD to the newest commit that changed something
      # production actually deploys. If prod matches THAT, there is no drift.
      - name: Get latest deployable commit on main
        id: main
        run: |
          # Paths whose changes production actually receives. Deliberately
          # NOT sourced from .github/ci-paths.yml: that file answers "which
          # CHECKS should wake", which is a broader question than "what does
          # production ship" (it includes tests/, phpunit.xml, e2e/ and so on).
          DEPLOY_PATHS="app bootstrap config database httpdocs lang resources routes views accessible-frontend react-frontend web-uk artisan composer.json composer.lock scripts migrations Dockerfile.bluegreen compose.bluegreen.yml compose.webuk.bluegreen.yml"

          MAIN_COMMIT=""
          # Bounded walk: 200 commits is far more than any realistic gap, and it
          # terminates rather than scanning the whole history on a fresh clone.
          for SHA in $(git rev-list --max-count=200 HEAD); do
            if git show --pretty=format: --name-only "$SHA" -- $DEPLOY_PATHS | grep -q .; then
              MAIN_COMMIT="$SHA"
              break
            fi
          done

          # Fall back to HEAD rather than reporting nothing. A watchdog that
          # silently finds no commit is the failure mode this repo keeps hitting.
          if [ -z "$MAIN_COMMIT" ]; then
            echo "::warning::No deployable commit found in the last 200; falling back to HEAD."
            MAIN_COMMIT=$(git rev-parse HEAD)
          fi

          HEAD_COMMIT=$(git rev-parse HEAD)
          if [ "$MAIN_COMMIT" != "$HEAD_COMMIT" ]; then
            SKIPPED=$(git rev-list --count "${MAIN_COMMIT}..${HEAD_COMMIT}")
            echo "HEAD is ${HEAD_COMMIT:0:8}; newest DEPLOYABLE commit is ${MAIN_COMMIT:0:8} (${SKIPPED} non-deployable commit(s) in between - not drift)."
          fi

          MAIN_TS=$(git log -1 --format=%ct "$MAIN_COMMIT")
          MAIN_SUBJECT=$(git log -1 --format=%s "$MAIN_COMMIT")
          echo "main_commit=${MAIN_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "main_commit_short=${MAIN_COMMIT:0:8}" >> "$GITHUB_OUTPUT"
          echo "main_timestamp=${MAIN_TS}" >> "$GITHUB_OUTPUT"
          echo "main_subject=${MAIN_SUBJECT}" >> "$GITHUB_OUTPUT"

      - name: Compare and decide
        id: decide
        run: |
          PROD_STATUS="${{ steps.prod.outputs.status }}"
          PROD="${{ steps.prod.outputs.prod_commit }}"
          PROD_SHORT="${{ steps.prod.outputs.prod_commit_short }}"
          MAIN="${{ steps.main.outputs.main_commit }}"
          MAIN_SHORT="${{ steps.main.outputs.main_commit_short }}"
          MAIN_TS="${{ steps.main.outputs.main_timestamp }}"
          MAIN_SUBJECT="${{ steps.main.outputs.main_subject }}"
          HTTP_CODE="${{ steps.prod.outputs.http_code }}"

          NOW=$(date -u +%s)
          AGE_MIN=$(( (NOW - MAIN_TS) / 60 ))

          if [ "${PROD_STATUS}" = "endpoint_unreachable" ]; then
            echo "alert=true" >> "$GITHUB_OUTPUT"
            echo "message=🚨 PROD UNREACHABLE%0A%0Aversion.php returned HTTP ${HTTP_CODE}. Production may be down." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${PROD_STATUS}" = "no_commit_field" ]; then
            echo "alert=true" >> "$GITHUB_OUTPUT"
            echo "message=⚠️ VERSION.PHP BROKEN%0A%0AEndpoint responded but no commit field." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${PROD}" = "${MAIN}" ]; then
            echo "✅ In sync on ${MAIN_SHORT}"
            echo "alert=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${AGE_MIN}" -lt "${DRIFT_THRESHOLD_MINUTES}" ]; then
            echo "ℹ️  Drift but main only ${AGE_MIN} min old (within grace window)"
            echo "alert=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "alert=true" >> "$GITHUB_OUTPUT"
          echo "message=⚠️ DEPLOY DRIFT%0A%0AProd is ${AGE_MIN} min behind main.%0A%0AProd: ${PROD_SHORT}%0AMain: ${MAIN_SHORT} — ${MAIN_SUBJECT}%0A%0ARun a deploy, or investigate." >> "$GITHUB_OUTPUT"

      - name: Send Telegram alert
        if: steps.decide.outputs.alert == 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}
          MSG:      ${{ steps.decide.outputs.message }}
        run: |
          if [ -z "${TG_TOKEN}" ] || [ -z "${TG_CHAT}" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret is not set"
            exit 1
          fi

          MESSAGE=$(printf '%s' "${MSG}" | sed 's/%0A/\n/g')

          RESPONSE=$(curl -sS --max-time 20 --retry 2 \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${MESSAGE}")

          echo "${RESPONSE}"

          if echo "${RESPONSE}" | jq -e '.ok == true' > /dev/null; then
            echo "✅ Telegram alert sent"
          else
            echo "::error::Telegram API rejected the message"
            exit 1
          fi

      # The Telegram alert above IS the signal. We deliberately do NOT fail the
      # workflow on drift — drift is expected (we don't auto-deploy on push) and
      # leaving every scheduled run red just creates notification noise. If the
      # Telegram alert fails to send, that step itself will already fail.