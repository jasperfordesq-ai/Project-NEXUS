# Availability monitoring for the platform's public endpoints.
#
# WHY THIS EXISTS
# The uptime monitoring for the ASP.NET API and the Web UK frontend lived in
# jasperfordesq-ai/api.project-nexus.net. That repository was archived on
# 2026-08-10. Archiving disables a repository's scheduled workflows, so both
# services silently lost their only automated up/down check on that date, while
# remaining live on their public domains.
#
# ALERTING BEHAVIOUR
# Telegram is the signal, matching deploy-drift-watchdog.yml, because that is
# the channel the owner already receives. Messages are sent ONLY when the state
# CHANGES - first failure, a change in which endpoints are failing, or recovery.
# A monitor that messages every 15 minutes for the length of an outage teaches
# its owner to ignore it.
#
# Slack is an optional second channel (secret SLACK_UPTIME_WEBHOOK, an incoming
# webhook). It sends the same message at the same moments. When the secret is
# absent the Slack step only warns; Telegram's behaviour is unchanged.
#
# This workflow does not fail when an endpoint is down: the alert is the signal,
# and leaving every scheduled run red creates exactly the noise described above.
# It DOES fail if the probe cannot run or the alert cannot be delivered, so a
# broken monitor is never mistaken for a healthy platform.
#
# 🔴 Scheduled workflows only run from the repository's DEFAULT branch. While
# this file lives on codex/platform-monorepo it will not fire on a timer; it can
# still be run by hand from the Actions tab. It starts running automatically
# once this branch merges to main.
name: Uptime Check

on:
  schedule:
    # Every 15 minutes. Detection latency is therefore up to ~15 minutes plus
    # the in-run retries (~10s), and GitHub's scheduler can add delay of its own
    # under load - this is a safety net, not a paging system.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force_alert:
        description: 'Send the alert (Telegram, and Slack if configured) even if the state has not changed (use to test the alert path)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: uptime-check
  cancel-in-progress: false

jobs:
  probe:
    name: Probe public endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # The previous run's state, so we can alert on transitions only. The cache
      # is the state store because this is a PUBLIC repository - using issues
      # would publish an outage timeline to anyone watching.
      - name: Restore previous state
        id: restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .uptime-state
          key: uptime-state-${{ github.run_id }}
          restore-keys: |
            uptime-state-

      - name: Read previous state
        id: previous
        run: |
          if [ -f .uptime-state/state.txt ]; then
            PREV=$(cat .uptime-state/state.txt)
            echo "Previous state: ${PREV}"
          else
            # First ever run, or the cache was evicted. Treat as 'unknown' so a
            # platform that is already down still produces one alert rather than
            # being silently accepted as the baseline.
            PREV="unknown"
            echo "No previous state found - treating as unknown"
          fi
          echo "state_key=${PREV}" >> "$GITHUB_OUTPUT"

      - name: Probe endpoints
        id: probe
        run: node scripts/uptime-check.mjs

      - name: Decide whether to alert
        id: decide
        env:
          PREV: ${{ steps.previous.outputs.state_key }}
          NOW: ${{ steps.probe.outputs.state_key }}
          HEALTHY: ${{ steps.probe.outputs.healthy }}
          FORCED: ${{ inputs.force_alert }}
        run: |
          if [ "${FORCED}" = "true" ]; then
            echo "Forced alert requested via workflow_dispatch"
            echo "alert=true" >> "$GITHUB_OUTPUT"
          elif [ "${PREV}" = "${NOW}" ]; then
            echo "State unchanged (${NOW}) - no message"
            echo "alert=false" >> "$GITHUB_OUTPUT"
          elif [ "${PREV}" = "unknown" ] && [ "${HEALTHY}" = "true" ]; then
            # First run on a healthy platform is not news.
            echo "First run and everything is up - no message"
            echo "alert=false" >> "$GITHUB_OUTPUT"
          else
            echo "State changed: ${PREV} -> ${NOW}"
            echo "alert=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Telegram alert
        if: steps.decide.outputs.alert == 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}
          HEALTHY:  ${{ steps.probe.outputs.healthy }}
          SUMMARY:  ${{ steps.probe.outputs.summary }}
          DETAIL:   ${{ steps.probe.outputs.detail }}
          RUN_URL:  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${TG_TOKEN}" ] || [ -z "${TG_CHAT}" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret is not set"
            exit 1
          fi

          if [ "${HEALTHY}" = "true" ]; then
            HEADING="RECOVERED - everything is responding again"
          else
            HEADING="SITE DOWN"
          fi

          MESSAGE=$(printf '%s\n\n%s\n\n%s\n\n%s' \
            "${HEADING}" "${SUMMARY}" "${DETAIL}" "${RUN_URL}")

          RESPONSE=$(curl -sS --max-time 20 --retry 2 \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${MESSAGE}")

          echo "${RESPONSE}"

          if echo "${RESPONSE}" | jq -e '.ok == true' > /dev/null; then
            echo "Telegram alert sent"
          else
            echo "::error::Telegram API rejected the message"
            exit 1
          fi

      # Slack is a SECOND channel, added 2026-10-02 so an outage reaches the owner
      # even when Telegram is missed. It is optional: with no SLACK_UPTIME_WEBHOOK
      # secret this step warns and succeeds, so a missing Slack setup can never
      # turn the run red on its own. Once the secret IS set, a rejected message
      # fails the run, for the same reason Telegram does - a broken alert path
      # must not look like a healthy platform.
      #
      # `!cancelled()` rather than the default `success()`, so a Telegram failure
      # does not also stop the Slack message: the point of a second channel is
      # that it still works when the first one does not.
      #
      # 🔴 This repository is PUBLIC. The webhook URL is the credential - anyone
      # holding it can post into the channel - so it is never echoed, and nor is
      # Slack's response body. Only the HTTP status code is printed.
      - name: Send Slack alert
        if: ${{ !cancelled() && steps.decide.outputs.alert == 'true' }}
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_UPTIME_WEBHOOK }}
          HEALTHY:  ${{ steps.probe.outputs.healthy }}
          SUMMARY:  ${{ steps.probe.outputs.summary }}
          DETAIL:   ${{ steps.probe.outputs.detail }}
          RUN_URL:  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${SLACK_WEBHOOK}" ]; then
            echo "::warning::SLACK_UPTIME_WEBHOOK secret is not set - Slack alert skipped (Telegram is unaffected)"
            exit 0
          fi

          if [ "${HEALTHY}" = "true" ]; then
            HEADING="RECOVERED - everything is responding again"
          else
            HEADING="SITE DOWN"
          fi

          MESSAGE=$(printf '%s\n\n%s\n\n%s\n\n%s' \
            "${HEADING}" "${SUMMARY}" "${DETAIL}" "${RUN_URL}")

          # jq builds the JSON so quotes and newlines in the probe output cannot
          # break the payload. Slack requires &, < and > escaped in message text.
          PAYLOAD_FILE=$(mktemp)
          BODY_FILE=$(mktemp)
          jq -n --arg text "${MESSAGE}" \
            '{text: ($text | gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;"))}' \
            > "${PAYLOAD_FILE}"

          HTTP_CODE=$(curl -sS --max-time 20 --retry 2 \
            -o "${BODY_FILE}" -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data-binary "@${PAYLOAD_FILE}" \
            "${SLACK_WEBHOOK}") || HTTP_CODE="000"

          # A successful incoming-webhook call answers HTTP 200 with the body "ok".
          if [ "${HTTP_CODE}" = "200" ] && [ "$(cat "${BODY_FILE}")" = "ok" ]; then
            echo "Slack alert sent"
          else
            echo "::error::Slack webhook did not accept the message (HTTP ${HTTP_CODE})"
            exit 1
          fi

      - name: Record current state
        if: always() && steps.probe.outputs.state_key != ''
        run: |
          mkdir -p .uptime-state
          printf '%s' "${{ steps.probe.outputs.state_key }}" > .uptime-state/state.txt
          cat .uptime-state/state.txt

      - name: Save state for the next run
        if: always() && steps.probe.outputs.state_key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .uptime-state
          key: uptime-state-${{ github.run_id }}

      - name: Summary
        if: always()
        run: |
          {
            echo "### Uptime check"
            echo ""
            echo "${{ steps.probe.outputs.summary }}"
            echo ""
            echo '```'
            echo "${{ steps.probe.outputs.detail }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
