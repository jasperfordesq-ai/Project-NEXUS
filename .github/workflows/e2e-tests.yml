name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      project:
        description: 'Test project to run'
        required: false
        default: 'chromium-modern'
        type: choice
        options:
          - chromium-modern
          - firefox-modern
          - mobile-chrome
          - mobile-safari
          - admin
          - unauthenticated
          - all

env:
  E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
  E2E_TENANT: ${{ secrets.E2E_TENANT || 'hour-timebank' }}
  E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
  E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
  E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
  E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

# This workflow only reads repository contents and uploads test artifacts.
# Keep the default GITHUB_TOKEN read-only for every job.
permissions:
  contents: read

# Cancel superseded runs on the same ref so rapid pushes during a fix session
# don't stack full E2E matrices in the runner queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# A green check on this workflow must MEAN something. Previously, when no E2E
# environment was configured, the test jobs exited 0 (GREEN) having run ZERO
# tests — a false sense of safety. That is fixed here:
#
#   * No E2E environment configured  -> jobs are SKIPPED (neutral grey), NOT a
#     passing green check. A skipped job does not assert success. This also keeps
#     `main` green (skipped != failed) and works for fork PRs (no secrets).
#   * E2E environment IS configured  -> the job runs for real. If it executes
#     ZERO tests, or required credentials are missing, it FAILS loudly. We never
#     pass `--pass-with-no-tests`, so Playwright exits non-zero when nothing ran.
#
# The blocking PR environment gate remains the self-contained local Docker smoke
# job (see e2e-smoke). This workflow is the *remote-environment* suite.
#
# NOTE: if you want unauthenticated-only E2E against a remote environment, set
# only `E2E_BASE_URL` and trim the matrices below to `[unauthenticated]`. Leaving
# a credentialed project in the matrix without its credentials is treated as a
# real misconfiguration and fails — by design, so partial setups are visible.
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  # Secrets cannot be referenced in a job-level `if:`, so resolve "is an E2E
  # environment configured?" here and expose it as a job output the test jobs gate on.
  e2e-preflight:
    name: E2E Preflight (environment check)
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        name: Determine whether an E2E target is configured
        run: |
          if [ -n "$E2E_BASE_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "E2E_BASE_URL is configured — remote E2E jobs will run."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=E2E skipped::No E2E_BASE_URL configured. The remote E2E jobs are SKIPPED (reported as skipped/neutral, NOT as a passing green check). The blocking PR gate is the self-contained local Docker smoke job."
            { echo "### ⏭️ Remote E2E skipped"; echo "No \`E2E_BASE_URL\` configured — the remote E2E jobs were **skipped** (not run, not a green pass). A green pass on this workflow only ever means tests actually ran."; } >> "$GITHUB_STEP_SUMMARY"
          fi

  e2e-tests:
    name: E2E Tests
    needs: e2e-preflight
    if: needs.e2e-preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        project: [chromium-modern, unauthenticated, admin]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: |
          PROJECT=${{ matrix.project }}
          if [ "${{ github.event.inputs.project }}" != "" ] && [ "${{ github.event.inputs.project }}" != "all" ]; then
            PROJECT="${{ github.event.inputs.project }}"
          fi
          # We are inside a CONFIGURED run (E2E_BASE_URL is set). Missing credentials
          # for a credentialed project is a real misconfiguration -> FAIL loudly
          # rather than silently exit green having run nothing.
          if [ "$PROJECT" != "unauthenticated" ] && [ "$PROJECT" != "admin" ] && [ -z "$E2E_USER_EMAIL" ]; then
            echo "::error title=E2E misconfigured::E2E_BASE_URL is set but E2E_USER_EMAIL is missing — authenticated project '$PROJECT' cannot run. Configure the credentials or scope the matrix to [unauthenticated]."
            exit 1
          fi
          if [ "$PROJECT" = "admin" ] && [ -z "$E2E_ADMIN_EMAIL" ]; then
            echo "::error title=E2E misconfigured::E2E_BASE_URL is set but E2E_ADMIN_EMAIL is missing — admin project cannot run."
            exit 1
          fi
          # Do NOT add --pass-with-no-tests: Playwright exits non-zero ("no tests
          # found") so a run that matches ZERO tests FAILS instead of green-passing.
          npx playwright test --project=$PROJECT

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            e2e/reports/
            e2e/test-results/
          retention-days: 30
      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-screenshots-${{ matrix.project }}
          path: e2e/screenshots/
          retention-days: 7

  e2e-cross-browser:
    name: Cross-Browser E2E Tests
    needs: e2e-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.e2e-preflight.outputs.configured == 'true'

    strategy:
      fail-fast: false
      matrix:
        # webkit-modern = desktop Safari. Added 2026-08-11; there was previously
        # no desktop-Safari project anywhere, and this whole job is skipped when
        # E2E secrets are absent, so mobile-safari had never run either.
        project: [firefox-modern, mobile-chrome, mobile-safari, webkit-modern]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: |
          # Inside a CONFIGURED run. Cross-browser projects exercise authenticated
          # flows; missing credentials is a real misconfiguration -> FAIL loudly.
          if [ -z "$E2E_USER_EMAIL" ]; then
            echo "::error title=E2E misconfigured::E2E_BASE_URL is set but E2E_USER_EMAIL is missing — cross-browser project ${{ matrix.project }} cannot run."
            exit 1
          fi
          # No --pass-with-no-tests: a zero-test run FAILS instead of green-passing.
          npx playwright test --project=${{ matrix.project }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            e2e/reports/
            e2e/test-results/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Real Safari on real macOS, via a remote browser grid.
  #
  # Playwright's bundled webkit is Safari's ENGINE. It cannot see Safari's own
  # native controls, content blockers, extensions or Lockdown Mode — the things
  # still untested after a Mac user reported the app misbehaving on 2026-08-09
  # and the engine came back clean.
  #
  # 🔴 This job is not SECRET-gated, and reports what it did. When the grid is not
  # configured it says so loudly and passes; it never implies coverage it did not
  # provide. That is deliberate — a secret-gated `if:` is exactly how the existing
  # cross-browser job ended up skipped-but-green and left Safari untested for the
  # life of the project.
  #
  # 🔴 It is NOT unconditional, which an earlier version of this comment claimed.
  # Two things can stop it running, and both were surfaced by audit on 2026-08-11:
  #
  #   1. `if: push && refs/heads/main` — so it does not run on pull requests or on
  #      any other branch. A PR gets no real-Safari signal and no warning that it
  #      has none.
  #   2. `needs: e2e-preflight` — if that job fails, this one is SKIPPED, which
  #      reintroduces the skipped-but-green shape through the dependency edge. The
  #      `needs` buys nothing here: this job consumes no output from preflight.
  #
  # Left as-is deliberately for now (a real Safari run is slow and the grid is not
  # configured, so widening it would add cost without adding signal), but stated
  # honestly so nobody reads "unconditional" and trusts coverage that is not there.
  #
  # Setup: docs/REAL-SAFARI-TESTING.md
  # ---------------------------------------------------------------------------
  real-safari:
    name: Real Safari on macOS
    needs: e2e-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Report whether real-Safari coverage is available
        id: grid
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          PLAYWRIGHT_REMOTE_WS_ENDPOINT: ${{ secrets.PLAYWRIGHT_REMOTE_WS_ENDPOINT }}
        run: |
          if [ -n "$PLAYWRIGHT_REMOTE_WS_ENDPOINT" ] || { [ -n "$BROWSERSTACK_USERNAME" ] && [ -n "$BROWSERSTACK_ACCESS_KEY" ]; }; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Real Safari::Remote grid configured — running real Safari on macOS."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Real Safari NOT covered::No remote browser grid configured, so real Safari on macOS was NOT tested. The bundled webkit project covers Safari's ENGINE only: native controls, content blockers, extensions and Lockdown Mode remain untested. See docs/REAL-SAFARI-TESTING.md."
          fi

      - name: Install Playwright browsers
        if: steps.grid.outputs.configured == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run smoke and dropdown specs on real Safari
        if: steps.grid.outputs.configured == 'true'
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          PLAYWRIGHT_REMOTE_WS_ENDPOINT: ${{ secrets.PLAYWRIGHT_REMOTE_WS_ENDPOINT }}
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          CI: true
        run: |
          if [ -z "$E2E_BASE_URL" ] || [ -z "$E2E_USER_EMAIL" ]; then
            echo "::error title=Real Safari misconfigured::A grid is configured but E2E_BASE_URL / E2E_USER_EMAIL are missing, so there is nothing to point Safari at."
            exit 1
          fi
          npx playwright test --project=real-safari

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always() && steps.grid.outputs.configured == 'true'
        with:
          name: playwright-report-real-safari
          path: |
            e2e/reports/
            e2e/test-results/
          retention-days: 30
