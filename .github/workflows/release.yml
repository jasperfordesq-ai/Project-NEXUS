name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish, for example v1.5.0-rc.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag
        run: |
          set -euo pipefail
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag must look like v1.5.0 or v1.5.0-rc.1"
            exit 1
          fi
          git rev-parse "$TAG_NAME^{commit}" >/dev/null

      - name: Build release notes
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          NOTES="$RUNNER_TEMP/release-notes.md"

          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$NOTES"

          if [ ! -s "$NOTES" ]; then
            {
              echo "Project NEXUS ${TAG_NAME}"
              echo
              echo "No matching CHANGELOG.md section was found for ${VERSION}."
              echo "Review the commit history before publishing this release."
            } > "$NOTES"
          fi

          # 🔴 GitHub rejects a release body over 125,000 characters with
          # "HTTP 422: body is too long", which fails the whole job and publishes
          # nothing. This is not hypothetical: six of the fourteen backfilled
          # releases failed on it on 2026-08-30, and 1.6.2's section alone is
          # ~368,000 characters. Sections here are long because this changelog
          # carries a full paragraph per entry.
          #
          # Truncating and linking to the full section is better than failing:
          # a release with most of its notes plus a pointer is useful, a release
          # that does not exist is not.
          #
          # The cap is on BYTES (`wc -c`) against a CHARACTER limit, which is
          # deliberately conservative — UTF-8 is never fewer bytes than
          # characters, so a body inside the byte cap is always inside the
          # character limit. The headroom also covers the notice appended below.
          MAX_BYTES=118000
          if [ "$(wc -c < "$NOTES")" -gt "$MAX_BYTES" ]; then
            TRUNCATED="$RUNNER_TEMP/release-notes-truncated.md"
            head -c "$MAX_BYTES" "$NOTES" > "$TRUNCATED"
            # Drop the final line: `head -c` cuts mid-line, and possibly
            # mid-multibyte-character, so the last line is never trustworthy.
            sed -i '$ d' "$TRUNCATED"
            {
              echo
              echo '---'
              echo
              echo "These notes were truncated to fit GitHub's 125,000-character limit on a release body."
              echo "The complete entry for ${VERSION} is in [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)."
            } >> "$TRUNCATED"
            mv "$TRUNCATED" "$NOTES"
            echo "::notice::Release notes for ${TAG_NAME} were truncated to fit GitHub's release-body limit."
          fi

          echo "notes_file=$NOTES" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "::notice::Release $TAG_NAME already exists; leaving it unchanged."
            exit 0
          fi

          args=(
            release create "$TAG_NAME"
            "--title=Project NEXUS ${TAG_NAME}"
            "--notes-file=${notes_file}"
            --verify-tag
          )

          if [[ "$TAG_NAME" == *-* ]]; then
            args+=(--prerelease)
          fi

          gh "${args[@]}"
