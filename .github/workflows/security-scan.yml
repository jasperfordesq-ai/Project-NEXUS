name: Security Scan

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:
  push:
    branches: [main]
  # PR trigger removed 2026-05-10 — heavy scans (OWASP, Semgrep, npm audit on
  # transitive deps) constantly tripped on pre-existing issues unrelated to
  # the PR, blocking nothing (no required checks) but creating noise. PR-time
  # dependency risk is now covered by `dependency-review.yml`, which only
  # runs when package files change. Full security scan still runs nightly
  # and on every merge to main, so coverage is unchanged.

permissions:
  contents: read
  security-events: write

# Cancel a superseded scan on the same ref (e.g. a new push to main lands while
# the previous push's scan is still running). The nightly scheduled scan and
# each push scan share the main ref, so a push supersedes an in-flight scan —
# which is fine, the push runs its own full scan.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist

      # Composer Audit is the only gate deliberately left unguarded: nothing
      # independent runs before it, so there is nothing that could mask it. (If
      # composer install fails, it skips — auditing an absent vendor tree would
      # report noise, and the job still goes red.) Everything after it carries
      # the guard described below.
      - name: Composer Audit
        run: composer audit --locked --no-interaction

      # ── 🔴 INVARIANT: every independent gate in this job carries !cancelled() ──
      #
      # Actions skips the rest of a job's steps once one fails. These gates are
      # INDEPENDENT of each other — a secret in the tree has nothing to do with
      # an npm advisory — so without a guard the FIRST red gate hides every
      # later one, and each fix reveals the next in a queue nobody knew existed.
      #
      # That is not hypothetical. In run 31258870996 a single Trivy finding
      # skipped four blocking gates: TruffleHog, the PHP security checker, the
      # npm-audit gate and OWASP Dependency Check. The npm-audit gate had been
      # failing on its own advisories the whole time, invisibly, and only
      # surfaced on 2026-08-08 once the Trivy finding was fixed. A committed,
      # verified secret would have been missed the same way.
      #
      # !cancelled() rather than always(): this workflow sets
      # cancel-in-progress, so pushes routinely supersede an in-flight scan, and
      # always() would keep grinding through OWASP Dependency Check and npm ci
      # on a run whose result is already discarded. !cancelled() runs on success
      # AND failure but still stops on cancellation.
      #
      # This does NOT weaken any gate. A step-level `if` decides whether the
      # step RUNS; a step that runs and exits non-zero still fails the job.
      # `continue-on-error` is the setting that would mask failures, and it is
      # deliberately NOT used anywhere in this workflow.
      #
      # 🔴 A new blocking gate added to this job MUST carry the same guard.

      # ── Trivy filesystem scan ─────────────────────────────────────
      # The TABLE step is the blocking gate (exit-code 1) because Trivy
      # correctly handles .trivyignore suppressions in table format.
      # The SARIF step is non-blocking (exit-code 0) and uploads results
      # to the GitHub Security tab for visibility.
      #
      # 🔴 Every third-party action in this workflow is PINNED BY COMMIT SHA
      # with its version named alongside — see the TruffleHog note below for
      # the incident that motivated it. A tag is not sufficient: tags can be
      # moved by the publisher. All four trivy-action steps must stay on the
      # SAME pin; bump them together or the blocking table gate and the
      # non-blocking SARIF upload can disagree about what they scanned.
      - name: Run Trivy Vulnerability Scanner (Table)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          trivyignores: '.trivyignore'
          exit-code: '1'

      - name: Run Trivy Vulnerability Scanner (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        # always(): the blocking table step above exits 1 on findings, which
        # would skip this step and leave the upload below erroring on a
        # missing file — exactly when the Security tab needs the results most.
        if: always()
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy-results.sarif'
          trivyignores: '.trivyignore'
          exit-code: '0'

      - name: Upload Trivy Scan Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        if: always()

      # ── Semgrep SAST scan ─────────────────────────────────────────
      # Scans PHP source for injection, secrets, and security issues.
      # Uses .semgrepignore to exclude legacy/dead code paths.
      # Findings are uploaded to GitHub Security tab via SARIF.
      - name: Install Semgrep
        if: always()
        run: pip install semgrep

      - name: SAST Scan with Semgrep
        if: always()
        run: |
          semgrep ci \
            --config p/php \
            --config p/security-audit \
            --config p/secrets \
            --sarif --output semgrep-results.sarif \
            || true
          # Semgrep may fail to produce the SARIF file (auth error, network issue,
          # install problem). Create a valid empty SARIF so the upload step
          # never crashes regardless of why Semgrep didn't write the file.
          if [ ! -f semgrep-results.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","runs":[]}' > semgrep-results.sarif
          fi
        env:
          SEMGREP_RULES: p/php p/security-audit p/secrets

      - name: Upload Semgrep Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'semgrep-results.sarif'
        if: always()

      # ── TruffleHog secret detection ──────────────────────────────
      # Blocks if verified secrets are found in the repository.
      #
      # 🔴 PINNED to a commit SHA, deliberately. This was `@main` until
      # 2026-08-09, which meant every run pulled whatever TruffleHog shipped
      # last. On 2026-08-09 an upstream detector build reported 522 bogus
      # "verified secrets" (all the Lob detector) and failed the 03:45 nightly
      # on dc57cd367 — a commit whose own push run had passed hours earlier on
      # identical code. It self-cleared by 07:20. A secret scanner that can go
      # red overnight without a code change trains people to ignore it, which
      # is the one thing this gate must never do.
      #
      # A tag is not enough: tags can be moved by the publisher, so pin the
      # SHA and name the version beside it. To upgrade, bump BOTH together
      # after checking the release notes.
      #
      # 🔴 The Lob detector is excluded (2026-08-10), and pinning did NOT fix
      # this — that is the whole point of the note below.
      #
      # The same 522 bogus "verified Lob" findings returned on the 2026-08-10
      # 04:00 nightly and failed it. The pinned build is v3.96.0 from 2026-07-24,
      # i.e. from BEFORE the problem first appeared, so this is not a scanner
      # regression a version pin can hold back. "Verified" means TruffleHog
      # called Lob's own API and got a success response; when that endpoint
      # accepts anything, every candidate string verifies. The fault is
      # server-side at Lob, so it will keep recurring until they fix it.
      #
      # Why excluding this ONE detector is safe here, and not a suppression of
      # a real risk:
      #   - Project NEXUS does not integrate Lob (a direct-mail API) anywhere.
      #     Searched every PHP/TS/JS/JSON/env file for a Lob key, endpoint or
      #     live_/test_ token: nothing.
      #   - All 522 findings came from this one detector. Zero from any other,
      #     so nothing else is being silenced.
      #   - A gate that goes red overnight with no code change is the one thing
      #     this scanner must never do (see the note above) — leaving it red
      #     teaches everyone to ignore the security gate.
      #
      # `--exclude-detectors` validates its argument: an unrecognised name
      # fails with "unrecognized detector type", so a typo here cannot silently
      # disable nothing (verified against v3.96.0).
      #
      # 🔴 REMOVE this exclusion if the platform ever integrates Lob.
      - name: Check for Hardcoded Secrets
        if: ${{ !cancelled() }}
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          path: ./
          extra_args: --only-verified --exclude-detectors=lob

      # ── PHP dependency vulnerability check ───────────────────────
      # Blocks if any known vulnerabilities exist in composer.lock.
      - name: PHP Security Checker
        if: ${{ !cancelled() }}
        run: |
          composer require --dev enlightn/security-checker
          vendor/bin/security-checker security:check composer.lock

      # ── OWASP Dependency Check ───────────────────────────────────
      # Blocks on CRITICAL and HIGH findings (CVSS >= 7).
      # Medium and low findings are reported but do not fail the build.
      # Install the dependency trees that Dependency-Check analyzes. Mobile is
      # deliberately lockfile-only here: its node_modules contains vendored
      # CocoaPods/Gem templates and native binaries that broad CPE matching
      # misidentifies as runtime dependencies. The blocking npm audit below and
      # Trivy's clean-checkout scan still cover mobile/package-lock.json.
      # npm advisory lookups are owned by the explicit, blocking npm audit step
      # rather than Dependency-Check's redundant network-dependent Node Audit
      # Analyzer.
      # OSS Index requires credentials not available in CI — disabled.
      - name: Install Node Dependencies (for dependency analysis)
        if: ${{ !cancelled() }}
        run: |
          npm ci --ignore-scripts
          npm --prefix react-frontend ci --ignore-scripts
          npm --prefix e2e ci --ignore-scripts

      # The BLOCKING gate audits the production dependency tree only
      # (--omit=dev). Build/test/CI tooling — Vite's dev server, Lighthouse,
      # @lhci/cli, heroui-cli — never ships in the deployed bundle, so its
      # advisories are not a production attack surface and must not gate
      # releases. Dev-dependency advisories are documented in docs/SECURITY-SCANNING.md
      # and remain visible in the non-blocking OWASP/Trivy SARIF uploads.
      # Gate script wraps `npm audit --omit=dev` and blocks on HIGH/CRITICAL
      # advisories unless they carry a dated, scoped exception in
      # .npm-audit-exceptions.json — the npm-audit counterpart of .trivyignore,
      # for advisories with no in-range fix (e.g. a fix that only exists behind
      # a breaking major of an on-hold app). Review exceptions quarterly.
      - name: NPM Audit (production deps — blocking)
        if: ${{ !cancelled() }}
        run: |
          node scripts/npm-audit-gate.mjs
          node scripts/npm-audit-gate.mjs --prefix react-frontend
          node scripts/npm-audit-gate.mjs --prefix e2e
          node scripts/npm-audit-gate.mjs --prefix mobile --package-lock-only
          # web-uk arrived with the 2026-08-09 monorepo move and had no
          # dependency gate here until 2026-08-10 — its upstream repository ran
          # its own. --package-lock-only (as with mobile) so this job does not
          # have to install the tree just to audit it.
          node scripts/npm-audit-gate.mjs --prefix web-uk --package-lock-only

      # 🔴 Pinned to the CURRENT main commit, deliberately NOT to a release
      # tag. This action's newest release is 1.1.0 from 2021, and main is 14
      # commits and five years ahead of it — every green run this repo has ever
      # had was against main, so pinning to 1.1.0 would be a large behaviour
      # change dressed up as a safety improvement. This pin freezes exactly the
      # code that is already passing. Revisit if upstream ever tags again.
      - name: OWASP Dependency Check
        if: ${{ !cancelled() }}
        uses: dependency-check/Dependency-Check_Action@1e54355a8b4c8abaa8cc7d0b70aa655a3bb15a6c # main @ 2026-08-09
        with:
          project: 'nexus'
          path: '.'
          format: 'HTML'
          args: >-
            --enableRetired
            --enableExperimental
            --failOnCVSS 7
            --suppression owasp-suppressions.xml
            --disableOssIndex
            --disableNodeAudit

      - name: Upload Dependency Check Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/
        if: always()

  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t nexus-app:scan -f Dockerfile .

      # ── Trivy container scan ─────────────────────────────────────
      # Scans the built Docker image for OS and library vulnerabilities.
      # --ignore-unfixed skips CVEs with no available patch (mostly
      # linux-libc-dev kernel CVEs not exploitable in containers).
      # .trivyignore suppresses known kernel CVEs irrelevant in containers.
      #
      # The TABLE step is the blocking gate (exit-code 1) because Trivy
      # correctly handles .trivyignore suppressions in table format.
      # The SARIF step is non-blocking (exit-code 0) and uploads results
      # to the GitHub Security tab for visibility.
      - name: Run Trivy Container Scan (Table)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'nexus-app:scan'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
          exit-code: '1'

      - name: Run Trivy Container Scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        # always() + the image-exists guard pattern: the blocking table step
        # exits 1 on findings; without this the SARIF never generates and the
        # upload step errors on a missing file.
        if: always()
        with:
          image-ref: 'nexus-app:scan'
          format: 'sarif'
          output: 'container-trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
          exit-code: '0'

      - name: Upload Container Scan Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'container-trivy-results.sarif'
        if: always()
