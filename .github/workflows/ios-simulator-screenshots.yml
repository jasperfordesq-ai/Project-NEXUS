#
# Draft App Store screenshots from Apple's real iOS Simulator on a standard
# GitHub-hosted macOS runner. This is deliberately manual: it uses the live
# Partner Demo tenant and repository secrets, and each run should be reviewed.
#
# Expo documents `npx expo run:ios --configuration Release` as the local way to
# exercise production-mode code without creating an App Store-signed archive:
# https://docs.expo.dev/more/expo-cli/#compiling-ios
#
# These artifacts are strong preflight evidence, not TestFlight/device evidence.

name: iOS Simulator Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-simulator-screenshots
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  MAESTRO_VERSION: "2.9.0"
  IOS_DEVICE_NAME: "NEXUS iPhone 16 Pro Max"
  IOS_DEVICE_TYPE: "com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro-Max"
  EXPO_PUBLIC_API_URL: "https://api.project-nexus.ie"
  # This unsigned screenshot-only binary deliberately falls back to the
  # fictional Partner Demo tenant. The real release configuration remains
  # unchanged; this prevents a failed SecureStore read from sending protected
  # demo credentials to another community during automation.
  EXPO_PUBLIC_DEFAULT_TENANT: "partner-demo"
  SENTRY_DISABLE_AUTO_UPLOAD: "true"
  EXPO_NO_TELEMETRY: "1"
  MAESTRO_CLI_NO_ANALYTICS: "1"
  MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: "true"

jobs:
  capture:
    name: Capture on iPhone 16 Pro Max Simulator
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Fingerprint the iOS app source independently of the screenshot tour
        id: app-source
        shell: bash
        run: |
          source_hash=$(
            git ls-files -s mobile \
              | grep -Ev '^100[0-9]{3} [0-9a-f]+ [0-9]+[[:space:]]+mobile/(\.maestro|docs|store-listing)/' \
              | shasum -a 256 \
              | cut -d ' ' -f 1
          )
          echo "hash=$source_hash" >> "$GITHUB_OUTPUT"

      - name: Restore the unsigned iOS Simulator app cache
        id: simulator-app-cache
        uses: actions/cache/restore@v4
        with:
          path: mobile/.ios-simulator-cache/TimebankGlobal.app
          key: ios-simulator-app-partner-demo-${{ runner.os }}-${{ runner.arch }}-${{ steps.app-source.outputs.hash }}

      - name: Confirm the protected demo credentials are configured
        env:
          TEST_EMAIL: ${{ secrets.IOS_SCREENSHOT_TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.IOS_SCREENSHOT_TEST_PASSWORD }}
        run: |
          if [[ -z "$TEST_EMAIL" || -z "$TEST_PASSWORD" ]]; then
            echo "::error::Set IOS_SCREENSHOT_TEST_EMAIL and IOS_SCREENSHOT_TEST_PASSWORD as repository secrets."
            exit 1
          fi

      - name: Verify the protected demo login before starting the Mac build
        env:
          TEST_EMAIL: ${{ secrets.IOS_SCREENSHOT_TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.IOS_SCREENSHOT_TEST_PASSWORD }}
        run: |
          node <<'NODE'
          const headers = {
            Accept: 'application/json',
            'Content-Type': 'application/json',
            'X-Nexus-Mobile': '1',
            'X-Tenant-Slug': 'partner-demo',
          };
          const response = await fetch(
            'https://api.project-nexus.ie/api/auth/login',
            {
              method: 'POST',
              headers,
              body: JSON.stringify({
                email: process.env.TEST_EMAIL,
                password: process.env.TEST_PASSWORD,
                platform: 'mobile',
              }),
            },
          );
          if (!response.ok) {
            throw new Error(`Protected demo login failed with HTTP ${response.status}`);
          }
          const result = await response.json();
          const token = result.access_token;
          try {
            if (result.user?.tenant_id !== 5 || result.user?.role !== 'admin') {
              throw new Error('Protected demo login returned the wrong tenant or role');
            }
            const profileResponse = await fetch(
              'https://api.project-nexus.ie/api/v2/users/me',
              { headers: { ...headers, Authorization: `Bearer ${token}` } },
            );
            if (!profileResponse.ok) {
              throw new Error(`Protected demo token validation failed with HTTP ${profileResponse.status}`);
            }
            const profile = await profileResponse.json();
            if (profile.data?.tenant_id !== 5) {
              throw new Error('Protected demo token resolved to the wrong tenant');
            }
            console.log('Protected Partner Demo admin login and bearer token verified.');
          } finally {
            if (token) {
              await fetch('https://api.project-nexus.ie/api/auth/logout', {
                method: 'POST',
                headers: { ...headers, Authorization: `Bearer ${token}` },
              });
            }
          }
          NODE

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Install the pinned Maestro CLI
        run: |
          export MAESTRO_VERSION="${{ env.MAESTRO_VERSION }}"
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Create and boot the 6.9-inch iPhone Simulator
        id: simulator
        run: |
          if ! xcrun simctl list devicetypes | grep -q "${IOS_DEVICE_TYPE}"; then
            echo "::error::The macOS runner does not contain the required iPhone 16 Pro Max simulator device type."
            xcrun simctl list devicetypes
            exit 1
          fi

          runtime_id=$(python3 - <<'PY'
          import json
          import subprocess

          payload = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "runtimes", "--json"],
              text=True,
          ))
          runtimes = [
              runtime for runtime in payload["runtimes"]
              if runtime.get("isAvailable")
              and runtime.get("identifier", "").startswith(
                  "com.apple.CoreSimulator.SimRuntime.iOS-"
              )
          ]
          if not runtimes:
              raise SystemExit("No available iOS Simulator runtime is installed")
          runtimes.sort(
              key=lambda runtime: tuple(int(part) for part in runtime["version"].split(".")),
              reverse=True,
          )
          print(runtimes[0]["identifier"])
          PY
          )

          simulator_udid=$(xcrun simctl create "$IOS_DEVICE_NAME" "$IOS_DEVICE_TYPE" "$runtime_id")
          xcrun simctl boot "$simulator_udid"
          xcrun simctl bootstatus "$simulator_udid" -b

          echo "udid=$simulator_udid" >> "$GITHUB_OUTPUT"
          echo "runtime=$runtime_id" >> "$GITHUB_OUTPUT"
          echo "SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"
          echo "IOS_SIMULATOR_MODEL=iPhone 16 Pro Max" >> "$GITHUB_ENV"
          echo "IOS_SIMULATOR_RUNTIME=$runtime_id" >> "$GITHUB_ENV"

      - name: Generate the native iOS project and install CocoaPods
        if: steps.simulator-app-cache.outputs.cache-hit != 'true'
        working-directory: mobile
        run: |
          mkdir -p "$HOME/.expo"
          npx expo prebuild --platform ios --no-install
          cd ios
          pod install

      - name: Compile the unsigned iOS Release build
        if: steps.simulator-app-cache.outputs.cache-hit != 'true'
        working-directory: mobile
        run: |
          # Build specifically for the Simulator SDK. Expo CLI's device resolver
          # can route a supplied UDID through its physical-device signing check;
          # xcodebuild plus simctl keeps this pre-enrollment build unsigned.
          xcodebuild \
            -workspace ios/TimebankGlobal.xcworkspace \
            -scheme TimebankGlobal \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES \
            build

          app_path='ios/build/Build/Products/Release-iphonesimulator/TimebankGlobal.app'
          test -d "$app_path"
          mkdir -p .ios-simulator-cache
          ditto "$app_path" .ios-simulator-cache/TimebankGlobal.app

      - name: Save the unsigned iOS Simulator app cache
        if: steps.simulator-app-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: mobile/.ios-simulator-cache/TimebankGlobal.app
          key: ios-simulator-app-partner-demo-${{ runner.os }}-${{ runner.arch }}-${{ steps.app-source.outputs.hash }}

      - name: Install and launch the unsigned iOS Release build
        working-directory: mobile
        run: |
          app_path='.ios-simulator-cache/TimebankGlobal.app'
          test -d "$app_path"
          xcrun simctl install "$SIMULATOR_UDID" "$app_path"
          xcrun simctl launch "$SIMULATOR_UDID" ie.project.nexus

      - name: Verify the installed application identity
        run: |
          app_path=$(xcrun simctl get_app_container "$SIMULATOR_UDID" ie.project.nexus app)
          test -d "$app_path"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Info.plist")
          test "$bundle_id" = 'ie.project.nexus'
          echo "Installed $bundle_id from commit $GITHUB_SHA"

      - name: Prepare a clean, reproducible capture state
        run: |
          xcrun simctl ui "$SIMULATOR_UDID" appearance light
          xcrun simctl status_bar "$SIMULATOR_UDID" override \
            --time '9:41' \
            --batteryState charged \
            --batteryLevel 100 \
            --wifiBars 3 \
            --cellularBars 4 || echo "::warning::status-bar override was unavailable"

      - name: Run the eight-screen App Store tour
        env:
          TEST_EMAIL: ${{ secrets.IOS_SCREENSHOT_TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.IOS_SCREENSHOT_TEST_PASSWORD }}
        working-directory: mobile
        run: |
          mkdir -p "$RUNNER_TEMP/maestro-output"
          password_hex=$(printf '%s' "$TEST_PASSWORD" | od -An -tx1 | tr -d ' \n')
          maestro --device "$SIMULATOR_UDID" test \
            --env TEST_EMAIL="$TEST_EMAIL" \
            --env TEST_PASSWORD_HEX="$password_hex" \
            --test-output-dir="$RUNNER_TEMP/maestro-output" \
            .maestro/screens/apple-store-screens.yaml

      - name: Prepare opaque App Store PNGs and evidence manifest
        working-directory: mobile
        run: |
          node scripts/prepare-apple-simulator-screenshots.cjs \
            --source "$RUNNER_TEMP/maestro-output" \
            --destination "$RUNNER_TEMP/apple-screenshots"

      - name: Add the capture summary
        run: |
          {
            echo '## iOS Simulator screenshot preflight'
            echo
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- Device: $IOS_SIMULATOR_MODEL"
            echo "- Runtime: \`$IOS_SIMULATOR_RUNTIME\`"
            echo '- Result: eight opaque, native-resolution PNGs prepared'
            echo '- Evidence boundary: unsigned Simulator build; not TestFlight or physical-device proof'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture the final Simulator screen on failure
        if: failure() && steps.simulator.outputs.udid != ''
        run: |
          mkdir -p "$RUNNER_TEMP/failure-evidence"
          xcrun simctl io "${{ steps.simulator.outputs.udid }}" screenshot \
            "$RUNNER_TEMP/failure-evidence/final-screen.png" || true
          xcrun simctl spawn "${{ steps.simulator.outputs.udid }}" log show \
            --last 10m --style compact \
            --predicate 'process == "TimebankGlobal" OR process == "Timebank Global" OR process == "nexus-mobile"' \
            > "$RUNNER_TEMP/failure-evidence/simulator.log" || true

      - name: Redact credentials from diagnostic text
        if: failure()
        env:
          TEST_EMAIL: ${{ secrets.IOS_SCREENSHOT_TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.IOS_SCREENSHOT_TEST_PASSWORD }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const roots = [
            path.join(process.env.RUNNER_TEMP, 'maestro-output'),
            path.join(process.env.RUNNER_TEMP, 'failure-evidence'),
          ];
          const replacements = [
            [process.env.TEST_EMAIL, '[REDACTED_EMAIL]'],
            [process.env.TEST_PASSWORD, '[REDACTED_PASSWORD]'],
            [Buffer.from(process.env.TEST_PASSWORD ?? '', 'utf8').toString('hex'), '[REDACTED_PASSWORD_HEX]'],
          ].filter(([value]) => value);
          const textExtensions = new Set(['.json', '.log', '.txt', '.yaml', '.yml']);

          function redactTree(root) {
            if (!fs.existsSync(root)) return;
            for (const entry of fs.readdirSync(root, { withFileTypes: true })) {
              const target = path.join(root, entry.name);
              if (entry.isDirectory()) {
                redactTree(target);
              } else if (textExtensions.has(path.extname(entry.name).toLowerCase())) {
                let contents = fs.readFileSync(target, 'utf8');
                for (const [value, replacement] of replacements) {
                  contents = contents.split(value).join(replacement);
                }
                fs.writeFileSync(target, contents, 'utf8');
              }
            }
          }

          for (const root of roots) redactTree(root);
          NODE

      - name: Upload prepared screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app-store-screenshots-${{ github.run_number }}
          path: ${{ runner.temp }}/apple-screenshots/
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-screenshot-diagnostics-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/maestro-output/
            ${{ runner.temp }}/failure-evidence/
          if-no-files-found: warn
          retention-days: 14
