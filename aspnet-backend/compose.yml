# =============================================================================
# Docker Compose - Nexus Backend (Isolated Stack)
# =============================================================================
# This is the SOURCE OF TRUTH for running the backend locally.
#
# ISOLATION: This stack uses its own network and volumes, completely
# independent from any other Docker projects on this machine.
#
# Quick start:
#   export JWT_SECRET="YourSecure32CharacterSecretHere!"  # or set in .env
#   docker compose up -d
#   docker compose logs -f api
#
# IMPORTANT: JWT_SECRET must be set via environment variable or .env file
# =============================================================================

name: nexus-aspnet-dev

services:
  # ---------------------------------------------------------------------------
  # API Service (ASP.NET Core 8)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-aspnet-dev-api
    ports:
      - "5080:8080"  # Host:Container - Access at http://localhost:5080
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=nexus_dev;Username=postgres;Password=postgres
      # JWT_SECRET MUST be provided via environment variable or .env file
      # DO NOT hardcode secrets here - the app will fail to start without this
      - Jwt__Secret=${JWT_SECRET:?JWT_SECRET environment variable is required}
      - Jwt__Issuer=
      - Jwt__Audience=
      # 🔴 5173 is the canonical React dev server's ACTUAL port
      # (react-frontend/vite.config.ts:323) and was MISSING here until 2026-08-19, so
      # the committed `npm run dev:dotnet` could never talk to this backend directly —
      # a preflight from http://localhost:5173 came back 204 with NO
      # Access-Control-Allow-Origin, which a browser treats as a refusal. 5273 is not a
      # typo: docs/PRODUCTION_READINESS_REMEDIATION.md:84-87 documents running Vite on
      # 5273 as a WORKAROUND for this very gap. Both are kept — the workaround still
      # works, and now the default does too. 5199 is the port
      # scripts/smoke-react-against-aspnet.mjs uses, chosen so it never takes 5173 from
      # the owner's own dev server. Both localhost and 127.0.0.1 are listed because CORS
      # origins are exact string matches, not host lookups.
      - Cors__AllowedOrigins__0=http://localhost:5080
      - Cors__AllowedOrigins__1=http://localhost:5273
      - Cors__AllowedOrigins__2=http://localhost:5180
      - Cors__AllowedOrigins__3=http://localhost:5190
      - Cors__AllowedOrigins__4=http://localhost:5173
      - Cors__AllowedOrigins__5=http://127.0.0.1:5173
      - Cors__AllowedOrigins__6=http://localhost:5199
      - Cors__AllowedOrigins__7=http://127.0.0.1:5199
      # Rate limiting (relaxed for development)
      - RateLimiting__Auth__PermitLimit=10
      - RateLimiting__Auth__WindowSeconds=60
      # 🔴 Raised from 200 on 2026-08-19. A single pass of
      # scripts/smoke-react-against-aspnet.mjs makes ~190 API calls, and the extended
      # pass (member actions + token refresh) exceeds 200 — so the smoke throttled
      # ITSELF and filled its own report with 429s that look exactly like backend
      # faults. Two "findings" (a missing form field, an empty events list) turned out
      # to be nothing but rate limiting. This is a DEVELOPMENT value only; production
      # rate limits live in appsettings.Production.json and are untouched.
      - RateLimiting__General__PermitLimit=2000
      - RateLimiting__General__WindowSeconds=60
      # RabbitMQ configuration
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Port=5672
      - RabbitMq__Username=${RABBITMQ_USER:-guest}
      - RabbitMq__Password=${RABBITMQ_PASS:-guest}
      - RabbitMq__VirtualHost=/
      - RabbitMq__ExchangeName=nexus.events
      - RabbitMq__Enabled=true
      # WebAuthn/Passkey (FIDO2) configuration
      - Fido2__ServerDomain=localhost
      - Fido2__ServerName=Project NEXUS
      # Same omission as the CORS list above: passkey registration from the React dev
      # server on 5173 would have been rejected as an unknown origin.
      - Fido2__Origins__0=http://localhost:5080
      - Fido2__Origins__1=http://localhost:5273
      - Fido2__Origins__2=http://localhost:5180
      - Fido2__Origins__3=http://localhost:5173
      - Fido2__Origins__4=http://127.0.0.1:5173
      - FileUpload__UploadsRoot=/app/uploads
      # Sentry — DSN read from .env (Sentry__Dsn). Empty = disabled.
      - Sentry__Dsn=${Sentry__Dsn:-}
      - Sentry__Environment=${Sentry__Environment:-development}
      - Sentry__TracesSampleRate=${Sentry__TracesSampleRate:-0.1}
    volumes:
      - nexus-aspnet-dev-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - nexus-aspnet-dev-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ---------------------------------------------------------------------------
  # Database (PostgreSQL 16)
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16.4-bookworm
    container_name: nexus-aspnet-dev-db
    # DB is internal-only by default (no host port exposed)
    # Uncomment the next two lines if you need direct DB access from host:
    # ports:
    #   - "5435:5432"
    environment:
      POSTGRES_DB: nexus_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - nexus-aspnet-dev-db-data:/var/lib/postgresql/data
    networks:
      - nexus-aspnet-dev-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexus_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Message Broker (RabbitMQ)
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: nexus-aspnet-dev-rabbitmq
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management UI (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - nexus-aspnet-dev-rabbitmq-data:/var/lib/rabbitmq
    networks:
      - nexus-aspnet-dev-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ---------------------------------------------------------------------------
  # UK Frontend - GOV.UK Design System (Express/Node)
  #
  # Lives at ../web-uk: it is a SIBLING of aspnet-backend/ in the platform
  # monorepo, not a child. These four paths said ./apps/web-uk until
  # 2026-08-10, which was the pre-move layout — `docker compose up` could not
  # build this service at all from a monorepo checkout.
  #
  # web-uk/compose.yml runs the same service standalone; prefer that unless you
  # specifically need it on the ASP.NET network.
  # ---------------------------------------------------------------------------
  web-uk:
    build:
      context: ../web-uk
      dockerfile: Dockerfile
      target: development
    container_name: nexus-webuk-dev
    ports:
      - "5180:3001"
    volumes:
      - ../web-uk:/app
      - /app/node_modules
    env_file:
      - ../web-uk/.env.docker
    networks:
      - nexus-aspnet-dev-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

# -----------------------------------------------------------------------------
# Networks (isolated from other Docker projects)
# -----------------------------------------------------------------------------
networks:
  nexus-aspnet-dev-net:
    name: nexus-aspnet-dev-net
    driver: bridge

# -----------------------------------------------------------------------------
# Volumes (persistent, isolated)
# -----------------------------------------------------------------------------
volumes:
  nexus-aspnet-dev-db-data:
    name: nexus-aspnet-dev-db-data
  nexus-aspnet-dev-rabbitmq-data:
    name: nexus-aspnet-dev-rabbitmq-data
  nexus-aspnet-dev-uploads:
    name: nexus-aspnet-dev-uploads
