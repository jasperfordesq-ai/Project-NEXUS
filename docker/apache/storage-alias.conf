#
# Public storage (/storage) for the production images, installed by both
# Dockerfile.prod and Dockerfile.bluegreen.
#
# This Alias points OUTSIDE the web root, so nothing in httpdocs/.htaccess
# applies here — not its script-extension guard and not its /uploads sandbox
# CSP. Every protection the uploads tree gets must therefore be stated here
# (F-554, E-088: before this file a .php stored on the public disk ran, and
# every other file was served with no nosniff and no CSP). The local dev
# container serves /storage through a symlink inside the web root instead,
# so a dev measurement does not tell you what production does.

Alias /storage /var/www/html/storage/app/public

<Directory /var/www/html/storage/app/public>
    Options -Indexes -ExecCGI -Includes +FollowSymLinks
    AllowOverride None
    Require all granted

    # Uploaded files are data, never code: refuse anything a handler could run,
    # and switch the PHP engine off in case a handler is ever mapped anyway.
    <FilesMatch "\.(?i:php[0-9]?|phtml|pht|phar|phps|shtml|cgi|pl|py)$">
        Require all denied
    </FilesMatch>
    <IfModule php_module>
        php_admin_flag engine off
    </IfModule>

    # Same policy as /uploads in httpdocs/.htaccess (pinned equal by
    # tests/Laravel/Feature/Security/E088/F554PublicStorageAliasHardeningTest).
    # Deliberately not wrapped in <IfModule>: if mod_headers were ever missing,
    # Apache must refuse to start rather than serve these files unprotected.
    Header always set X-Content-Type-Options "nosniff"
    Header always set Content-Security-Policy "default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; sandbox"
</Directory>
