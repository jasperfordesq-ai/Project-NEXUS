- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 6000

- runFlow:
    when:
      visible: "Switch community"
    commands:
      - tapOn: "Switch community"
      - waitForAnimationToEnd:
          timeout: 8000
      - takeScreenshot: sweep-32-switch-community
