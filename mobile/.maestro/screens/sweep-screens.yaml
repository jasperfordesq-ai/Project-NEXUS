      - takeScreenshot: sweep-25-settings-scrolled

- runFlow:
    optional: true
    commands:
      - launchApp:
          clearState: false
      - extendedWaitUntil:
          visible: "Community Feed"
          timeout: 30000
      - tapOn: "More"
      - waitForAnimationToEnd:
          timeout: 6000
      # 🔴 "MY SPACE" is a COLLAPSED accordion, and Notifications lives inside it. Without
      # this tap, `scrollUntilVisible` scrolls to the bottom of the More menu, never finds
      # the label, and the step fails — which is exactly what happened on 2026-08-20: the
      # sweep reported 31 of 33 screens and Notifications had silently never been
      # photographed. A screen that cannot be reached is a screen nobody is looking at.
      - scrollUntilVisible:
          element: "MY SPACE"
          direction: DOWN
          timeout: 20000
      - tapOn: "MY SPACE"
      - waitForAnimationToEnd:
          timeout: 4000
      - scrollUntilVisible:
          element: "Notifications"
          direction: DOWN
          timeout: 20000
      - tapOn: "Notifications"
      - waitForAnimationToEnd:
          timeout: 12000
      - takeScreenshot: sweep-26-notifications

# ── A detail screen, because lists and details fail differently ────────────────
# A list shows truncation and spacing problems; a detail screen shows long text,
# empty fields and image handling. Tapping the first card's title is more robust
# than a coordinate, which moves whenever the layout does.
- runFlow:
    optional: true
    commands:
      - launchApp:
          clearState: false
      - extendedWaitUntil:
          visible: "Community Feed"
          timeout: 30000
      - tapOn: "Listings"
      - waitForAnimationToEnd:
          timeout: 8000
      - waitForAnimationToEnd:
          timeout: 8000
      - tapOn: "E2E Fixture Listing.*"
      - waitForAnimationToEnd:
          timeout: 12000
      - takeScreenshot: sweep-27-listing-detail
      - scroll
      - waitForAnimationToEnd:
          timeout: 4000
      - takeScreenshot: sweep-28-listing-detail-scrolled

# ── Signed-out sub-screens — LAST, because these need a signed-out session ─────
#
# `when: visible:` guards each tap: if the link is not there the block is skipped
# rather than tapping nothing and continuing on a wrong screen.
- launchApp:
    clearState: true

- runFlow:
    when:
      visible: "Select your timebank"
    commands:
      - tapOn: "hour-timebank"

- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 6000

- runFlow:
    when:
      visible: "Forgot password.*"
    commands:
      - tapOn: "Forgot password.*"
      - waitForAnimationToEnd:
          timeout: 8000
      - takeScreenshot: sweep-29-forgot-password

- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 6000

- runFlow:
    when:
      visible: "Create account"
    commands:
      - tapOn: "Create account"
      - waitForAnimationToEnd:
          timeout: 8000
      - takeScreenshot: sweep-30-register
      - scroll
      - waitForAnimationToEnd:
          timeout: 4000
      - takeScreenshot: sweep-31-register-scrolled

- launchApp:
