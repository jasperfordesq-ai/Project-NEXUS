#
# VISUAL SWEEP — a wide walk for finding bugs by eye. NOT a pass/fail test and NOT
# a source of baselines.
#
# 🔴 WHY THIS IS SEPARATE FROM capture-screens.yaml. That flow feeds the pixel
# comparison gate, so every screen in it must be reproducible to 0px and it is
# deliberately only six screens. This flow is the opposite trade: it visits as many
# screens as it can and does not care whether they reproduce, because a human is
# going to look at the images rather than a comparison. Mixing the two would either
# flood the gate with false regressions from live data, or keep the sweep down to
# six screens and find nothing.
#
# It lives in `screens/` for the same reason capture-screens.yaml does:
# `.maestro/config.yaml` declares `flows: - "*.yaml"`, which matches the top level
# only, so `npm run e2e` does not run this.
#
# ── The two rules this flow is built around, both learned the hard way ──────────
#
# 🔴 1. NEVER press `back` to get out of a screen. On Android a `back` with nothing
# to dismiss NAVIGATES, and enough of them walk out of the app entirely. The first
# version of this flow lost 22 screens that way and photographed the phone's home
# screen as "the register page". Same trap as `.maestro/09-registration-flow.yaml`.
# Every block below returns to a known state with `launchApp` instead.
#
# 🔴 2. NEVER chain one screen off another. The second version tapped "More" to
# reach each destination, which worked until the Groups screen — that one opens OVER
# the tab bar, so every subsequent `tapOn: "More"` failed and ten screens went
# missing. Each block is now independent: relaunch, land on the feed, navigate once,
# photograph. It costs a few seconds per screen and cannot cascade.
#
# 🔴 3. Partial text does not match. Maestro matches the WHOLE text, so "Forgot"
# never matched "Forgot password?" — it warned and did nothing. Use the full string
# or an explicit `.*`.
#
# Run:
#   node scripts/screenshots.mjs sweep
#   node scripts/screenshots.mjs sweep --scheme dark

appId: ie.project.nexus
---
# ── Sign in once, so the session is cached for every relaunch below ────────────
- launchApp:
    clearState: true

- runFlow:
    when:
      visible: "Select your timebank"
    commands:
      - extendedWaitUntil:
          visible: "Select your timebank"
          timeout: 8000
      - takeScreenshot: sweep-00-tenant-select
      - tapOn: "hour-timebank"

- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: sweep-01-login

- tapOn:
    id: "email-input"
- inputText: "${TEST_EMAIL}"
- tapOn:
    id: "password-input"
- inputText: "${TEST_PASSWORD}"
# Needed here: the submit button is below the keyboard. This is the one `back` in
# the flow and it has a keyboard to dismiss, which is the case where it is safe.
- back
- tapOn:
    id: "login-submit"

- extendedWaitUntil:
    visible: "Community Feed"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: sweep-02-home-feed

- runFlow:
    optional: true
    commands:
      - scroll
      - waitForAnimationToEnd:
          timeout: 4000
      - takeScreenshot: sweep-03-home-feed-scrolled

# ── The four other tab-bar destinations ────────────────────────────────────────
- runFlow:
    optional: true
    commands:
      - tapOn: "Listings"
      # Listings needs TWO settle passes: its cards animate in after the header is
      # already present.
      - waitForAnimationToEnd:
          timeout: 8000
      - waitForAnimationToEnd:
          timeout: 8000
      - takeScreenshot: sweep-04-listings
      - scroll
      - waitForAnimationToEnd:
          timeout: 4000
      - takeScreenshot: sweep-05-listings-scrolled

- runFlow:
    optional: true
    commands:
      - tapOn: "Messages"
      - waitForAnimationToEnd:
          timeout: 8000
      - takeScreenshot: sweep-06-messages

- runFlow:
    optional: true
    commands:
      - tapOn: "Create"
      - waitForAnimationToEnd:
          timeout: 8000
      - takeScreenshot: sweep-07-create

- runFlow:
    optional: true
    commands:
      - launchApp:
          clearState: false
      - extendedWaitUntil:
          visible: "Community Feed"
          timeout: 30000
      - tapOn: "More"
      - waitForAnimationToEnd:
          timeout: 8000
      - takeScreenshot: sweep-08-more
      - scroll
      - waitForAnimationToEnd:
          timeout: 4000
      - takeScreenshot: sweep-09-more-scrolled
      - scroll
      - waitForAnimationToEnd:
          timeout: 4000
      - takeScreenshot: sweep-10-more-scrolled-2

# ── Screens behind the More menu ──────────────────────────────────────────────
#
# One independent block per destination. `scrollUntilVisible` finds items below the
# fold, which a bare `tapOn` cannot. Every block starts from a relaunch so a screen
# that hides the tab bar cannot cost the ones after it — see rule 2 above.
- runFlow:
    optional: true
    commands:
      - launchApp:
          clearState: false
      - extendedWaitUntil:
          visible: "Community Feed"
          timeout: 30000
      - tapOn: "More"
      - waitForAnimationToEnd:
          timeout: 6000
      - tapOn: "View wallet"
      - waitForAnimationToEnd:
          timeout: 12000
      - takeScreenshot: sweep-11-wallet
      - scroll
      - waitForAnimationToEnd:
          timeout: 4000
      - takeScreenshot: sweep-12-wallet-scrolled

- runFlow:
    optional: true
    commands:
      - launchApp:
          clearState: false
      - extendedWaitUntil:
          visible: "Community Feed"
          timeout: 30000
      - tapOn: "More"
      - waitForAnimationToEnd:
          timeout: 6000
      - tapOn: "Edit profile"
      - waitForAnimationToEnd:
          timeout: 12000
      - takeScreenshot: sweep-13-edit-profile

- runFlow:
