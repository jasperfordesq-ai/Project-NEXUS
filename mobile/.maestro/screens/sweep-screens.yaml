          clearState: false
      - extendedWaitUntil:
          visible: "Community Feed"
          timeout: 30000
      - tapOn: "More"
      - waitForAnimationToEnd:
          timeout: 6000
      - scrollUntilVisible:
          element: "Discover"
          direction: DOWN
          timeout: 20000
      - tapOn: "Discover"
      - waitForAnimationToEnd:
          timeout: 12000
      - takeScreenshot: sweep-14-discover

