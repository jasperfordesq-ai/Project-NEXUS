#
# SCREENSHOT TOUR — not a pass/fail test.
#
# Signs in and visits the main signed-in screens, photographing each one. The
# images are then collected by `node scripts/screenshots.mjs tour` and compared
# against the committed baselines, which is where a layout regression is caught.
#
# 🔴 IT LIVES IN A SUBDIRECTORY ON PURPOSE. `.maestro/config.yaml` declares
# `flows: - "*.yaml"`, which matches the top level only — so `npm run e2e` runs
# the nine behaviour flows and does NOT run this tour. Moving this file up one
# level would put screenshot capture inside the E2E suite, where a layout change
# would start failing the behaviour tests.
#
# Screen names are stable and must not be renamed casually: they are the baseline
# filenames, so renaming one orphans its baseline and reads as a new screen with
# no history.
#
# Run:
#   node scripts/screenshots.mjs tour
#   node scripts/screenshots.mjs tour --scheme dark

appId: ie.project.nexus
---
- launchApp:
    clearState: true

# ── Sign in ───────────────────────────────────────────────────────────────────
# A fresh API 36 installation can remain on the native splash beyond Maestro's
# short conditional lookup. Run 33282022295 checked too early, skipped the tenant
# branch, and then waited for login while the app was actually on the picker.
- extendedWaitUntil:
    visible: "Select your timebank|Welcome back"
    timeout: 60000
- runFlow:
    when:
      visible: "Select your timebank"
    commands:
      - extendedWaitUntil:
          visible:
            id: "tenant-option-hour-timebank"
          timeout: 15000
      - tapOn:
          id: "tenant-option-hour-timebank"
      - extendedWaitUntil:
          visible: "Welcome back"
          timeout: 15000

- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 60000

# The signed-out screen is worth a baseline of its own — it is the first thing a
# new member sees, and the only screen reachable with no account.
- waitForAnimationToEnd:
    timeout: 8000
# The tenant logo is fetched after the login shell paints. Capture bounded candidates;
# screenshots.mjs accepts one only after two consecutive images meet the pixel budget.
- takeScreenshot: 01-login-candidate-1
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 01-login-candidate-2
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 01-login-candidate-3
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 01-login-candidate-4

- tapOn:
    id: "email-input"
- inputText: "${TEST_EMAIL}"
- tapOn:
    id: "password-input"
- inputText: "${TEST_PASSWORD}"
# Dismiss the keyboard, or it covers the lower half of every capture.
- back
- tapOn:
    id: "login-submit"

- extendedWaitUntil:
    visible: "Community Feed"
    timeout: 20000

# ── The five tab-bar destinations ─────────────────────────────────────────────
#
# 🔴 `waitForAnimationToEnd` precedes EVERY capture. Waiting for an element to be
# visible is not the same as the screen having settled: on the first attempt the
# profile and messages screens were photographed mid-settle and came out
# vertically offset from the previous run — 8.5% and 5.6% of pixels different,
# with the entire content shifted. That reads as a layout regression and is
# nothing of the sort. Animations cannot simply be disabled here, because that
# brings back the LogBox banner that covers the tab bar.
# A settle wait before each capture: the tab content loads asynchronously, and a
# screenshot taken mid-load photographs a skeleton placeholder, which then
# becomes a baseline that never reproduces.
- extendedWaitUntil:
    visible: "Community Feed"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 02-home-feed

- tapOn: "Listings"
- extendedWaitUntil:
    visible: "Listings|Browse|Search"
    timeout: 15000
# 🔴 Listings needs TWO settle passes. Its cards animate in after the header is
# already present, so a single wait returns while the list is still moving: the
# header compared clean while the card region differed by 8.3%. A second pass
# covers the staggered card entrance.
- waitForAnimationToEnd:
    timeout: 8000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 03-listings

- tapOn: "Messages"
- extendedWaitUntil:
    visible: "Messages|Conversations|No messages"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 04-messages

- tapOn: "More"
- extendedWaitUntil:
    visible: "View wallet"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 05-profile

# ── One screen behind the tab bar ─────────────────────────────────────────────
# The wallet is the highest-consequence member screen (balances and time
# credits), and it was where the web platform's contrast failures were first
# noticed, so it earns a baseline.
- tapOn: "View wallet"
- extendedWaitUntil:
    visible: "Wallet|Balance|Transactions"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 06-wallet

# ── Screens that hold still ───────────────────────────────────────────────────
#
# 🔴 Added 2026-08-24 to widen the gate from three compared screens to six, and
# chosen for ONE reason: they contain no relative timestamps and no staggered list
# animation, which is exactly why the feed, listings and messages captures had to be
# excluded from comparison (see VOLATILE_SCREENS in scripts/screenshots.mjs).
#
#   settings      a static list of labels and switches
#   support       a static list of documents
#   new-exchange  an EMPTY form — nothing on it comes from the database at all
#
# Each was captured twice before its baseline was approved, and only approved because
# the two runs matched. A baseline that does not reproduce is worse than no baseline.
#
# Reached by link rather than by tapping, so a change to the More menu cannot silently
# stop these being captured. 🔴 `nexus://`, NOT the https address: Maestro's `openLink` does
# not name a package, so an https link can be handed to the browser instead of the app —
# which is exactly what happened on the first attempt, and the tour failed its assertion
# while the same link opened the screen correctly through `adb … -d <url> <package>`.
- openLink: nexus://settings
- extendedWaitUntil:
    visible: "Settings|Appearance|Account"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 07-settings

- openLink: nexus://support
- extendedWaitUntil:
    visible: "Support|Help|Contact"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 08-support

- openLink: nexus://listings/create
- extendedWaitUntil:
    visible: "Title|What are you offering|Offer|Request"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 09-new-exchange
