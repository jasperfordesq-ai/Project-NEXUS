#
# Draft Apple App Store capture tour. It runs only on an iPhone Simulator in the
# manually-dispatched GitHub Actions workflow. Each screen starts from a known
# state so one navigation failure cannot silently corrupt the rest of the set.

appId: ie.project.nexus
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Select your timebank|Welcome back"
    timeout: 60000

- runFlow:
    when:
      visible: "Select your timebank"
    commands:
      - tapOn: "Partner Demo"

- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 60000
- tapOn:
    id: "email-input"
- inputText: "${TEST_EMAIL}"
- tapOn:
    id: "password-input"
- setClipboard: ${TEST_PASSWORD_HEX.match(/../g).map(pair => String.fromCharCode(parseInt(pair, 16))).join('')}
- pasteText
- tapOn: "Show or hide password"
- copyTextFrom:
    id: "password-input"
- tapOn: "Show or hide password"
- assertTrue:
    condition: ${maestro.copiedText == TEST_PASSWORD_HEX.match(/../g).map(pair => String.fromCharCode(parseInt(pair, 16))).join('')}
    label: "The password field exactly matches the protected test credential"
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible: "Community Feed"
    timeout: 30000
- extendedWaitUntil:
    visible: "Read more|View post|Comment"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 01-feed

- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Community Feed"
    timeout: 30000
- tapOn: "Listings"
- extendedWaitUntil:
    visible: "Listings|Browse|Search"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 8000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 02-listings

- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Community Feed"
    timeout: 30000
- tapOn: "More"
- waitForAnimationToEnd:
    timeout: 6000
- scrollUntilVisible:
    element: "Browse Members"
    direction: DOWN
    timeout: 20000
- tapOn: "Browse Members"
- waitForAnimationToEnd:
    timeout: 12000
- takeScreenshot: 03-members

- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Community Feed"
    timeout: 30000
- tapOn: "Messages"
- extendedWaitUntil:
    visible: "Messages|Conversations|No messages"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 04-messages

- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Community Feed"
    timeout: 30000
- tapOn: "More"
- waitForAnimationToEnd:
    timeout: 6000
- scrollUntilVisible:
    element: "Events"
    direction: DOWN
    timeout: 20000
- tapOn: "Events"
- waitForAnimationToEnd:
    timeout: 12000
- takeScreenshot: 05-events

- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Community Feed"
    timeout: 30000
- tapOn: "More"
- waitForAnimationToEnd:
    timeout: 6000
- tapOn: "View wallet"
- waitForAnimationToEnd:
    timeout: 12000
- takeScreenshot: 06-wallet

- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Community Feed"
    timeout: 30000
- tapOn: "More"
- waitForAnimationToEnd:
    timeout: 6000
- scrollUntilVisible:
    element: "Volunteering"
    direction: DOWN
    timeout: 20000
- tapOn: "Volunteering"
- waitForAnimationToEnd:
    timeout: 12000
- takeScreenshot: 07-volunteering

- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Community Feed"
    timeout: 30000
- tapOn: "More"
- waitForAnimationToEnd:
    timeout: 6000
