#
# Draft Apple App Store public capture tour. It runs only on an iPhone Simulator
# in the manually-dispatched GitHub Actions workflow and captures exactly the four
# screens accepted by the preparation gate after visual review.

appId: ie.project.nexus
---
- extendedWaitUntil:
    visible: "Select your timebank|Welcome back"
    timeout: 60000

- runFlow:
    when:
      visible: "Select your timebank"
    commands:
      - retry:
          maxRetries: 3
          commands:
            - extendedWaitUntil:
                visible:
                  id: "tenant-option-partner-demo"
                timeout: 15000
            - tapOn:
                id: "tenant-option-partner-demo"
                retryTapIfNoChange: true
            # A successful XCTest tap is not the same thing as a successful app
            # transition. Keep the destination proof inside the retry so an
            # intermittent dropped iOS press gets another complete attempt.
            - extendedWaitUntil:
                visible: "Welcome back"
                timeout: 15000

- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 15000
- tapOn:
    id: "email-input"
- inputText: "${TEST_EMAIL}"
- tapOn:
    id: "password-input"
- setClipboard: ${TEST_PASSWORD_HEX.match(/../g).map(pair => String.fromCharCode(parseInt(pair, 16))).join('')}
- pasteText
# The password input's `onSubmitEditing` owns this native Done/Enter action.
# A hierarchy-based tap on login-submit still queried the route transition for
# 76 seconds despite a zero settle timeout, then killed XCTest in run 33275173679.
# A key event submits the same form without asking for that unstable hierarchy.
- pressKey: Enter
# Do not relaunch while login is still in flight. AuthContext persists the token
# and cached user before routing, so reaching the feed proves both have completed.
- extendedWaitUntil:
    visible: "Community Feed"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 01-feed

- tapOn:
    point: "29%,95%"
- extendedWaitUntil:
    visible: "Listings"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 8000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 02-listings

# Use the app's tested native deep links for the remaining public screens. The
# profile hub is deliberately long and module-dependent; asking XCUITest for its
# full hierarchy while scrolling made Maestro query the absent SafariViewService
# and kill its own UI-test host in run 33268251338. Direct links exercise the same
# authenticated routes without coupling screenshot capture to that menu geometry.
- openLink: "nexus://messages"
# On this fixed simulator size Apple's confirmation button is centred at this
# point. A text lookup makes XCTest serialize the SpringBoard hierarchy and can
# take long enough to kill Maestro (run 33278642889). The coordinate is also a
# harmless body tap if iOS has already delivered the link directly.
- tapOn:
    point: "67%,54%"
# Let the sheet dismissal and route transition finish before sampling whether
# Listings is still present. Without this pause run 33278248859 entered the
# fallback from a stale Listings hierarchy, then could not find its tab because
# the app had already completed the move to Messages.
- waitForAnimationToEnd:
    timeout: 8000
# iOS 26 can acknowledge the foreground open request without presenting its
# confirmation sheet and without delivering the URL to the already-active app.
# The Messages tab is visible on Listings, so use it as a proven in-app fallback
# and make the destination part of the retry contract.
- runFlow:
    when:
      visible: "Listings"
    commands:
      - retry:
          maxRetries: 3
          commands:
            - tapOn: "Messages"
            - extendedWaitUntil:
                visible: "Messages"
                timeout: 15000
- extendedWaitUntil:
    visible: "Messages"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 04-messages

# Foreground custom URLs are unreliable on iOS 26, while cold-start delivery is
# covered by the app's pending-deep-link path. Stop only the app; the one Maestro
# process/XCTest session remains alive for the whole public tour.
- stopApp
- openLink: "nexus://events"
- tapOn:
    point: "67%,54%"
- extendedWaitUntil:
    visible: "Events"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 12000
- takeScreenshot: 05-events
