#
# Draft Apple App Store capture tour. It runs only on an iPhone Simulator in the
# manually-dispatched GitHub Actions workflow. Each screen starts from a known
# state so one navigation failure cannot silently corrupt the rest of the set.

appId: ie.project.nexus
---
- extendedWaitUntil:
    visible: "Select your timebank|Welcome back"
    timeout: 60000

- runFlow:
    when:
      visible: "Select your timebank"
    commands:
      - retry:
          maxRetries: 3
          commands:
            - extendedWaitUntil:
                visible:
                  id: "tenant-option-partner-demo"
                timeout: 15000
            - tapOn:
                id: "tenant-option-partner-demo"
                retryTapIfNoChange: true

- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 60000
- tapOn:
    id: "email-input"
- inputText: "${TEST_EMAIL}"
- tapOn:
    id: "password-input"
- setClipboard: ${TEST_PASSWORD_HEX.match(/../g).map(pair => String.fromCharCode(parseInt(pair, 16))).join('')}
- pasteText
- tapOn:
    id: "login-submit"
    # Login succeeded and feed requests completed in run 33267129079, but the
    # XCUITest accessibility host died while Maestro waited for the route-swap
    # hierarchy to settle (kAXErrorServerNotFound). Let the explicit feed wait
    # below own that transition instead.
    waitToSettleTimeoutMs: 0
# Do not relaunch while login is still in flight. AuthContext persists the token
# and cached user before routing, so reaching the feed proves both have completed.
- extendedWaitUntil:
    visible: "Community Feed"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 01-feed

- tapOn:
    point: "29%,95%"
- extendedWaitUntil:
    visible: "Listings"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 8000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 02-listings

- tapOn:
    point: "10%,95%"
- extendedWaitUntil:
    visible: "Community Feed"
    timeout: 30000
- tapOn:
    point: "90%,95%"
- waitForAnimationToEnd:
    timeout: 6000
- scrollUntilVisible:
    element: "Browse Members"
    direction: DOWN
    timeout: 20000
- tapOn: "Browse Members"
- waitForAnimationToEnd:
    timeout: 12000
- takeScreenshot: 03-members

- tapOn:
    point: "15%,12%"
    retryTapIfNoChange: true
- tapOn:
    point: "10%,95%"
- extendedWaitUntil:
    visible: "Community Feed"
    timeout: 30000
- tapOn:
    point: "70%,95%"
- extendedWaitUntil:
    visible: "Messages"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 04-messages

- tapOn:
    point: "10%,95%"
- extendedWaitUntil:
    visible: "Community Feed"
    timeout: 30000
- tapOn:
    point: "90%,95%"
- waitForAnimationToEnd:
    timeout: 6000
- scrollUntilVisible:
    element: "Events"
    direction: DOWN
    timeout: 20000
- tapOn: "Events"
- waitForAnimationToEnd:
    timeout: 12000
- takeScreenshot: 05-events

- tapOn:
    point: "10%,95%"
- extendedWaitUntil:
    visible: "Community Feed"
    timeout: 30000
- tapOn:
    point: "90%,95%"
- waitForAnimationToEnd:
    timeout: 6000
- scrollUntilVisible:
    element:
      id: "profile-view-wallet"
    direction: UP
    timeout: 20000
- tapOn:
    id: "profile-view-wallet"
- extendedWaitUntil:
    visible: "Time credit wallet"
    timeout: 20000
- takeScreenshot: 06-wallet

- tapOn:
    point: "15%,12%"
    retryTapIfNoChange: true
- tapOn:
    point: "10%,95%"
- extendedWaitUntil:
    visible: "Community Feed"
    timeout: 30000
- tapOn:
    point: "90%,95%"
- waitForAnimationToEnd:
    timeout: 6000
- scrollUntilVisible:
    element: "Volunteering"
    direction: DOWN
    timeout: 20000
- tapOn: "Volunteering"
- waitForAnimationToEnd:
    timeout: 12000
- takeScreenshot: 07-volunteering

- tapOn:
    point: "15%,12%"
    retryTapIfNoChange: true
- tapOn:
    point: "10%,95%"
- extendedWaitUntil:
    visible: "Community Feed"
    timeout: 30000
- tapOn:
    point: "90%,95%"
- waitForAnimationToEnd:
    timeout: 6000
- scrollUntilVisible:
    element: "Settings"
    direction: DOWN
    timeout: 20000
- tapOn: "Settings"
- waitForAnimationToEnd:
    timeout: 12000
- takeScreenshot: 08-settings
