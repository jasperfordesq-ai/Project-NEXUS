#
# Draft Apple App Store public capture tour. It runs only on an iPhone Simulator
# in the manually-dispatched GitHub Actions workflow and captures exactly the four
# screens accepted by the preparation gate after visual review.

appId: ie.project.nexus
---
- extendedWaitUntil:
    visible: "Select your timebank|Welcome back"
    timeout: 60000

- runFlow:
    when:
      visible: "Select your timebank"
    commands:
      - retry:
          maxRetries: 3
          commands:
            - extendedWaitUntil:
                visible:
                  id: "tenant-option-partner-demo"
                timeout: 15000
            - tapOn:
                id: "tenant-option-partner-demo"
                retryTapIfNoChange: true
            # A successful XCTest tap is not the same thing as a successful app
            # transition. Keep the destination proof inside the retry so an
            # intermittent dropped iOS press gets another complete attempt.
            - extendedWaitUntil:
                visible: "Welcome back"
                timeout: 15000

- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 15000
- tapOn:
    id: "email-input"
- inputText: "${TEST_EMAIL}"
- tapOn:
    id: "password-input"
- setClipboard: ${TEST_PASSWORD_HEX.match(/../g).map(pair => String.fromCharCode(parseInt(pair, 16))).join('')}
- pasteText
# The password input's `onSubmitEditing` owns this native Done/Enter action.
# A hierarchy-based tap on login-submit still queried the route transition for
# 76 seconds despite a zero settle timeout, then killed XCTest in run 33275173679.
# A key event submits the same form without asking for that unstable hierarchy.
- pressKey: Enter
# Do not relaunch while login is still in flight. AuthContext persists the token
# and cached user before routing, so reaching the feed proves both have completed.
- extendedWaitUntil:
    visible: "Community Feed"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 01-feed

- tapOn:
    point: "29%,95%"
- extendedWaitUntil:
    visible: "Listings"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 8000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 02-listings

# Stay inside the app for every remaining screen. Apple's custom-URL confirmation
# belongs to SpringBoard, outside Maestro's app-scoped driver: run 33279028208
# proved that even a geometrically correct tap cannot dismiss it. Messages is the
# fourth stable tab on this fixed five-tab layout.
- tapOn:
    point: "70%,95%"
- extendedWaitUntil:
    visible: "Messages"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 04-messages

# Events is a hidden auxiliary tab reached from the visible More hub. It is the
# fifth row in the first Discover card for the protected Partner Demo tenant.
# Its initial frame extends beneath the fixed tab bar: run 33280917178 showed
# XCTest resolving the row at y=877, where the centre Create tab intercepted the
# touch. Move the list once so the exact row is physically above the tab bar.
- tapOn:
    point: "90%,95%"
- extendedWaitUntil:
    visible: "Events"
    timeout: 15000
- swipe:
    start: "50%,80%"
    end: "50%,35%"
    duration: 500
- extendedWaitUntil:
    visible: "^Events$"
    timeout: 15000
- tapOn: "^Events$"
- extendedWaitUntil:
    visible: "Events"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 12000
- takeScreenshot: 05-events
