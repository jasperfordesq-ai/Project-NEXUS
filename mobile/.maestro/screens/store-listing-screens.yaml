#
# Focused Google Play store capture tour. It uses the fictional Partner Demo
# review tenant and visits only the eight screens that explain the product
# clearly in a store listing.

appId: ie.project.nexus
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Select your timebank|Welcome back"
    timeout: 60000

- runFlow:
    when:
      visible: "Select your timebank"
    commands:
      - retry:
          maxRetries: 3
          commands:
            - extendedWaitUntil:
                visible:
                  id: "tenant-option-partner-demo"
                timeout: 15000
            - tapOn:
                id: "tenant-option-partner-demo"
                retryTapIfNoChange: true

- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 60000
- tapOn:
    id: "email-input"
- inputText: "${TEST_EMAIL}"
- tapOn:
    id: "password-input"
- inputText: "${TEST_PASSWORD}"
- back
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible: "Community Feed"
    timeout: 30000
- extendedWaitUntil:
    visible: "Read more|View post|Comment"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 01-feed

- tapOn: "Listings"
- extendedWaitUntil:
    visible: "Listings|Browse|Search"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 8000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 02-listings

- tapOn: "Messages"
- extendedWaitUntil:
    visible: "Messages|Conversations|No messages"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 03-messages

- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Community Feed"
    timeout: 30000
- tapOn: "More"
- waitForAnimationToEnd:
    timeout: 6000
- tapOn: "View wallet"
- waitForAnimationToEnd:
    timeout: 12000
- takeScreenshot: 04-wallet

- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Community Feed"
    timeout: 30000
- tapOn: "More"
- waitForAnimationToEnd:
    timeout: 6000
- scrollUntilVisible:
    element: "Events"
    direction: DOWN
    timeout: 20000
- tapOn: "Events"
- waitForAnimationToEnd:
    timeout: 12000
- takeScreenshot: 05-events

- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Community Feed"
    timeout: 30000
- tapOn: "More"
- waitForAnimationToEnd:
    timeout: 6000
- scrollUntilVisible:
    element: "Groups"
    direction: DOWN
    timeout: 20000
- tapOn: "Groups"
- waitForAnimationToEnd:
    timeout: 12000
- takeScreenshot: 06-groups

- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Community Feed"
    timeout: 30000
- tapOn: "More"
- waitForAnimationToEnd:
    timeout: 6000
- scrollUntilVisible:
    element: "Browse Members"
    direction: DOWN
    timeout: 20000
- tapOn: "Browse Members"
- waitForAnimationToEnd:
    timeout: 12000
- takeScreenshot: 07-members

- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Community Feed"
    timeout: 30000
- tapOn: "More"
- waitForAnimationToEnd:
    timeout: 6000
- scrollUntilVisible:
    element: "Volunteering"
    direction: DOWN
    timeout: 20000
- tapOn: "Volunteering"
- waitForAnimationToEnd:
    timeout: 12000
- takeScreenshot: 08-volunteering
