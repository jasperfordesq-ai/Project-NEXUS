#
# Flow 09 - Registration Form
#
# Verifies that the registration form renders correctly and that all required
# fields accept input. This flow does NOT submit the form to avoid creating
# throwaway accounts in the test tenant on every CI run. It exists purely to
# validate that the Create Account screen is reachable and functional.
#
# Text values are taken directly from locales/en/auth.json:
#   title:                "Create account"
#   firstNamePlaceholder: "Jane"
#   lastNamePlaceholder:  "Smith"
#   phonePlaceholder:     "+1 555 123 4567"
#   locationPlaceholder:  "City, country"
#   emailPlaceholder:     "you@example.com"
#   passwordPlaceholder:  "At least 12 characters"
#
# Run:
#   maestro test .maestro/09-registration-flow.yaml
#   (No TEST_EMAIL / TEST_PASSWORD required - does not log in)

appId: ie.project.nexus
---
# 🔴 HISTORICAL FLAKE — guarded at both causes.
#
# Symptom: "No visible element found: id: register-password", after
# scrollUntilVisible hunts for 20 seconds.
#
# Cause: the `- back` calls below are keyboard dismissals, and they are NECESSARY —
# every field from Phone downwards sits under the on-screen keyboard, so the next
# `tapOn` cannot reach it until the keyboard is dismissed. But on Android a back
# press with NO keyboard open NAVIGATES instead, and enough of them exit the app.
# The failure screenshot shows the Android launcher: the app had quietly gone, and
# scrollUntilVisible was searching a dead process.
#
# THREE FIXES WERE TRIED AND ALL WERE WORSE. Recorded so nobody repeats them:
#
#   1. `hideKeyboard` instead of `- back` — NOT safer. It is a back press underneath;
#      three consecutive calls exit the app just the same (measured).
#   2. Deleting the dismissals after Phone/Location, reasoning that first and last
#      name manage without one — WRONG. Those two are above the fold. Removing the
#      others makes the flow fail CONSISTENTLY at `tapOn: register-location`
#      (4 of 4 runs).
#   3. A guard assertion on the form title after each dismissal — FALSE ALARMS. The
#      form scrolls, so the title legitimately leaves the screen and the guard fires
#      on every run.
#
# Stable field testIDs and bounded retries now cover both the keyboard/scroll boundary
# and Maestro 2.8's occasional Android hierarchy failure (`Illegal character (U+0)`).
# Retries surround taps only, so text cannot be duplicated by a partial retry.

# 1. Reset and reach the login form through the tenant picker if needed
- runFlow: subflows/open-login.yaml

# 2. Assert we are on the login screen
- assertVisible: "Welcome back"

# 4. Tap "Create account" link to navigate to the registration screen
- tapOn: "Create account"

# 5. Wait for the registration screen to load
- extendedWaitUntil:
    visible: "Create account"
    timeout: 5000

# 6. Assert the registration form title is visible
- assertVisible: "Create account"

# 7. Fill in the First name field
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "register-first-name"
- inputText: "Test"

# 8. Fill in the Last name field
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "register-last-name"
- inputText: "User"

# 9. Fill in the Phone field
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "register-phone"
- inputText: "+15551234567"
- back

# 10. Fill in the Location field
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "register-location"
- inputText: "City, country"
- back

# 11. Fill in the Email field
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "register-email"
- inputText: "testuser.ci@example.com"
- back

# 12. Fill in the Password field
- scrollUntilVisible:
    element:
      id: "register-password"
    direction: DOWN
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "register-password"
- inputText: "TestPassword123!"
- back

# 13. Fill in the Confirm password field
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "register-confirm-password"
- inputText: "TestPassword123!"
- back
- waitForAnimationToEnd:
    timeout: 500

# 14. Accept the terms checkbox
- scrollUntilVisible:
    element:
      id: "register-terms"
    direction: DOWN
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "register-terms"

# 15. Screenshot the completed registration form before submit
- takeScreenshot: registration-form

# 16. Assert the lower form state remains visible after scrolling
- assertVisible: "Phone"
- assertVisible: "Location"
- assertVisible: "Email"
- assertVisible: "Password"
- assertVisible: "Confirm password"
- assertVisible:
    id: "register-terms"
- assertVisible: "I agree to the platform terms and privacy notice, and I am 18 years of age or older."

# NOTE: The submit button ("Create account") is intentionally NOT tapped here.
# To test the full registration flow end-to-end, uncomment the lines below and
# provide a unique email address (for example, via a timestamp-based fixture).
#
# - tapOn: "Create account"
# - wait:
#     for:
#       element:
#         text: "Feed"
#       timeout: 15000
# - assertVisible: "Feed"
