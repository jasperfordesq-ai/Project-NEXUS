# Four reversible member actions against deterministic Laravel fixtures. The
# workflow resets these rows before Maestro and verifies the database effects
# afterwards; UI success text alone is never treated as proof.

appId: ie.project.nexus
---
- runFlow: subflows/login.yaml

# Send a real private message to the second fixture member. Open the Messages tab
# and press the header's compose button by its test id, as a member would.
#   - Not by text: "New message" matches both the header icon and the empty-state
#     button, and run 33328312721 showed that ambiguity can leave the flow on
#     Messages even though Maestro reports the tap as complete.
#   - Not `nexus:///messages/new`: on 2026-08-30 Android's custom-scheme launcher
#     in this harness opened it as a conversation id.
#   - Not `nexus:///(modals)/new-message`: since F-496 (E-076) the app refuses an
#     internal route spelling arriving from outside the app, by design — that
#     refusal is what made scheduled run 36853472653 fail here.
- openLink: "nexus://messages"
- extendedWaitUntil:
    visible:
      id: "messages-new-message"
    timeout: 20000
- tapOn:
    id: "messages-new-message"
- extendedWaitUntil:
    visible: "Search members"
    timeout: 20000
- tapOn: "Search members"
- inputText: "E2E UserB"
- back
- extendedWaitUntil:
    visible: "Message E2E"
    timeout: 20000
- tapOn: "Message E2E"
- extendedWaitUntil:
    visible:
      id: "thread-screen"
    timeout: 20000
- tapOn: "Type a message…"
- inputText: "E2E device journey message persisted independently."
- back
- tapOn: "Send"
- extendedWaitUntil:
    visible: "E2E device journey message persisted independently."
    timeout: 20000

# Apply to a real volunteering opportunity.
- openLink: "nexus://volunteering"
- extendedWaitUntil:
    visible: "Search opportunities…"
    timeout: 20000
- tapOn: "Search opportunities…"
- inputText: "E2E Community Garden Volunteer"
- back
- scrollUntilVisible:
    element: "Apply for E2E Community Garden Volunteer"
    direction: DOWN
    timeout: 20000
- tapOn: "Apply for E2E Community Garden Volunteer"
- extendedWaitUntil:
    notVisible: "Apply for E2E Community Garden Volunteer"
    timeout: 20000

# Register as going to the deterministic future event.
- openLink: "nexus://events"
- extendedWaitUntil:
    visible: "E2E Community Welcome Event"
    timeout: 30000
- tapOn: "E2E Community Welcome Event"
- extendedWaitUntil:
    visible:
      id: "event-rsvp-footer"
    timeout: 30000
- tapOn:
    id: "event-going-action"
- extendedWaitUntil:
    visible:
      id: "event-going-action"
      selected: true
    timeout: 20000

# Save a physical-goods marketplace listing without entering checkout.
- openLink: "nexus://marketplace"
- extendedWaitUntil:
    visible: "Search marketplace..."
    timeout: 20000
- tapOn: "Search marketplace..."
- inputText: "E2E Marketplace Bicycle Helmet"
- back
- scrollUntilVisible:
    element: "View details for E2E Marketplace Bicycle Helmet"
    direction: DOWN
    timeout: 20000
- tapOn: "View details for E2E Marketplace Bicycle Helmet"
- extendedWaitUntil:
    visible: "Save"
    timeout: 20000
- tapOn: "Save"
- assertVisible: "Saved"
