#
# 🔴 THIS FILE MUST CONTAIN REAL YAML, NOT ONLY COMMENTS.
#
# Until 2026-08-18 it was comment-only, and Maestro refuses to parse that:
#
#   Failed to parse file: .maestro\config.yaml
#   List is empty.
#
# Which means `maestro test .maestro/` — the documented way to run the whole
# suite, and the way any CI job would run it — has NEVER worked. Running a single
# flow by path sidesteps config.yaml entirely, so the suite could look fine one
# flow at a time while the directory run was broken. That is very likely why nine
# perfectly good flows sat unrun.
#
# If you add documentation here, keep the `flows:` key below.

# Root journeys only. Reusable setup lives under subflows/ and is not discovered
# by this glob. Maestro deliberately does not guarantee discovery order, so every
# journey resets the app and establishes the state it needs.
flows:
  - "*.yaml"

# ── Running flows ────────────────────────────────────────────────────────────
#   Run all flows (discovery order is intentionally not guaranteed):
#     maestro test .maestro/
#
#   Run a single flow:
#     maestro test .maestro/01-auth-login.yaml
#
#   Run with credentials injected via env vars:
#     maestro test \
#       --env TEST_EMAIL=user@example.com \
#       --env TEST_PASSWORD=secret \
#       .maestro/
#
# ── Required env vars ────────────────────────────────────────────────────────
#   TEST_EMAIL     — email address for an existing test account
#   TEST_PASSWORD  — password for that account
#
# ── Flow isolation ───────────────────────────────────────────────────────────
#   Every journey can run first, last or alone. Authenticated journeys invoke
#   subflows/login.yaml; registration invokes subflows/open-login.yaml. This is
#   Maestro's documented isolation model:
#   https://docs.maestro.dev/maestro-flows/workspace-management/sequential-execution
#
# ── Tenant selection screen ──────────────────────────────────────────────────
#   On a completely clean install (clearState: true) the app may show a
#   "Select your timebank" screen before the login form. Flows that use
#   clearState handle this with a conditional assertVisible / tapOn block.
#   The default tenant for the test environment is "hour-timebank".
#
# ── CI integration ───────────────────────────────────────────────────────────
#   🔴 This block pointed at .github/workflows/mobile-eas-build.yml, which DOES
#      NOT EXIST and never has. Corrected 2026-08-18.
#
#   .github/workflows/mobile-device-tests.yml runs these journeys on an Android
#   emulator against a disposable Laravel fixture. It is scheduled and manually
#   dispatchable because the native build and emulator are substantially slower
#   than the source-level mobile-release job in ci.yml.
