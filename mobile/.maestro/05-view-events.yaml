#
# Flow 05 — View Events
#
# Opens Events through ordinary More navigation, verifies the API-backed screen
# and both date filters, and confirms the list remains functional after scroll.
#
# Run:
#   maestro test --env TEST_EMAIL=user@example.com --env TEST_PASSWORD=secret \
#     .maestro/05-view-events.yaml

appId: ie.project.nexus
---
# ── 1. Establish this flow's own authenticated session
- runFlow: subflows/login.yaml

- tapOn: "More"
- extendedWaitUntil:
    visible: "View wallet"
    timeout: 10000
- scrollUntilVisible:
    element: "Events"
    direction: DOWN
    timeout: 20000
- tapOn: "Events"

- extendedWaitUntil:
    visible: "Browse events"
    timeout: 20000
- assertVisible: "Events"
- assertVisible: "Upcoming"
- assertVisible: "Past"

- tapOn: "Past"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: events-past

- tapOn: "Upcoming"
- waitForAnimationToEnd:
    timeout: 2000
- swipe:
    direction: UP
    duration: 700
- assertVisible: "Upcoming"
- takeScreenshot: events-upcoming
