#
# Flow 01 — Authentication: Login
#
# Verifies that a returning user can sign in with valid credentials and land
# on the main Feed tab. Every flow establishes its own state, so this journey
# also remains reliable when Maestro discovers the suite in a different order.
#
# Run:
#   maestro test --env TEST_EMAIL=user@example.com --env TEST_PASSWORD=secret \
#     .maestro/01-auth-login.yaml

appId: ie.project.nexus
---
# ── 1. Reset, select the tenant if needed, and sign in
- runFlow: subflows/login.yaml

# ── 2. Assert we are on the main screen
- assertVisible: "Community Feed"

# ── 3. Capture a screenshot for the CI artefact store
- takeScreenshot: login-success
