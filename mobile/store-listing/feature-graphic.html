<!doctype html>
<html>
<head>
<meta charset="utf-8">

  Source for the Play Store feature graphic. Rendered to
  play-feature-graphic-1024x500.png by mobile/scripts/render-store-assets.mjs — edit this,
  then re-run that, so the asset is never a binary nobody can change.

  ICON_DATA_URI is replaced at render time with assets/icon.png as a data URI, because the
  renderer loads this file from disk with no server behind it.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    /* Brand blue (#006FEE) deepened toward the edges so overlaid Play chrome stays legible. */
    background:
      radial-gradient(120% 140% at 18% 30%, #2b8bff 0%, #006FEE 42%, #0a3f8f 100%);
    font-family: "Segoe UI", Roboto, Arial, Helvetica, sans-serif;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 56px;
    padding: 0 72px;
    position: relative;
  }
  /* A faint clock-face suggestion: time is the currency. Kept low-contrast so it reads as
     texture rather than a second logo competing with the icon. */
  .rings { position: absolute; right: -120px; top: -160px; width: 620px; height: 620px; opacity: 0.10; }
  .rings div {
    position: absolute; border: 2px solid #fff; border-radius: 50%;
    inset: 0; margin: auto;
  }
  .icon {
    width: 168px; height: 168px; border-radius: 38px; flex: 0 0 auto;
    box-shadow: 0 18px 44px rgba(3, 24, 56, 0.45);
  }
  .words { position: relative; z-index: 2; }
  h1 {
    font-size: 62px; font-weight: 700; letter-spacing: -1.2px; line-height: 1.02;
    text-shadow: 0 2px 18px rgba(3, 24, 56, 0.35);
  }
  p.tagline {
    margin-top: 14px; font-size: 31px; font-weight: 600; color: #d8ecff;
    letter-spacing: -0.2px;
  }
  p.sub {
    margin-top: 18px; font-size: 21px; font-weight: 400; color: #b9d8fb;
    max-width: 560px; line-height: 1.35;
  }
</style>
</head>
<body>
  <div class="rings">
    <div style="width:620px;height:620px"></div>
    <div style="width:470px;height:470px"></div>
    <div style="width:320px;height:320px"></div>
  </div>
  <img class="icon" src="ICON_DATA_URI" alt="">
  <div class="words">
    <h1>Timebank&nbsp;Global</h1>
    <p class="tagline">Give an hour. Earn an hour.</p>
    <p class="sub">Swap skills and time with your local community — everyone's hour is worth the same.</p>
  </div>
</body>
</html>
