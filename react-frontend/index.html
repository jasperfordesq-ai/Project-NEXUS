<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: Android Chrome resizes the layout
         viewport (and 100dvh) when the soft keyboard opens, so fixed-bottom
         composers and sheets stay visible above it instead of being overlaid.
         iOS Safari ignores the property; useVisualViewport keeps compensating
         there (its offset self-corrects to ~0 wherever the layout resizes). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/api/v2/pwa/manifest?path=%2F" />
    <!-- Matches the light DEFAULT_THEME in ThemeContext. ThemeContext rewrites
         this at runtime for members who have chosen dark. -->
    <meta name="theme-color" content="#fafaf9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NEXUS" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- No og:image here. PageMeta (react-helmet-async) writes it per page and
         Helmet does not replace tags it did not create, so a default here was
         served BEFORE the real one: crawler snapshots carried two og:image tags
         and Facebook took the first, an SVG it cannot show (2026-10-22). -->
    <!-- Shell title: needed by the offline / can't-connect screen, which
         renders before the app's layout (WCAG document-title, pinned by
         e2e/tests/app-shell-a11y.spec.ts). Under React 19, Helmet adds its
         own <title> rather than reusing this one, so crawler copies carried
         two; PageMeta and SeoHead remove this element by id once the page's
         own title is in place (removeShellTitle, 2026-10-23). -->
    <title id="nexus-shell-title">Project NEXUS</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Start screen (warmth plan Phase 4 A3): shown only until the app draws
         into #root, then hidden by the `#root:not(:empty)` rule below — CSS
         only, because inline scripts are refused by the security policy.
         🔴 It must stay OUTSIDE #root: scripts/check-prerender-delivery.mjs
         recognises a blank page by the literal empty root element. The
         community's colour is not known yet, so it uses the platform's own. -->
    <div id="nexus-boot" aria-hidden="true">
      <span class="nexus-boot-dot"></span><span class="nexus-boot-dot"></span><span class="nexus-boot-dot"></span>
    </div>
    <style>
      #nexus-boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; gap: 10px; background: #fafaf9; }
      #root:not(:empty) + #nexus-boot { display: none; }
      .nexus-boot-dot { width: 12px; height: 12px; border-radius: 9999px; background: #5b5ede; opacity: 0.35; animation: nexus-boot-pulse 1.2s ease-in-out infinite; }
      .nexus-boot-dot:nth-child(2) { background: #db2777; animation-delay: 0.2s; }
      .nexus-boot-dot:nth-child(3) { background: #0d9488; animation-delay: 0.4s; }
      @keyframes nexus-boot-pulse { 0%, 100% { opacity: 0.35; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1); } }
      @media (prefers-color-scheme: dark) {
        #nexus-boot { background: #0c0a09; }
        .nexus-boot-dot { background: #818cf8; }
        .nexus-boot-dot:nth-child(2) { background: #f472b6; }
        .nexus-boot-dot:nth-child(3) { background: #2dd4bf; }
      }
      @media (prefers-reduced-motion: reduce) { .nexus-boot-dot { animation: none; opacity: 0.7; } }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
