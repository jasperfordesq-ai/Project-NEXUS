# =============================================================================
# Project NEXUS - React Frontend Nginx Configuration (Blue/Green)
# =============================================================================

# =============================================================================
# Bot-only prerender serving.
#
# Real users always get the live SPA index.html — never a prerendered snapshot.
# This decouples snapshot freshness from user-facing correctness: a snapshot
# can reference stale build-hashed asset URLs without breaking page hydration,
# because the browser that loads those URLs is not the one that needs to
# execute the JS. Bots ignore JS entirely; they only read the body + meta.
#
# Side effect: the post-deploy stale-asset invalidation logic in
# prerender-tenants.sh is no longer load-bearing. Snapshots survive deploys
# and only need to be re-rendered when their content (DB-driven) changes.
# =============================================================================
map $http_user_agent $nexus_is_seo_bot {
    default 0;
    # Search-engine crawlers (organic SEO):
    #   googlebot, bingbot, slurp (Yahoo), duckduckbot, baiduspider, yandex,
    #   sogou, exabot, applebot, petalbot (Huawei), seznambot (Czech)
    # Social link unfurlers (Open Graph / Twitter cards / etc.):
    #   facebookexternalhit, twitterbot, linkedinbot, embedly, pinterest,
    #   slackbot, whatsapp, telegrambot, discordbot, redditbot, viberbot,
    #   skypeuripreview, vkshare
    # SEO audit / monitoring tools:
    #   ahrefsbot, semrushbot, mj12bot, chrome-lighthouse, screaming frog,
    #   dotbot, rogerbot, sitebulb
    # AI assistants / LLM training crawlers:
    #   gptbot (OpenAI), oai-searchbot (ChatGPT search), chatgpt-user,
    #   claudebot, claude-web, anthropic-ai, perplexitybot, perplexity-user,
    #   bytespider (ByteDance/TikTok), ccbot (Common Crawl), google-extended,
    #   amazonbot, applebot-extended, cohere-ai, diffbot, you.com, neevabot
    "~*(googlebot|bingbot|slurp|duckduckbot|baiduspider|yandex|sogou|exabot|applebot|petalbot|seznambot|facebookexternalhit|twitterbot|linkedinbot|embedly|pinterest|slackbot|whatsapp|telegrambot|discordbot|redditbot|viberbot|skypeuripreview|vkshare|ahrefsbot|semrushbot|mj12bot|chrome-lighthouse|screaming\\s*frog|dotbot|rogerbot|sitebulb|gptbot|oai-searchbot|chatgpt-user|claudebot|claude-web|anthropic-ai|perplexitybot|perplexity-user|bytespider|ccbot|google-extended|amazonbot|applebot-extended|cohere-ai|diffbot|you\\.com|neevabot)" 1;
}

# Classify whether the bot is an AI/LLM crawler that benefits from Markdown.
# Used to route AI bots to the .md variant of the snapshot when available.
map $http_user_agent $nexus_is_ai_bot {
    default 0;
    "~*(gptbot|oai-searchbot|chatgpt-user|claudebot|claude-web|anthropic-ai|perplexitybot|perplexity-user|bytespider|ccbot|google-extended|amazonbot|applebot-extended|cohere-ai|diffbot|you\.com|neevabot)" 1;
}

# Composite key: "<bot>:<bypass>". The Playwright worker sets bypass=1 to
# render against the live SPA (else it would render a snapshot of a snapshot).
# Anything other than "1:" or "1:0" falls through to a guaranteed-missing path
# so try_files lands on /_spa.html.
map "$nexus_is_seo_bot:$arg_nexus_prerender_bypass" $nexus_prerender_page {
    default /__nexus_prerender_bypass__;
    "1:"  /prerendered/$host$uri/index.html;
    "1:0" /prerendered/$host$uri/index.html;
}

# AI-bot Markdown variant. When an AI bot hits us, prefer the .md snapshot
# (cleaner, more token-efficient ingestion) and fall back to .html via the
# main try_files chain when the .md isn't available.
map "$nexus_is_ai_bot:$arg_nexus_prerender_bypass" $nexus_prerender_md {
    default /__nexus_prerender_bypass__;
    "1:"  /prerendered/$host$uri/index.md;
    "1:0" /prerendered/$host$uri/index.md;
}

map "$nexus_is_seo_bot:$arg_nexus_prerender_bypass" $nexus_prerender_root {
    default /__nexus_prerender_bypass__;
    "1:"  /prerendered/$host/index.html;
    "1:0" /prerendered/$host/index.html;
}

# Per-route HTTP status override map for prerendered pages (Phase 1.2).
# The worker writes a sidecar `_status` file next to non-200 snapshots, and
# scripts/prerender-tenants.sh aggregates them into the include file below as
# `"<host><uri>" "<status>";` lines. When a bot hits a route that maps to a
# non-empty status, the server block uses that as the response status and
# error_page-redirects to the snapshot to serve the body.
#
# The include file is created empty by the Dockerfile so nginx starts cleanly
# on fresh deploys; the prerender script rewrites it atomically and reloads.
map "$host$uri" $nexus_prerender_status_override {
    default "";
    # Stored beside snapshots so both blue/green colors compile the status
    # contract for the exact shared generation they can serve.
    include /usr/share/nginx/html/prerendered/.status-overrides.list;
}

map "$nexus_is_seo_bot:$arg_nexus_prerender_bypass" $nexus_prerender_enabled {
    default 0;
    "1:"  1;
    "1:0" 1;
}

map $http_authorization $nexus_maintenance_render_authenticated {
    default 0;
    include /usr/share/nginx/html/prerendered/.maintenance-render-auth.list;
}

map $nexus_maintenance_render_authenticated $nexus_maintenance_retry_after {
    default "300";
    "1" "";
}

map $nexus_maintenance_render_authenticated $nexus_maintenance_public_header {
    default "1";
    "1" "";
}

map $nexus_maintenance_render_authenticated $nexus_maintenance_private_header {
    default "";
    "1" "1";
}

# Only honour the override when the request is from a bot. Real users always
# get a 200 SPA shell. (The bot/bypass logic is already encoded in
# $nexus_prerender_page; this composite makes the same check available as a
# scalar suitable for `if` / `return`.)
map "$nexus_prerender_enabled:$nexus_prerender_status_override" $nexus_prerender_effective_status {
    default "";
    "~^1:(\d+)$" $1;
}

map $nexus_prerender_effective_status $nexus_prerender_retry_after {
    default "";
    "503" "300";
}

# Classify which crawler is hitting us — used as a label in the bot access log
# so the admin analytics view can aggregate by source. Falls back to "other"
# for anything matched by $nexus_is_seo_bot that isn't named here.
# IP-range based bot verification (Phase 4.1). The list file is refreshed by
# scripts/refresh-bot-ip-ranges.sh, which pulls Google/Bing/DuckDuckGo/Apple's
# published JSON feeds and converts them into `<cidr> 1;` lines. Anything not
# in the union evaluates to "". We don't block on the result — analytics logs
# a `verified` flag so admins can see spoofed-UA trends.
geo $remote_addr $nexus_bot_ip_verified {
    default "";
    include /etc/nginx/prerender-trusted-bot-ips.list;
}

map $http_user_agent $nexus_crawler_label {
    default "other";
    "~*googlebot"            "googlebot";
    "~*bingbot"              "bingbot";
    "~*duckduckbot"          "duckduckbot";
    "~*yandex"               "yandex";
    "~*baiduspider"          "baidu";
    "~*applebot"             "applebot";
    "~*petalbot"             "petalbot";
    "~*facebookexternalhit"  "facebook";
    "~*twitterbot"           "twitter";
    "~*linkedinbot"          "linkedin";
    "~*slackbot"             "slack";
    "~*discordbot"           "discord";
    "~*telegrambot"          "telegram";
    "~*whatsapp"             "whatsapp";
    "~*gptbot"               "openai-gpt";
    "~*oai-searchbot"        "openai-search";
    "~*chatgpt-user"         "openai-user";
    "~*claudebot"            "anthropic-claudebot";
    "~*claude-web"           "anthropic-claude-web";
    "~*anthropic-ai"         "anthropic-ai";
    "~*perplexitybot"        "perplexity";
    "~*ccbot"                "common-crawl";
    "~*google-extended"      "google-extended";
    "~*amazonbot"            "amazon";
    "~*bytespider"           "bytedance";
    "~*ahrefsbot"            "ahrefs";
    "~*semrushbot"           "semrush";
    "~*mj12bot"              "majestic";
}

# Bot-only access log, written as JSONL into the shared prerender volume so
# the PHP container can read + aggregate it (see CrawlerAnalyticsService).
# `if=$nexus_is_seo_bot` skips real-user traffic — this is a marketing/SEO
# signal, not an audit log.
log_format prerender_bot_jsonl escape=json '{'
    '"ts":"$time_iso8601",'
    '"host":"$host",'
    '"uri":"$uri",'
    '"status":$status,'
    '"prerender_status":"$nexus_prerender_effective_status",'
    '"crawler":"$nexus_crawler_label",'
    '"verified":"$nexus_bot_ip_verified",'
    '"ua":"$http_user_agent",'
    '"ip":"$remote_addr",'
    '"referer":"$http_referer",'
    '"bytes":$body_bytes_sent,'
    '"request_time":$request_time'
'}';

# One canonical browser policy for every SPA shell and prerender response.
# Keeping the value in a map prevents nginx's location-level add_header
# redeclarations from drifting as maintained integrations change.
map $host $nexus_spa_content_security_policy {
    default "default-src 'self'; script-src 'self' https://maps.googleapis.com https://maps.gstatic.com https://js.pusher.com https://analytics.ahrefs.com https://js.stripe.com https://checkout.stripe.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com https://*.google.com https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://api.maptiler.com https://api.os.uk https://api.project-nexus.ie https://*.giphy.com https://giphy.com https://*.stripe.com https://img.youtube.com https://i.ytimg.com; connect-src 'self' https://api.project-nexus.ie https://*.pusher.com wss://*.pusher.com https://*.googleapis.com https://*.gstatic.com https://*.google.com https://nominatim.openstreetmap.org https://firebaseinstallations.googleapis.com https://fcmregistrations.googleapis.com https://api.giphy.com https://*.ingest.de.sentry.io https://analytics.ahrefs.com https://api.stripe.com https://checkout.stripe.com https://api.openai.com https://api.pwnedpasswords.com; frame-src 'self' https://api.project-nexus.ie https://*.google.com https://js.stripe.com https://hooks.stripe.com https://checkout.stripe.com https://challenges.cloudflare.com https://www.youtube-nocookie.com https://www.youtube.com https://youtube.com https://player.vimeo.com https://open.spotify.com https://w.soundcloud.com https://player.twitch.tv https://clips.twitch.tv https://www.tiktok.com; media-src 'self' https: blob:; worker-src 'self' blob:; frame-ancestors 'self'; form-action 'self'; object-src 'none'; base-uri 'self'; report-uri https://api.project-nexus.ie/api/csp-report; report-to nexus-csp;";
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Bot-only JSONL access log. Written to the shared prerender volume so the
    # PHP container reads it via CrawlerAnalyticsService. The `if=` predicate
    # keeps real-user traffic out — this log exists for SEO insights, not
    # forensic audit.
    access_log /usr/share/nginx/html/prerendered/.bot-access.jsonl prerender_bot_jsonl if=$nexus_is_seo_bot;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=(self)" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy $nexus_spa_content_security_policy always;
    add_header Reporting-Endpoints 'nexus-csp="https://api.project-nexus.ie/api/csp-report"' always;

    # =========================================================================
    # Emergency SW kill-switch — /api/sw-reset.
    #
    # Last-resort manual recovery URL for users wedged on a broken service
    # worker. Bypasses every SW we've ever shipped because all of them
    # denylist /^\/api\// from the navigation handler — so the request
    # reaches nginx unconditionally. Response sends Clear-Site-Data and an
    # inline script that:
    #   1. Unregisters all service workers via navigator.serviceWorker
    #   2. Clears all CacheStorage entries (workbox precache lives here)
    #   3. Redirects to / — no SW intercepts the navigation now, so the
    #      browser fetches the fresh /index.html from the network.
    # Cookies + localStorage are preserved so the user stays logged in.
    #
    # Routine staleness should never reach this URL. The api.ts stale-client
    # gate redirects here automatically only after a 10-minute mismatch
    # window has elapsed without the soft-update path recovering the client.
    #
    # CSP is relaxed to allow the inline script ('unsafe-inline') — scoped
    # to this single recovery route only, not the rest of the site.
    # =========================================================================
    location = /api/sw-reset {
        default_type text/html;
        add_header Clear-Site-Data '"cache", "executionContexts"' always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;
        return 200 '<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="3;url=/?nexus_recovered=meta"><title>Updating</title><style>body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#0f172a;color:#94a3b8;min-height:100vh;display:flex;align-items:center;justify-content:center}main{display:flex;align-items:center;gap:.6rem;font-size:.875rem;letter-spacing:.01em}.dot{width:8px;height:8px;border-radius:50%;background:#6366f1;animation:p 1.4s ease-in-out infinite}@keyframes p{0%,100%{opacity:.3;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}a{color:#475569;text-decoration:none;font-size:.75rem;margin-left:1rem;border-bottom:1px dotted #475569}a:hover{color:#94a3b8;border-bottom-color:#94a3b8}</style></head><body><main><span class="dot" aria-hidden="true"></span><span>Updating</span><a href="/">tap if stuck</a></main><script>(function(){var done=false;function go(){if(done)return;done=true;try{window.location.replace("/?nexus_recovered="+Date.now())}catch(e){window.location.href="/?nexus_recovered="+Date.now()}}setTimeout(go,2500);function tmo(ms){return new Promise(function(r){setTimeout(r,ms)})}function race(p,ms){return Promise.race([p,tmo(ms)])}function uw(){try{if(!("serviceWorker" in navigator))return Promise.resolve();return race(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){try{return r.unregister().catch(function(){})}catch(e){return Promise.resolve()}}))}).catch(function(){}),1500)}catch(e){return Promise.resolve()}}function cc(){try{if(!("caches" in window))return Promise.resolve();return race(caches.keys().then(function(ks){return Promise.all(ks.map(function(k){try{return caches.delete(k).catch(function(){})}catch(e){return Promise.resolve()}}))}).catch(function(){}),1500)}catch(e){return Promise.resolve()}}uw().then(cc).then(go)})()</script></body></html>';
    }

    location ~* ^/(sw\.js|sw-rescue\.js|workbox-[^/]+\.js)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        access_log off;
    }

    location ^~ /uploads/ {
        # Public media must remain browser-accessible; `internal` would break all
        # uploaded images. The upstream host is deployment-controlled, not derived
        # from the request, so this is not an SSRF proxy.
        proxy_pass http://${NEXUS_API_UPSTREAM}:80; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
        proxy_set_header Host api.project-nexus.ie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Translation catalogs are runtime data, not SPA routes. If a catalog is
    # missing, fail with 404 instead of returning _spa.html as text/html;
    # i18next otherwise retries forever while React remains suspended.
    location ^~ /locales/ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header Vary "Accept-Encoding";
        access_log off;
    }

    # 🔴 The Changelog page fetches this file and renders whatever comes back.
    # `location /` below ends in an unconditional `return 421` (the SPA shell) and never
    # tries the file on disk, so /changelog.md answered 200 with index.html — and because
    # the page only checks `res.ok`, it accepted that HTML as the changelog and rendered
    # the app's own markup to members. The single-colour `nginx.conf` still has the
    # `try_files $uri` this config dropped, so the page worked there and regressed when
    # blue/green landed. Exact-match, so it cannot widen anything else.
    location = /changelog.md {
        default_type text/markdown;
        try_files $uri =404;
        expires 5m;
        add_header Cache-Control "public, max-age=300";
        add_header Vary "Accept-Encoding";
    }

    # The dynamic manifest must retain the browser-facing hostname so Laravel
    # resolves the custom-domain tenant rather than the API/master tenant.
    location = /api/v2/pwa/manifest {
        proxy_pass http://${NEXUS_API_UPSTREAM}:80; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Same-origin API proxy for browser-owned resources such as the dynamic
    # tenant PWA manifest. Without this route, /api/* falls through to the SPA
    # shell and the browser tries to parse text/html as manifest JSON.
    location ^~ /api/ {
        proxy_pass http://${NEXUS_API_UPSTREAM}:80; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
        proxy_set_header Host api.project-nexus.ie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|webp|avif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
    }

    # Dedicated SPA shell used by normal fallbacks and the authenticated
    # maintenance renderer. Direct requests remain behind the same sentinel.
    location = /_spa.html {
        set $nexus_spa_maintenance 0;
        if (-f /usr/share/nginx/html/prerendered/.global-maintenance) { set $nexus_spa_maintenance 1; }
        if ($nexus_private_maintenance_render = "1") { set $nexus_spa_maintenance 0; }
        error_page 418 = @global_maintenance;
        if ($nexus_spa_maintenance = "1") { return 418; }
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header X-Nexus-Spa-Shell "1" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy $nexus_spa_content_security_policy always;
        add_header Reporting-Endpoints 'nexus-csp="https://api.project-nexus.ie/api/csp-report"' always;
    }

    location = /index.html {
        set $nexus_global_maintenance 0;
        if (-f /usr/share/nginx/html/prerendered/.global-maintenance) { set $nexus_global_maintenance 1; }
        error_page 418 = @global_maintenance;
        if ($nexus_global_maintenance = "1") { return 418; }
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header X-Nexus-Spa-Shell "1" always;
        # try_files fallback in `location /` and `location = /` rewrites to
        # the SPA shell, which lands here for final processing. Without these
        # repeated headers, every user-facing HTML response from the SPA shell
        # would ship with zero security headers.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy $nexus_spa_content_security_policy always;
        add_header Reporting-Endpoints 'nexus-csp="https://api.project-nexus.ie/api/csp-report"' always;
    }

    location ~* ^/(build-info\.json|manifest\.json)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    location = /robots.txt {
        sub_filter 'app.project-nexus.ie' $host;
        sub_filter_types text/plain;
        sub_filter_once on;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # IndexNow verifies ownership by fetching this exact key from every tenant
    # host. The SPA catch-all intentionally bypasses normal static lookup, so
    # expose the shipped key explicitly instead of returning index.html.
    location = /b0c4bb7b09d91e2a7c335f81399e94f4.txt {
        default_type text/plain;
        try_files /b0c4bb7b09d91e2a7c335f81399e94f4.txt =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none';" always;
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }

    location ~ ^/sitemap(-[a-zA-Z0-9_-]+)?\.xml$ {
        proxy_ssl_server_name on;
        proxy_set_header Host api.project-nexus.ie;
        proxy_set_header X-Sitemap-Host $host;
        proxy_pass https://api.project-nexus.ie;
    }

    # AI-readable site summary (llmstxt.org convention).
    # Same backend pattern as the sitemap — host-aware tenant resolution.
    location ~ ^/llms(-full)?\.txt$ {
        proxy_ssl_server_name on;
        proxy_set_header Host api.project-nexus.ie;
        proxy_set_header X-Sitemap-Host $host;
        proxy_pass https://api.project-nexus.ie;
        add_header X-Robots-Tag "noindex" always;
    }

    location ~* ^/(wp-login\.php|wp-admin|wp-includes|wp-json|xmlrpc\.php) {
        return 410;
    }

    location ~* ^/wp-content/ {
        return 410;
    }

    location = /wp-sitemap.xml {
        return 301 /sitemap.xml;
    }

    location ~* ^/guides/ {
        return 410;
    }

    location = /southern-star/ {
        return 410;
    }

    location = /southern-star {
        return 410;
    }

    location = /community-directory/ {
        return 301 /explore;
    }

    location = /community-directory {
        return 301 /explore;
    }

    # Legacy WordPress /directory/ (including ?nexus_type=hubs and similar
    # taxonomy query variants). No SPA equivalent — consolidate to /explore.
    location ~* ^/directory(/.*)?$ {
        return 301 /explore;
    }

    # Legacy WordPress slug for the timebanking explainer.
    location ~* ^/how-timebanking-works(/.*)?$ {
        return 301 /timebanking-guide;
    }

    # Legacy /account/login/ from the pre-React auth flow.
    location ~* ^/account/login(/.*)?$ {
        return 301 /login;
    }
    location ~* ^/account/?$ {
        return 301 /login;
    }

    # Old "/home/" duplicate of "/". Indexed by Google as a separate URL,
    # split link equity. 301 consolidates it.
    location = /home/ { return 301 /; }
    location = /home  { return 301 /; }

    # Test routes that leaked into the public index.
    location ~* ^/testing(/.*)?$    { return 410; }
    location ~* ^/login-test(/.*)?$ { return 410; }

    # Legacy WordPress URLs from the pre-React site that are still in
    # search-engine indexes. Only paths with NO equivalent React route are
    # listed here — paths like /social-prescribing, /members, /feed are
    # real React routes (gated, but real) and must fall through to the SPA.
    location ~* ^/membership/?$         { return 301 /about; }
    location ~* ^/sign-up/?$            { return 301 /register; }
    location ~* ^/social-impact-study/?$ { return 301 /blog; }
    location ~* ^/news/?$               { return 301 /blog; }
    location ~* ^/category/[^/]+/?$     { return 301 /blog; }
    location ~* ^/tag/[^/]+/?$          { return 301 /blog; }
    location = /comments/feed/          { return 410; }
    location ~* ^/\?p=[0-9]+$           { return 301 /blog; }

    # /pricing and /book-a-demo are linked from the project-nexus.ie sales site
    # but are not React routes on tenant frontends. Send tenant-domain hits to
    # a real page rather than letting them land on a blank SPA shell.
    location = /pricing      { return 301 /; }
    location = /pricing/     { return 301 /; }
    location = /book-a-demo  { return 301 /contact; }
    location = /book-a-demo/ { return 301 /contact; }

    location ~* ^/vendor/ {
        return 410;
    }

    location ~* ^/author/ {
        return 410;
    }

    location = / {
        # The canonical maintenance script writes this shared sentinel before
        # touching DB/PHP state. Serve a truthful 503 SPA shell and never an
        # old tenant snapshot. The private renderer lane is authenticated in
        # @global_maintenance; the public query-string snapshot bypass is not
        # an authorization boundary and therefore cannot clear this gate.
        set $nexus_global_maintenance 0;
        if (-f /usr/share/nginx/html/prerendered/.global-maintenance) { set $nexus_global_maintenance 1; }
        error_page 418 = @global_maintenance;
        if ($nexus_global_maintenance = "1") { return 418; }
        set $nexus_safe_prerender_enabled $nexus_prerender_enabled;
        set $nexus_safe_prerender_status $nexus_prerender_effective_status;
        if (!-f /usr/share/nginx/html/prerendered/.tenant-identity-v1) { set $nexus_safe_prerender_enabled 0; }
        if (!-f /usr/share/nginx/html/prerendered/.tenant-identity-v1) { set $nexus_safe_prerender_status ""; }
        # Root snapshots participate in the same status contract as every
        # other route. In particular, a tenant maintenance landing page must
        # remain HTTP 503 instead of being silently promoted to 200.
        error_page 404 =404 @prerender_send_body;
        error_page 410 =410 @prerender_send_body;
        error_page 503 =503 @prerender_send_body;
        if ($nexus_safe_prerender_status = "404") { return 404; }
        if ($nexus_safe_prerender_status = "410") { return 410; }
        if ($nexus_safe_prerender_status = "503") { return 503; }
        error_page 419 = @prerender_root_snapshot;
        if ($nexus_safe_prerender_enabled = "1") { return 419; }
        error_page 421 =200 @spa_shell;
        return 421;
        # HTML is never cached at the CDN. Bots and users get different responses
        # at the same URL (snapshot vs SPA), so a per-URL CDN cache would poison
        # across user-agents. The PWA's NetworkFirst handles user-side freshness;
        # CF still caches all the immutable /assets/* bundles.
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Vary "User-Agent" always;
        add_header X-Nexus-Spa-Shell "1" always;
        # Re-declare the server-level security headers. nginx's add_header rule
        # is "no inheritance if defined locally" — once we set Cache-Control
        # here, every add_header at server level is dropped from the response.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy $nexus_spa_content_security_policy always;
        add_header Reporting-Endpoints 'nexus-csp="https://api.project-nexus.ie/api/csp-report"' always;
    }

    location / {
        set $nexus_global_maintenance 0;
        if (-f /usr/share/nginx/html/prerendered/.global-maintenance) { set $nexus_global_maintenance 1; }
        error_page 418 = @global_maintenance;
        if ($nexus_global_maintenance = "1") { return 418; }
        set $nexus_safe_prerender_enabled $nexus_prerender_enabled;
        set $nexus_safe_prerender_ai $nexus_is_ai_bot;
        set $nexus_safe_prerender_status $nexus_prerender_effective_status;
        if (!-f /usr/share/nginx/html/prerendered/.tenant-identity-v1) { set $nexus_safe_prerender_enabled 0; }
        if ($nexus_safe_prerender_enabled = "0") { set $nexus_safe_prerender_ai 0; }
        if (!-f /usr/share/nginx/html/prerendered/.tenant-identity-v1) { set $nexus_safe_prerender_status ""; }
        # Status-code propagation for prerendered snapshots (Phase 1.2).
        # If the worker marked this route non-200 via <meta name="prerender-status-code">,
        # $nexus_prerender_effective_status will be set. `return N` triggers
        # error_page, which then internally redirects to @prerender_send_body
        # to serve the snapshot HTML — preserving the non-200 status.
        error_page 404 =404 @prerender_send_body;
        error_page 410 =410 @prerender_send_body;
        error_page 503 =503 @prerender_send_body;
        if ($nexus_safe_prerender_status = "404") { return 404; }
        if ($nexus_safe_prerender_status = "410") { return 410; }
        if ($nexus_safe_prerender_status = "503") { return 503; }
        # 301 is captured by the worker but we don't have a Location header
        # to emit from here. Treat as a soft 200 until a use case lands.

        error_page 419 = @prerender_page_snapshot;
        error_page 420 = @prerender_markdown_snapshot;
        if ($nexus_safe_prerender_ai = "1") { return 420; }
        if ($nexus_safe_prerender_enabled = "1") { return 419; }
        error_page 421 =200 @spa_shell;
        return 421;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Vary "User-Agent" always;
        add_header X-Nexus-Spa-Shell "1" always;
        # Same security-header re-declaration as `location = /`. See comment above.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy $nexus_spa_content_security_policy always;
        add_header Reporting-Endpoints 'nexus-csp="https://api.project-nexus.ie/api/csp-report"' always;
    }

    # Snapshot storage is never a public URL namespace. Bot requests enter a
    # named location whose document root is the shared cache itself; public
    # /prerendered/* requests are rejected before filesystem lookup.
    location = /prerendered { return 404; }
    location ^~ /prerendered/ {
        return 404;
    }

    location @prerender_root_snapshot {
        internal;
        root /usr/share/nginx/html/prerendered;
        try_files /$host/index.html @spa_shell;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Vary "User-Agent" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy $nexus_spa_content_security_policy always;
        add_header Reporting-Endpoints 'nexus-csp="https://api.project-nexus.ie/api/csp-report"' always;
    }

    location @prerender_page_snapshot {
        internal;
        root /usr/share/nginx/html/prerendered;
        try_files /$host$uri/index.html @spa_shell;
        types {
            text/html html;
            text/markdown md;
        }
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Vary "User-Agent" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy $nexus_spa_content_security_policy always;
        add_header Reporting-Endpoints 'nexus-csp="https://api.project-nexus.ie/api/csp-report"' always;
    }

    location @spa_shell {
        internal;
        root /usr/share/nginx/html;
        try_files /_spa.html /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy $nexus_spa_content_security_policy always;
        add_header Reporting-Endpoints 'nexus-csp="https://api.project-nexus.ie/api/csp-report"' always;
    }

    location @prerender_markdown_snapshot {
        internal;
        root /usr/share/nginx/html/prerendered;
        try_files /$host$uri/index.md /$host$uri/index.html @spa_shell;
        types {
            text/html html;
            text/markdown md;
        }
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Vary "User-Agent" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    # Internal target for status-code propagation. Each caller uses an
    # explicit `=404`, `=410`, or `=503` override; bare `=` would adopt the
    # static file handler's 200 and silently turn error snapshots into success.
    location @prerender_send_body {
        internal;
        root /usr/share/nginx/html/prerendered;
        # `$uri` never includes query arguments. Building the snapshot path
        # from `$request_uri` made `/about?utm=x` look for a literal query
        # string in the filename and could serve the SPA under a 503 status.
        try_files /$host$uri/index.html @spa_shell;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Retry-After $nexus_prerender_retry_after always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy $nexus_spa_content_security_policy always;
        add_header Reporting-Endpoints 'nexus-csp="https://api.project-nexus.ie/api/csp-report"' always;
    }

    location @global_maintenance {
        internal;
        set $nexus_private_maintenance_render 1;
        if ($nexus_maintenance_render_authenticated = "0") { return 503; }
        try_files /_spa.html /index.html =503;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Vary "Authorization" always;
        add_header Retry-After $nexus_maintenance_retry_after always;
        add_header X-Nexus-Maintenance $nexus_maintenance_public_header always;
        add_header X-Nexus-Maintenance-Render $nexus_maintenance_private_header always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy $nexus_spa_content_security_policy always;
        add_header Reporting-Endpoints 'nexus-csp="https://api.project-nexus.ie/api/csp-report"' always;
    }

    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Allow /.well-known/* (security.txt per RFC 9116, plus future ACME
    # http-01 challenge files if we ever need them). Listed BEFORE the
    # dotfile-deny rule so it wins the longest-prefix-match.
    location ^~ /.well-known/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
