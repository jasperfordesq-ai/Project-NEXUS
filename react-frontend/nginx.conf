# =============================================================================
# Project NEXUS - React Frontend Nginx Configuration
# =============================================================================
# Serves the built React SPA with proper routing and caching
# =============================================================================

# =============================================================================
# Bot-only prerender serving.
#
# Real users always get the live SPA index.html — never a prerendered snapshot.
# This decouples snapshot freshness from user-facing correctness: a snapshot
# can reference stale build-hashed asset URLs without breaking page hydration,
# because the browser that loads those URLs is not the one that needs to
# execute the JS. Bots ignore JS entirely; they only read body + meta.
#
# The Playwright worker sets ?nexus_prerender_bypass=1 to render against the
# live SPA (else it would render a snapshot of a snapshot).
# =============================================================================
map $http_user_agent $nexus_is_seo_bot {
    default 0;
    # See nginx.bluegreen.conf for the canonical comment block listing crawlers.
    "~*(googlebot|bingbot|slurp|duckduckbot|baiduspider|yandex|sogou|exabot|applebot|petalbot|seznambot|facebookexternalhit|twitterbot|linkedinbot|embedly|pinterest|slackbot|whatsapp|telegrambot|discordbot|redditbot|viberbot|skypeuripreview|vkshare|ahrefsbot|semrushbot|mj12bot|chrome-lighthouse|screaming\\s*frog|dotbot|rogerbot|sitebulb|gptbot|oai-searchbot|chatgpt-user|claudebot|claude-web|anthropic-ai|perplexitybot|perplexity-user|bytespider|ccbot|google-extended|amazonbot|applebot-extended|cohere-ai|diffbot|you\\.com|neevabot)" 1;
}

map "$nexus_is_seo_bot:$arg_nexus_prerender_bypass" $nexus_prerender_page {
    default /__nexus_prerender_bypass__;
    "1:"  /prerendered/$host$uri/index.html;
    "1:0" /prerendered/$host$uri/index.html;
}

map "$nexus_is_seo_bot:$arg_nexus_prerender_bypass" $nexus_prerender_root {
    default /__nexus_prerender_bypass__;
    "1:"  /prerendered/$host/index.html;
    "1:0" /prerendered/$host/index.html;
}

# One canonical browser policy for every SPA shell and prerender response.
# Keeping the value in a map prevents nginx's location-level add_header
# redeclarations from drifting as maintained integrations change.
map $host $nexus_spa_content_security_policy {
    default "default-src 'self'; script-src 'self' https://maps.googleapis.com https://maps.gstatic.com https://js.pusher.com https://analytics.ahrefs.com https://js.stripe.com https://checkout.stripe.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com https://*.google.com https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://api.maptiler.com https://api.os.uk https://api.project-nexus.ie ${NEXUS_CSP_EXTRA_ORIGINS} https://*.giphy.com https://giphy.com https://*.stripe.com https://img.youtube.com https://i.ytimg.com; connect-src 'self' https://api.project-nexus.ie ${NEXUS_CSP_EXTRA_ORIGINS} https://*.pusher.com wss://*.pusher.com https://*.googleapis.com https://*.gstatic.com https://*.google.com https://nominatim.openstreetmap.org https://firebaseinstallations.googleapis.com https://fcmregistrations.googleapis.com https://api.giphy.com https://*.ingest.de.sentry.io https://analytics.ahrefs.com https://api.stripe.com https://checkout.stripe.com https://api.openai.com https://api.pwnedpasswords.com; frame-src 'self' https://api.project-nexus.ie ${NEXUS_CSP_EXTRA_ORIGINS} https://*.google.com https://js.stripe.com https://hooks.stripe.com https://checkout.stripe.com https://challenges.cloudflare.com https://www.youtube-nocookie.com https://www.youtube.com https://youtube.com https://player.vimeo.com https://open.spotify.com https://w.soundcloud.com https://player.twitch.tv https://clips.twitch.tv https://www.tiktok.com; media-src 'self' https: blob:; worker-src 'self' blob:; frame-ancestors 'self'; form-action 'self'; object-src 'none'; base-uri 'self'; report-uri https://api.project-nexus.ie/api/csp-report; report-to nexus-csp;";
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=(self)" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # CSP notes:
    #  - 'unsafe-eval' removed from script-src. React prod bundles do not need
    #    eval(); keeping it open was a latent XSS amplifier.
    #  - 'unsafe-inline' removed from script-src. Vite production builds emit only
    #    <script type="module"> tags with hashed filenames — no inline scripts are
    #    injected, so 'unsafe-inline' was a latent XSS amplifier with no benefit.
    #  - connect-src: added https://checkout.stripe.com (Stripe Checkout hosted
    #    session) and https://api.openai.com (ChatGPT feature for /chat route)
    #    which were previously CSP-blocked.
    #  - form-action 'self' prevents exfil via hidden <form action="https://evil">
    #    submissions; forms are generated client-side so 'self' is correct.
    add_header Content-Security-Policy $nexus_spa_content_security_policy always;
    add_header Reporting-Endpoints 'nexus-csp="https://api.project-nexus.ie/api/csp-report"' always;

    # =========================================================================
    # Emergency SW kill-switch — /api/sw-reset (single-color fallback config).
    # See nginx.bluegreen.conf for full rationale.
    # =========================================================================
    location = /api/sw-reset {
        default_type text/html;
        add_header Clear-Site-Data '"cache", "executionContexts"' always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;
        return 200 '<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="3;url=/?nexus_recovered=meta"><title>Updating</title><style>body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#0f172a;color:#94a3b8;min-height:100vh;display:flex;align-items:center;justify-content:center}main{display:flex;align-items:center;gap:.6rem;font-size:.875rem;letter-spacing:.01em}.dot{width:8px;height:8px;border-radius:50%;background:#6366f1;animation:p 1.4s ease-in-out infinite}@keyframes p{0%,100%{opacity:.3;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}a{color:#475569;text-decoration:none;font-size:.75rem;margin-left:1rem;border-bottom:1px dotted #475569}a:hover{color:#94a3b8;border-bottom-color:#94a3b8}</style></head><body><main><span class="dot" aria-hidden="true"></span><span>Updating</span><a href="/">tap if stuck</a></main><script>(function(){var done=false;function go(){if(done)return;done=true;try{window.location.replace("/?nexus_recovered="+Date.now())}catch(e){window.location.href="/?nexus_recovered="+Date.now()}}setTimeout(go,2500);function tmo(ms){return new Promise(function(r){setTimeout(r,ms)})}function race(p,ms){return Promise.race([p,tmo(ms)])}function uw(){try{if(!("serviceWorker" in navigator))return Promise.resolve();return race(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){try{return r.unregister().catch(function(){})}catch(e){return Promise.resolve()}}))}).catch(function(){}),1500)}catch(e){return Promise.resolve()}}function cc(){try{if(!("caches" in window))return Promise.resolve();return race(caches.keys().then(function(ks){return Promise.all(ks.map(function(k){try{return caches.delete(k).catch(function(){})}catch(e){return Promise.resolve()}}))}).catch(function(){}),1500)}catch(e){return Promise.resolve()}}uw().then(cc).then(go)})()</script></body></html>';
    }

    # Service worker files must NEVER be cached.
    # sw.js and workbox-*.js are plain .js files and would otherwise get the
    # 1-year immutable rule below — which prevents the browser from ever fetching
    # a new version, breaking update detection on all browsers (especially mobile).
    # The SW spec also requires sw.js to be served with no-store/no-cache so the
    # browser always checks for a byte-change on each registration.update() call.
    location ~* ^/(sw\.js|sw-rescue\.js|workbox-[^/]+\.js)$ {
        expires -1;
        # Re-state ALL security headers — nginx add_header in nested location blocks
        # does NOT inherit server-level headers; they must be repeated here.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy $nexus_spa_content_security_policy always;
        add_header Reporting-Endpoints 'nexus-csp="https://api.project-nexus.ie/api/csp-report"' always;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        access_log off;
    }

    # Proxy user-uploaded files to the PHP app container (which holds the uploads volume).
    # ^~ prefix takes priority over regex location blocks so the static-asset
    # caching rule below never intercepts upload paths and returns a 404.
    location ^~ /uploads/ {
        proxy_pass http://nexus-php-app:80;
        proxy_set_header Host api.project-nexus.ie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Security headers — must be stated explicitly; not inherited from server block.
        # X-Robots-Tag prevents upload paths from being indexed by search engines.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=(self)" always;
        # Restrictive CSP for binary uploads — prevents script execution if a browser
        # tries to render an upload as HTML; frame-ancestors blocks clickjacking.
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;
    }

    # The dynamic manifest must retain the browser-facing hostname so Laravel
    # resolves the custom-domain tenant rather than the API/master tenant.
    location = /api/v2/pwa/manifest {
        proxy_pass http://nexus-php-app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Same-origin API proxy used by CI smoke tests and safe for production SPA
    # builds that use VITE_API_BASE=/api. Keep the browser-facing port: CI serves
    # the SPA on :3000, and the refresh-cookie origin guard compares that port.
    location ^~ /api/ {
        proxy_pass http://nexus-php-app:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    location = /health.php {
        proxy_pass http://nexus-php-app:80;
        proxy_set_header Host api.project-nexus.ie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Cache static assets aggressively (hashed filenames — safe to cache forever)
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|avif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        # Re-state security headers — nginx add_header in nested location blocks
        # does NOT inherit server-level headers; they must be repeated here.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'none';" always;

        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
    }

    # Don't cache the index.html (for updates to take effect)
    location = /index.html {
        expires -1;
        # Re-state ALL security headers — nginx add_header in nested location blocks
        # does NOT inherit server-level headers; they must be repeated here.
        # This location is critical: it is the entry point the browser loads first.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy $nexus_spa_content_security_policy always;
        add_header Reporting-Endpoints 'nexus-csp="https://api.project-nexus.ie/api/csp-report"' always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header X-Nexus-Spa-Shell "1" always;
    }

    # robots.txt — served from built frontend assets with dynamic Sitemap URL.
    # The static file references app.project-nexus.ie, but when served from a
    # custom domain (e.g., hour-timebank.ie), the Sitemap directive must match
    # the serving domain. sub_filter rewrites it on the fly.
    # Build metadata and PWA manifest must stay fresh so update checks and
    # install metadata are not held behind the SPA fallback cache policy.
    location ~* ^/(build-info\.json|manifest\.json)$ {
        expires -1;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'none';" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    location = /robots.txt {
        # 🔴 `sub_filter_once` MUST stay `off` — see the matching note in
        # nginx.bluegreen.conf. robots.txt's first line is a comment naming
        # app.project-nexus.ie, so `once on` spent the only substitution there
        # and left the `Sitemap:` line pointing at the platform host for every
        # tenant domain. Found 2026-09-13.
        sub_filter 'app.project-nexus.ie' $host;
        sub_filter_types text/plain;
        sub_filter_once off;
        expires 1d;
        # Re-state security headers — nginx add_header in nested location blocks
        # does NOT inherit server-level headers; they must be repeated here.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'none';" always;

        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # IndexNow verifies ownership by fetching this exact key from every tenant
    # host. The SPA catch-all intentionally bypasses normal static lookup, so
    # expose the shipped key explicitly instead of returning index.html.
    location = /b0c4bb7b09d91e2a7c335f81399e94f4.txt {
        default_type text/plain;
        try_files /b0c4bb7b09d91e2a7c335f81399e94f4.txt =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none';" always;
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }

    # Sitemap — proxy to API backend (which generates the XML from the database)
    # This makes app.project-nexus.ie/sitemap.xml work, so Google Search Console
    # can find the sitemap on the same domain as the content URLs.
    location ~ ^/sitemap(-[a-zA-Z0-9_-]+)?\.xml$ {
        proxy_ssl_server_name on;
        proxy_set_header Host api.project-nexus.ie;
        proxy_set_header X-Sitemap-Host $host;
        proxy_pass https://api.project-nexus.ie;
    }

    # =========================================================================
    # WordPress Legacy URL Handling
    # =========================================================================
    # The site migrated from WordPress. Old URLs with backlinks must either
    # 301 redirect to their new equivalent (preserving link equity) or return
    # 410 Gone (telling Google to de-index). Without this, every old URL
    # returns 200 via the SPA catch-all, creating soft 404s that destroy SEO.
    # =========================================================================

    # Block WordPress infrastructure probes (security + SEO)
    location ~* ^/(wp-login\.php|wp-admin|wp-includes|wp-json|xmlrpc\.php) {
        return 410;
    }

    # Old WordPress content/upload paths — gone
    location ~* ^/wp-content/ {
        return 410;
    }

    # Old WordPress sitemap — redirect to the real one
    location = /wp-sitemap.xml {
        return 301 /sitemap.xml;
    }

    # Old WordPress /guides/ content — no equivalent, tell Google it's gone
    location ~* ^/guides/ {
        return 410;
    }

    # Old WordPress pages that have no new equivalent
    location = /southern-star/ {
        return 410;
    }
    location = /southern-star {
        return 410;
    }
    location = /community-directory/ {
        return 301 /explore;
    }
    location = /community-directory {
        return 301 /explore;
    }

    # Old WordPress /vendor/ paths — gone
    location ~* ^/vendor/ {
        return 410;
    }

    # Old WordPress /author/ paths — gone
    location ~* ^/author/ {
        return 410;
    }

    # =========================================================================
    # Page serving — per-tenant pre-rendered HTML + SPA fallback
    # =========================================================================
    # Pre-rendered HTML is generated per-tenant AFTER deploy (not at build
    # time) by scripts/prerender-tenants.sh. Files are written into the
    # persistent volume at /usr/share/nginx/html/prerendered/{domain}/{route}/index.html.
    #
    # Strategy:
    #   1. Check for per-tenant pre-rendered file (by $host domain)
    #   2. Fall back to the clean SPA shell (_spa.html) for all other requests
    #
    # Bots get pre-rendered HTML when available. Real users get the clean SPA
    # shell so protected/admin routes do not first paint a public snapshot.
    # =========================================================================

    location = / {
        try_files $nexus_prerender_root /_spa.html /index.html;
        # Re-state ALL security headers — nginx add_header in nested location blocks
        # does NOT inherit server-level headers; they must be repeated here.
        # This block serves tenant home pages, so all six headers are required.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy $nexus_spa_content_security_policy always;
        add_header Reporting-Endpoints 'nexus-csp="https://api.project-nexus.ie/api/csp-report"' always;

        # HTML is never cached at the CDN. Bots and users get different responses
        # at the same URL (snapshot vs SPA), so a per-URL CDN cache would poison
        # across user-agents. The PWA's NetworkFirst handles user-side freshness;
        # CF still caches all the immutable /assets/* bundles.
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Vary "User-Agent" always;
        add_header X-Nexus-Spa-Shell "1" always;
    }

    location / {
        # Try: static asset → per-tenant pre-rendered page → SPA shell.
        # Deploy-time prerenders use ?nexus_prerender_bypass=1 so they cannot
        # accidentally capture stale cached HTML with old Vite asset hashes.
        # Non-root routes must not fall back to the home-page prerender.
        try_files $uri $nexus_prerender_page /_spa.html /index.html;
        # Re-state ALL security headers — nginx add_header in nested location blocks
        # does NOT inherit server-level headers; they must be repeated here.
        # This block serves the vast majority of production traffic (pre-rendered
        # tenant pages + SPA fallback), so all six headers are required.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy $nexus_spa_content_security_policy always;
        add_header Reporting-Endpoints 'nexus-csp="https://api.project-nexus.ie/api/csp-report"' always;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Vary "User-Agent" always;
        add_header X-Nexus-Spa-Shell "1" always;
    }

    # Health check endpoint
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Block access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
